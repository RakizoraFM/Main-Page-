 var nt=N.toLocaleString;N.toLocaleString=function(l,op){return nt.call(this,fix(l,0),op)};

 var W1=function(l,op){return new DT(fix(l,1),op)};W1.prototype=DT.prototype;W1.supportedLocalesOf=DT.supportedLocalesOf;Intl.DateTimeFormat=W1;
 var W2=function(l,op){return new NF(fix(l,0),op)};W2.prototype=NF.prototype;W2.supportedLocalesOf=NF.supportedLocalesOf;Intl.NumberFormat=W2;
}catch(e){}})();

button,input,select,textarea{font-family:inherit;font-size:15px}
.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:11.5px;color:#94a3b8;font-weight:700}
.top button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-weight:800}
.wrap{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;color:#334155}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs b{display:inline-block;min-width:20px;margin-inline-start:4px;border-radius:999px;background:rgba(100,116,139,.15);padding:0 6px;font-size:12px}
.tabs button.on b{background:rgba(255,255,255,.2)}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk{display:block;width:100%;text-align:start;cursor:pointer}
.tk .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tk .id{font:900 13px monospace;color:var(--pri)}
.tk .sch{font-weight:900;font-size:15.5px;margin:3px 0 1px}
.tk .cat{color:var(--mut);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#f8fafc;color:#334155}
.c-bad{color:var(--bad);background:#fef2f2;border-color:#fecaca}.c-warn{color:var(--warn);background:#fffbeb;border-color:#fde68a}.c-ok{color:var(--ok);background:#f0fdf4;border-color:#bbf7d0}.c-pri{color:#3730a3;background:#eef2ff;border-color:#c7d2fe}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}
.sheet.open{display:block}
h3{margin:0 0 8px;font-size:15px;font-weight:900}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv span{color:var(--mut);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{border:0;border-radius:12px;padding:13px 10px;font-weight:900;background:#e2e8f0;color:var(--ink);text-decoration:none;text-align:center;display:block}
.big.p{background:var(--pri);color:#fff}.big.g{background:var(--ok);color:#fff}.big.d{background:#0f172a;color:#fff}
.big:disabled{opacity:.45}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#334155}
.stages button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stages button:disabled{opacity:.4}
label.l{display:block;font-weight:800;font-size:13px;color:#475569;margin:10px 0 4px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff}
textarea.in{min-height:90px;line-height:1.8}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e2e8f0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph figcaption{position:absolute;inset:auto 0 0 0;background:rgba(15,23,42,.6);color:#fff;font-size:11px;padding:1px 6px}
.cam{display:flex;gap:8px}.cam label{flex:1;border:1.5px dashed #94a3b8;border-radius:12px;padding:12px 8px;text-align:center;font-weight:800;background:#f8fafc}
.cam input{display:none}
.note{border:1px solid #fde68a;background:#fffbeb;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13.5px}.note small{display:block;color:#92400e;font-weight:800}
.tl{list-style:none;margin:0;padding:0}.tl li{border-right:2px solid var(--line);padding:0 12px 10px 0;margin-right:5px;position:relative;font-size:13.5px}
.tl li:before{content:'';position:absolute;right:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:#94a3b8}
.tl small{color:var(--mut);font-weight:800;display:block}
.bar{position:fixed;inset:auto 0 0 0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px}
.bar .big{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:99;background:#0f172a;color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none;text-align:center}
.toast.e{background:#b42323}.toast.w{background:#b45309}
.q{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:800;font-size:13px;display:none}
.login{max-width:420px;margin:8vh auto;padding:0 16px}
.login .card{padding:22px 18px}
.login h2{text-align:center;margin:4px 0 4px;font-weight:900}
.login p{text-align:center;color:var(--mut);margin:0 0 10px;font-size:13.5px}
.link{color:var(--pri);font-weight:800;text-decoration:none}
.muted{color:var(--mut);font-size:12.5px}
.top .bm{width:32px;height:32px;flex:none;border-radius:9px;background:#fff;padding:2px;object-fit:contain}
.login .lg{display:block;width:min(220px,70%);height:auto;margin:0 auto 8px}
.bnav{position:fixed;inset:auto 0 0 0;z-index:25;background:#fff;border-top:1px solid var(--line);display:flex;padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);box-shadow:0 -4px 14px rgba(15,23,42,.06)}
.bnav button{flex:1;border:0;background:none;padding:6px 2px;font-weight:800;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px}
.bnav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
.bnav button.on{color:var(--pri);background:#eff6ff}.bnav button.on i{filter:none;opacity:1}
.hello{display:flex;align-items:center;gap:12px}
.hello .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;flex:none}
.hello b{display:block;font-size:16.5px}.hello span{display:block;color:var(--mut);font-size:12.5px;font-weight:800}.hello small{display:block;color:#94a3b8;font-size:12px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kpi i{font-style:normal;font-size:18px}.kpi b{font-size:26px;font-weight:900;line-height:1.2}.kpi span{color:var(--mut);font-size:12.5px;font-weight:800}
.kpi.bad{border-color:#fecaca;background:#fef2f2}.kpi.bad b{color:var(--bad)}.kpi.warn{border-color:#fde68a;background:#fffbeb}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.stats b{display:block;font-size:19px;font-weight:900}.stats span{color:var(--mut);font-size:12px;font-weight:800}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
.srow{display:flex;gap:8px;align-items:flex-start}.srow .search,.srow select{flex:1;margin-bottom:10px}
.fbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:900;color:#334155}.fbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fgrid label{font-weight:800;font-size:12.5px;color:#475569;display:flex;flex-direction:column;gap:4px}
.chk{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;color:#334155;margin:0 2px 10px}.chk input{width:18px;height:18px}
.smap{height:calc(100vh - 290px);min-height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#e2e8f0}
.sc .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.sc .r1 b{font-size:15.5px}
.pt{width:100%;border-collapse:collapse;font-size:13.5px}.pt th{color:var(--mut);font-size:12px;text-align:start;padding:4px}.pt td{padding:7px 4px;border-top:1px solid var(--line)}
.pop{font-family:Cairo,Tahoma,sans-serif;direction:rtl;text-align:right;min-width:170px}.pop b{font-size:14px}.pop .pb{display:flex;gap:6px;margin-top:8px}
.guide{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;font-weight:800;font-size:13.5px;line-height:1.8}
.urg{position:relative}.urg .first{position:absolute;top:-8px;left:10px;z-index:2;background:#dc2626;color:#fff;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:900}
.urg .why{margin:-6px 4px 10px;font-size:12.5px;font-weight:800;color:#92400e}
.kpi.r-ok b{color:var(--ok)}.kpi.r-pri b{color:var(--pri)}.kpi.r-warn b{color:var(--warn)}.kpi.r-bad b{color:var(--bad)}
.hello img.av{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.avw{position:relative;cursor:pointer;flex:none}.avw .av{width:60px;height:60px;font-size:24px}.avw img.av{width:60px;height:60px}
.avw .cam{position:absolute;bottom:-2px;left:-2px;background:#fff;border:1px solid var(--line);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:12px}
.rate{display:flex;gap:14px;align-items:center}.rv{flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-content:center;text-align:center;border:6px solid currentColor}
.rv b{font-size:26px;font-weight:900;line-height:1}.rv span{font-size:12px;font-weight:900}.rv.r-ok{color:var(--ok)}.rv.r-pri{color:var(--pri)}.rv.r-warn{color:var(--warn)}.rv.r-bad{color:var(--bad)}
.rbars{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}.sb{display:grid;grid-template-columns:1fr auto;gap:3px 6px;align-items:center;font-size:12.5px;font-weight:800}.sb small{color:var(--mut);font-weight:700}.sb div{grid-column:1/-1;order:3}
.sb div{height:8px;background:#f1f5f9;border-radius:99px;overflow:hidden}.sb i{display:block;height:100%;border-radius:99px}.sb i.ok{background:var(--ok)}.sb i.warn{background:#d97706}.sb i.bad{background:var(--bad)}.sb b{text-align:left}
.pks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}.pk{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 10px;text-align:start;display:flex;flex-direction:column;gap:1px;color:var(--ink)}
.pk.cl{cursor:pointer;border-color:#c7d2fe}.pk:disabled{opacity:1}.pk span{color:var(--mut);font-size:12px;font-weight:800}.pk b{font-size:19px;font-weight:900}
.dl{font-size:11.5px;font-weight:800;color:var(--mut)}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.lg{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12.5px;font-weight:800;color:#334155;margin-bottom:6px}.lg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-left:5px;vertical-align:middle}
.cbox{position:relative}.chart{width:100%;height:auto;display:block;touch-action:pan-y}.chart .gl{stroke:#eef2f7;stroke-width:1}.chart .ax{fill:#64748b;font:600 10px Cairo,Tahoma,sans-serif}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.chart .xh{stroke:#94a3b8;stroke-width:1;stroke-dasharray:3 3}.chart .dt{stroke:#fff;stroke-width:2}
.ctip{position:absolute;top:0;display:none;background:#0f172a;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px}
.tsch{display:block;width:100%;text-align:start;border:0;background:none;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink)}.tsch:last-child{border-bottom:0}
.tsch .r1{display:flex;justify-content:space-between;gap:8px;font-size:14px}.tsch .tb{height:6px;background:#f1f5f9;border-radius:99px;margin:5px 0 4px;overflow:hidden}.tsch .tb i{display:block;height:100%;background:#2a78d6;border-radius:99px}
.goal .r1{display:flex;justify-content:space-between;align-items:center}.gnum{font-size:13.5px;font-weight:800;margin:6px 0}.gnum b{font-size:24px;font-weight:900}
.gbar{height:10px;background:#f1f5f9;border-radius:99px;overflow:hidden;margin-bottom:6px}.gbar i{display:block;height:100%;background:var(--pri);border-radius:99px}.gbar i.ok{background:var(--ok)}.gbar i.warn{background:#d97706}
.rank{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:13.5px}.dots{position:relative;height:18px;margin:8px 4px 4px;background:linear-gradient(90deg,#fee2e2,#fef3c7,#dcfce7);border-radius:99px}
.dots i{position:absolute;top:4px;width:10px;height:10px;margin-right:-5px;border-radius:50%;background:#94a3b8;border:1.5px solid #fff}.dots i.me{background:var(--pri);width:14px;height:14px;top:2px;margin-right:-7px;z-index:2}
.abar{position:fixed;top:calc(env(safe-area-inset-top) + 8px);inset-inline:8px;z-index:60;background:#7f1d1d;color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.abar div{flex:1;min-width:0}.abar small{display:block;font-size:12px;opacity:.9;font-weight:700}.abar button{border:0;border-radius:9px;padding:7px 10px;font-weight:900;background:#fff;color:#7f1d1d}.abar button[data-a=x]{background:rgba(255,255,255,.15);color:#fff}
.plan{list-style:none;margin:10px 0 0;padding:0}.plan li{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.plan .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:13.5px}.sw input{width:22px;height:22px}
.plan-btn{width:100%;margin-bottom:10px;background:#0f172a!important;color:#fff!important}
.bnav button{position:relative}.bnav em{position:absolute;top:2px;left:calc(50% - 22px);min-width:17px;height:17px;border-radius:99px;background:#dc2626;color:#fff;font:900 10.5px/17px Cairo,sans-serif;font-style:normal;padding:0 4px}
/* F9: inspection result per checklist item, materials, item photos, arrival photos */
.ci.g .lvs{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-right:5px solid var(--c);border-radius:10px;padding:9px 10px;background:#fff;font:700 13.5px Cairo,Tahoma,sans-serif;color:var(--ink)}.ci.g .lvs.on{background:color-mix(in srgb,var(--c) 12%,#fff);border-color:var(--c);color:var(--c);font-weight:900}.ci.g .lvs:disabled{opacity:.7}
.ci.g .lv{display:flex;flex-direction:column;gap:5px;margin-top:6px}.ci.g .lv button{display:flex;gap:8px;align-items:center;text-align:right;border:1px solid var(--line);border-right:5px solid var(--c);background:#fff;border-radius:10px;padding:8px 10px;font:700 13px Cairo,Tahoma,sans-serif;color:var(--ink)}
.ci.g .lv button i{font-style:normal;font-weight:900;color:var(--c);min-width:14px}.ci.g .lv button.on{background:color-mix(in srgb,var(--c) 14%,#fff);border-color:var(--c);font-weight:900}.ci.g .lv button:disabled{opacity:.6}
.nd{margin-top:6px;border:1px solid #fed7aa;background:#fff7ed;border-radius:10px;padding:6px 8px}.ndt{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.ndt button{border:1px solid #fdba74;background:#fff;border-radius:8px;padding:6px 4px;font:800 12.5px Cairo,Tahoma,sans-serif;color:#9a3412}.ndt button.on{background:#ea580c;border-color:#ea580c;color:#fff}
.ndr{display:grid;grid-template-columns:1fr 1fr auto;gap:4px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #fdba74}.ndr .cb{grid-column:1/-1}.ndr .in{margin:0;padding:7px 6px;font-size:13px}.ndr .u{align-self:center;font-weight:800;font-size:12.5px;color:#9a3412}.ndr .del{border:0;background:none;font-size:16px}
.ci.q.c{grid-template-columns:1fr}.ci.q.c .qr .del{border:0;background:none;font-size:16px}
.ci.q small.auto{display:block;color:#ea580c;font-weight:800;font-size:11.5px}
.ci.q{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.ci.q .qr{display:flex;gap:6px;align-items:center}.ci.q .qr span{font-size:11.5px;color:var(--mut)}.ci.q .qr .in{width:74px;margin:0;padding:7px}.ci.q .qr .in.u{width:64px}.ci.q .t{font-size:13px}
.ci.tx .seg{grid-template-columns:repeat(auto-fit,minmax(80px,1fr))!important}
.cisec{margin:12px 0 2px;background:#eef2ff;color:#3730a3;border-radius:10px;padding:7px 10px;font-weight:900;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}.cisec span{color:#64748b;font-size:12px}
.ci .t .no{display:inline-block;min-width:22px;text-align:center;background:#eef2ff;color:#3730a3;border-radius:6px;font-size:12px;margin-left:4px}
.ci.rep{background:linear-gradient(90deg,transparent,#ecfeff)}.ci .seg .on.fixed{background:#cffafe;border-color:#0891b2;color:#164e63}
.cph{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}.cph>span{font-weight:800;font-size:12.5px;min-width:52px}.cph>span.req{color:var(--bad)}
.cph img{width:54px;height:54px;object-fit:cover;border-radius:8px;display:block}.cph .plus{width:54px;height:54px;border:2px dashed #94a3b8;border-radius:8px;display:grid;place-items:center;font:900 24px Cairo,sans-serif;color:#475569;cursor:pointer}
.mat{margin-top:6px;border:1px solid #a5f3fc;background:#f0fdff;border-radius:10px;padding:6px 8px}.mat .mh{font-weight:900;font-size:13px;margin-bottom:4px}
.mr{display:grid;grid-template-columns:1fr 1fr 1.1fr 1.1fr auto;gap:4px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed #a5f3fc}.mr .w{grid-column:1/-1}
.cb{position:relative}.cb .in{width:100%;box-sizing:border-box;padding-left:30px}.cbok{position:absolute;left:10px;top:9px;color:var(--ok);font-weight:900}.cbok.o{color:var(--warn)}
.cbl{position:absolute;z-index:30;top:100%;right:0;left:0;max-height:260px;overflow:auto;background:#fff;border:1px solid #94a3b8;border-radius:10px;box-shadow:0 10px 24px rgba(15,23,42,.18);margin-top:2px}
.cbl button{display:block;width:100%;text-align:right;border:0;border-bottom:1px solid #f1f5f9;background:#fff;padding:9px 10px;font:700 14px Cairo,Tahoma,sans-serif;color:var(--ink)}
.cbl button b{background:#fef08a;font-weight:900}.cbl button small{display:block;color:var(--mut);font-size:11.5px}
.cbl button.wth{display:flex;align-items:center;gap:10px}.cbl button.wth img,.cbl button.wth .ni{width:42px;height:42px;flex:none;border-radius:8px;object-fit:cover;background:#f8fafc;border:1px solid #e2e8f0;display:grid;place-items:center;font-style:normal;font-size:20px;pointer-events:none}.cbl button.wth span{flex:1;min-width:0;pointer-events:none}

<script id="fm-offline-v191">
/* V191: tenant/account-scoped durable outbox. Never silently discard rejected work. */
(function(root){
'use strict';
const code=value=>{const v=String(value??'').normalize('NFKC').replace(/[\u200b-\u200f\u202a-\u202e\u061c\ufeff]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim().replace(/\.0+$/,'').replace(/\s+/g,'').toLowerCase();return v.replace(/^s[-_–—]?(?=\d+$)/,'').replace(/[-_–—]/g,'')};
class Outbox {
 constructor(storage,identity){this.storage=storage;this.identity=identity}
 scope(){const x=this.identity();return x&&x.url&&x.uid?encodeURIComponent(x.url.replace(/\/+$/,'').toLowerCase())+':'+encodeURIComponent(x.uid):''}
 key(scope=this.scope()){return scope?'fmf_queue_v191:'+scope:null}
 load(scope=this.scope()){const key=this.key(scope);if(!key)return [];const raw=this.storage.getItem(key);if(!raw)return [];const a=JSON.parse(raw);if(!Array.isArray(a))throw Error('تعذر قراءة التحديثات المحفوظة؛ لم تُحذف البيانات');return a}
 save(a,scope=this.scope()){const key=this.key(scope);if(!key)throw Error('يلزم تسجيل الدخول لحفظ التحديث على هذا الجهاز');this.storage.setItem(key,JSON.stringify(a))}
 stamp(op){return Object.assign({},op,{qid:op.qid||(root.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)),savedAt:op.savedAt||new Date().toISOString(),syncStatus:'pending'})}
 enqueue(op){const x=this.stamp(op),a=this.load();a.push(x);this.save(a);return x}
 // Merge acknowledgements with the latest queue so new edits made during a flush survive.
 settle(scope,updates){const a=this.load(scope),out=[];for(const o of a){if(!updates.has(o.qid)){out.push(o);continue}const u=updates.get(o.qid);if(u)out.push(u)}this.save(out,scope);return out}
}
root.FMOfflineV191={Outbox,code};
})(window);

</script>
<script>
/* FM Cloud core — thin wrapper over supabase-js used by the desktop platform and the field app.
   Every network call goes through FMCloud.api so it can be replaced in tests. */
(function(){
'use strict';
if(window.FMCloud&&window.FMCloud.__core)return;
const CKEY='fm_cloud_v136';
const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const S=v=>String(v??'').trim();
function cfg(){try{const o=JSON.parse(localStorage.getItem(CKEY)||'{}')||{};return {url:S(o.url).replace(/\/+$/,''),key:S(o.key)}}catch(e){return {url:'',key:''}}}
function setCfg(o){try{if(!o)localStorage.removeItem(CKEY);else localStorage.setItem(CKEY,JSON.stringify({url:S(o.url).replace(/\/+$/,''),key:S(o.key)}))}catch(e){}client=null}
let libP=null,client=null;
function ensureLib(){if(window.supabase&&window.supabase.createClient)return Promise.resolve(true);if(libP)return libP;
 libP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB;s.onload=()=>window.supabase?.createClient?res(true):rej(new Error('تعذر تحميل مكتبة Supabase'));s.onerror=()=>{libP=null;rej(new Error('تعذر تحميل مكتبة Supabase — تحقق من الاتصال بالإنترنت'))};document.head.appendChild(s)});return libP}
async function sb(){const c=cfg();if(!c.url||!c.key)throw new Error('لم يتم إعداد الاتصال بالسحابة');if(client)return client;await ensureLib();
 client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fm-cloud-auth'}});return client}
const chk=({data,error})=>{if(error)throw new Error(error.message||String(error));return data};
const ARmsg=m=>{m=String(m||'');if(/school rejected/i.test(m))return 'مدير المدرسة أفاد أن العمل لم يُنجز — أعد الأمر للتصحيح';if(/school confirmation pending/i.test(m))return 'بانتظار تأكيد مدير المدرسة للإنجاز';if(/spend approval required/i.test(m))return 'المشتريات فوق سقف الاعتماد — يعتمدها مدير أعلى';if(/reason required/i.test(m))return 'اكتب السبب';if(/Invalid login/i.test(m))return 'البريد أو كلمة المرور غير صحيحة';if(/Email not confirmed/i.test(m))return 'لم يتم تأكيد البريد بعد — افتح رسالة التأكيد في بريدك';if(/already registered/i.test(m))return 'هذا البريد مسجل مسبقاً';if(/row-level security/i.test(m))return 'ليست لديك صلاحية لهذا الإجراء';if(/Failed to fetch|NetworkError|network/i.test(m))return 'تعذر الاتصال بالخادم — تحقق من الإنترنت';if(/Password should/i.test(m))return 'كلمة المرور قصيرة — 6 أحرف على الأقل';return m};
function b64ToBlob(d){const [h,b]=d.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});

const real={
 async signIn(email,pw){const c=await sb();return chk(await c.auth.signInWithPassword({email:S(email),password:pw}))},
 async signUp(email,pw,name){const c=await sb();return chk(await c.auth.signUp({email:S(email),password:pw,options:{data:{full_name:S(name)}}}))},
 async signOut(){const c=await sb();await c.auth.signOut()},
 async updateContact(phone){const c=await sb();return chk(await c.rpc('fm_update_my_contact',{p_phone:phone}))},
 async changeEmail(em){const c=await sb();return chk(await c.auth.updateUser({email:em},{emailRedirectTo:location.origin+location.pathname.replace(/[^/]*$/,'')+'start.html'}))},
 async setPassword(pw){const c=await sb();chk(await c.auth.updateUser({password:pw}));try{chk(await c.rpc('fm_password_changed'))}catch(e){}return true},
 async session(){const c=await sb();const {data}=await c.auth.getSession();return data?.session||null},
 async me(){const c=await sb();const {data:{user}}=await c.auth.getUser();if(!user)return null;const p=chk(await c.from('profiles').select('*').eq('id',user.id).maybeSingle());return p?Object.assign({},p,{email:p.email||user.email}):{id:user.id,email:user.email,role:'pending',person_names:[],regions:[]}},
 async listProfiles(){const c=await sb();return chk(await c.from('profiles').select('*').order('created_at'))},
 async saveProfile(id,patch){const c=await sb();return chk(await c.from('profiles').update(Object.assign({},patch,{updated_at:new Date().toISOString()})).eq('id',id).select())},
 async pushTickets(rows,onProgress){const c=await sb();for(let i=0;i<rows.length;i+=400){chk(await c.from('tickets').upsert(rows.slice(i,i+400),{onConflict:'region,ticket_id'}));onProgress?.(Math.min(rows.length,i+400),rows.length)}return rows.length},
 async deleteTicketsNotIn(region,ids){const c=await sb();const have=[];for(let f=0;;f+=1000){const d=chk(await c.from('tickets').select('ticket_id').eq('region',region).range(f,f+999));have.push(...d.map(x=>x.ticket_id));if(d.length<1000)break}
  const keep=new Set(ids),gone=have.filter(t=>!keep.has(t));for(let i=0;i<gone.length;i+=200)chk(await c.from('tickets').delete().eq('region',region).in('ticket_id',gone.slice(i,i+200)));return gone.length},
 async pullTickets(region){const c=await sb();const out=[];for(let f=0;;f+=1000){let q=c.from('tickets').select('*').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);out.push(...d);if(d.length<1000)break}return out},
 async getKV(keys){const c=await sb();const r=chk(await c.from('app_kv').select('*').in('key',keys));
 /* V165: engineers / supervisors / contractors read only their schools of the school DB (fm_my_school_db) */
 if(keys.includes('fm_school_master_db_v1')&&!r.some(x=>x.key==='fm_school_master_db_v1')){const m=await c.rpc('fm_my_school_db');if(!m.error&&Array.isArray(m.data))r.push({key:'fm_school_master_db_v1',value:m.data})}return r},
 async setKV(key,value){const c=await sb();return chk(await c.from('app_kv').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'}))},
 async pullWork(region){const c=await sb();const work=[],events=[];
  for(let f=0;;f+=1000){let q=c.from('ticket_work').select('*').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);work.push(...d);if(d.length<1000)break}
  for(let f=0;;f+=1000){let q=c.from('ticket_events').select('*').order('at').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);events.push(...d);if(d.length<1000)break}
  return {work,events}},
 async pushWork(row){const c=await sb();return chk(await c.from('ticket_work').upsert(row,{onConflict:'region,ticket_id'}))},
 async addEvents(rows){if(!rows.length)return [];const c=await sb();return chk(await c.from('ticket_events').insert(rows))},
 async uploadPhoto(region,tid,kind,dataUrl,byName,geo){const c=await sb();const id=uuid();const path=`${region}/${tid}/${id}.jpg`;
  chk(await c.storage.from('ticket-photos').upload(path,b64ToBlob(dataUrl),{contentType:'image/jpeg',upsert:false}));
  chk(await c.from('ticket_photos').insert({id,region,ticket_id:tid,kind,path,by_name:byName,geo:geo||null}));return {id,path}},
 /* V145 work orders: reads go through RLS, every change through fm_wo_create / fm_wo_act */
 async woList(){const c=await sb();return chk(await c.from('work_orders').select('*').order('updated_at',{ascending:false}).limit(1000))},
 async woEvents(id){const c=await sb();return chk(await c.from('wo_events').select('*').eq('wo_id',id).order('at'))},
 async woAssignable(){const c=await sb();return chk(await c.rpc('fm_wo_assignable'))},
 async woCreate(o){const c=await sb();return chk(await c.rpc('fm_wo_create',{p:o}))},
 async woAct(id,action,note,geo,data){const c=await sb();return chk(await c.rpc('fm_wo_act',{p_id:id,p_action:action,p_note:note||null,p_geo:geo||null,p_data:data===undefined?null:data}))},
 async woUpload(id,kind,dataUrl,byName,geo,item,tag){const c=await sb();const pid=uuid();const path=`${id}/${pid}.jpg`;
  chk(await c.storage.from('wo-photos').upload(path,b64ToBlob(dataUrl),{contentType:'image/jpeg',upsert:false}));
  chk(await c.from('wo_photos').insert(Object.assign({id:pid,wo_id:id,kind,path,by_name:byName,geo:geo||null},item!=null?{item}:{},tag?{tag}:{})));return {id:pid,path}},
 async woRepair(src,p){const c=await sb();return chk(await c.rpc('fm_wo_repair',{p_src:src,p}))},
 async woMaterials(){const c=await sb();return chk(await c.from('wo_materials').select('id,name,unit,price,category').eq('active',true).order('category').order('name'))},
 async woPhotos(id){const c=await sb();const rows=chk(await c.from('wo_photos').select('*').eq('wo_id',id).order('at'));if(!rows.length)return [];
  const signed=chk(await c.storage.from('wo-photos').createSignedUrls(rows.map(r=>r.path),3600));const m=new Map(signed.map(s=>[s.path,s.signedUrl]));
  return rows.map(r=>({id:r.id,kind:r.kind,d:m.get(r.path)||'',by:r.by_name,at:r.at,item:r.item??null,tag:r.tag||null}))},
 async listPhotos(region,tid){const c=await sb();const rows=chk(await c.from('ticket_photos').select('*').eq('region',region).eq('ticket_id',tid).order('at'));if(!rows.length)return [];
  const signed=chk(await c.storage.from('ticket-photos').createSignedUrls(rows.map(r=>r.path),3600));const m=new Map(signed.map(s=>[s.path,s.signedUrl]));
  return rows.map(r=>({id:r.id,kind:r.kind,d:m.get(r.path)||'',by:r.by_name,at:new Date(r.at).getTime(),path:r.path,geo:r.geo}))},
 async deletePhoto(id,path){const c=await sb();if(path)await c.storage.from('ticket-photos').remove([path]);return chk(await c.from('ticket_photos').delete().eq('id',id))},
 async photoCounts(region){const c=await sb();const out={};for(let f=0;;f+=1000){let q=c.from('ticket_photos').select('ticket_id').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);d.forEach(x=>out[x.ticket_id]=(out[x.ticket_id]||0)+1);if(d.length<1000)break}return out},
 async subscribe(cb){const c=await sb();const ch=c.channel('fm-work').on('postgres_changes',{event:'*',schema:'public',table:'ticket_work'},p=>cb('work',p)).on('postgres_changes',{event:'INSERT',schema:'public',table:'ticket_events'},p=>cb('event',p)).subscribe();return ()=>{try{c.removeChannel(ch)}catch(e){}}}
};
window.FMCloud={__core:true,cfg,setCfg,api:real,msg:ARmsg,uuid,engClient:sb,
 configured:()=>{const c=cfg();return !!(c.url&&c.key)},
 /* in-app state */
 state:{on:false,profile:null},
 ROLE:{admin:'مدير النظام',engineer:'مهندس',supervisor:'مشرف',contractor:'مقاول',viewer:'مشاهد (إدارة)',pending:'بانتظار التفعيل'}};
})();

async function flush(){if(flushing||!navigator.onLine||!outbox.scope()||D.me?.id!==syncIdentity()?.uid)return;

 try{for(const op of q){if(stop||scope!==outbox.scope())break;if(op.syncStatus==='failed'){stop=true;break}

 if(scope===outbox.scope()){qBanner();if(sent.length){toast('تم إرسال '+fmt(sent.length)+' تحديث محفوظ');await pull(true);if(sent.some(o=>/^wo/.test(o.k))){await woPull();if(D.curWo&&D.curWo!=='new')woRefresh(D.curWo)}}}
 }catch(e){toast('تعذر إكمال المزامنة: '+e.message,'e')}finally{flushing=false}};

 if(v==null||v==='')return null;if(v instanceof Date)return isNaN(v)?null:v;
 if(typeof v==='number')return v>20000&&v<70000?new Date(Math.round((v-25569)*864e5)):null;
 let s=S(v);if(!s)return null;
 if(/^\d{4}-\d{2}-\d{2}T/.test(s)){const d=new Date(s);return isNaN(d)?null:d}
 if(/^\d{5}(\.\d+)?$/.test(s)){const n=parseFloat(s);return n>20000&&n<70000?new Date(Math.round((n-25569)*864e5)):null}
 const pm=/مساء|م|pm/i.test(s),am=/صباح|ص|am/i.test(s);s=s.replace(/صباحاً|صباحا|مساءً|مساء|ص|م|am|pm/gi,'').trim();
 const hm=(m,i)=>{let h=m[i]?+m[i]:0;if(pm&&h<12)h+=12;if(am&&h===12)h=0;return [h,m[i+1]?+m[i+1]:0,m[i+2]?+m[i+2]:0]};
 let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
 if(m){let d=+m[1],mo=+m[2]-1;if(mo>=12&&d<=12){const x=d;d=mo+1;mo=x-1}const r=new Date(+m[3],mo,d,...hm(m,4));return isNaN(r)?null:r}
 m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
 if(m){const r=new Date(+m[1],+m[2]-1,+m[3],...hm(m,4));return isNaN(r)?null:r}
 const r=new Date(s);return isNaN(r)?null:r}
let MEMO=new Map();
const cdate=t=>t.created_at?new Date(t.created_at):null;
/* resolution date: the work record first, then the resolution column of the uploaded file */
function resAt(t){const w=D.work.get(key(t)),mk=key(t)+'|'+(w?w.updated_at||w.resolved_at||w.stage:'');if(MEMO.has(mk))return MEMO.get(mk);
 let r=null;if(w&&w.resolved_at)r=new Date(w.resolved_at);else if(done(stageT(t)))r=parseDT(rawCol(t,RES_AL));MEMO.set(mk,r);return r}
/* the status the platform shows: the field stage when there is one, otherwise the file status */
const ST_MAP={assigned:'تم التعيين',inspected:'قيد التنفيذ',progress:'قيد التنفيذ',parts:'قيد التنفيذ',resolved:'تم حله',closed:'مغلق',reopened:'قيد التنفيذ',cancelled:'ملغى'};
const platStatus=t=>{const w=D.work.get(key(t));return (w&&ST_MAP[w.stage])||S(t.status)};
const isClosedP=t=>{const s=platStatus(t);return s==='تم حله'||s==='مغلق'};
/* SLA exactly as getTicketSLAInfo: open tickets measured up to the latest date of the uploaded file */
function slaP(t){const pri=S(t.priority)||'متوسط',lim=D.hours[pri]||72,st=platStatus(t),c=cdate(t);
 if(st==='ملغى'||!c||isNaN(c))return {lim,breached:false};
 const closed=st==='تم حله'||st==='مغلق';let end;
 if(closed){const r=resAt(t);if(r&&!isNaN(r)&&r>=c)end=r.getTime();else return {lim,closed,breached:/اختراق|breached|متأخر|غير ملتزم/i.test(S(rawCol(t,SLM_AL)))}}
 else end=Math.max(D.ref[t.region]||Date.now(),c.getTime());
 const el=(end-c.getTime())/36e5;return {lim,el,closed,breached:el>lim}}
/* the platform's supervisor score (calculateStaffPerformanceScore): 35% completion, 35% SLA, 15% critical, 15% backlog */
function rating(L){const total=L.length;let res=0,br=0,cr=0,pen=0;
 L.forEach(t=>{const st=platStatus(t);if(st==='تم حله'||st==='مغلق')res++;else if(['قيد التنفيذ','تم التعيين','موافقة الاستشاري','معلق'].includes(st))pen++;const p=S(t.priority);if(p==='طارئ'||p==='عالي')cr++;if(slaP(t).breached)br++});
 const cl=x=>Math.max(0,Math.min(100,x)),r1=x=>Math.round(x*10)/10;
 const comp=total?cl(res/total*100):100,sl=total?cl((1-br/total)*100):100,crit=total?cl((1-cr/total)*100):100,pend=total?cl((1-pen/total)*100):100;
 const score=r1(cl(.35*comp+.35*sl+.15*crit+.15*pend));
 const lab=score>=90?['ممتاز','ok']:score>=80?['جيد جداً','pri']:score>=70?['مقبول','warn']:['ضعيف','bad'];
 return {score,comp:r1(comp),sla:r1(sl),crit:r1(crit),pend:r1(pend),total,res,br,cr,pen,label:lab[0],cls:lab[1]}}
/* repeated: the platform's rule (v31DetectDuplicates) — same school, description identical or word-similarity ≥ 50% */
const normD=v=>String(v??'').toLowerCase().normalize('NFKD').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ـ/g,'').replace(/[ً-ٟ]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function simD(a,b){const A=normD(a),B=normD(b);if(!A||!B)return 0;if(A===B)return 1;
 const ta=new Set(A.split(' ').filter(x=>x.length>1)),tb=new Set(B.split(' ').filter(x=>x.length>1));let hit=0;ta.forEach(x=>{if(tb.has(x))hit++});
 return Math.max(hit/Math.max(1,Math.min(ta.size,tb.size))*.95,hit/Math.max(1,ta.size+tb.size-hit))}
function repeats(L){const by=new Map();L.forEach(t=>{const s=normD(t.school).replace(/\s+/g,'');const d=rawDesc(t);if(!s||!d)return;if(!by.has(s))by.set(s,[]);by.get(s).push({t,d})});
 const keys=new Set(),groups=[];
 by.forEach(arr=>{if(arr.length<2)return;const par=arr.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(simD(arr[i].d,arr[j].d)>=.5){const a=f(i),b=f(j);if(a!==b)par[b]=a}
  const cl=new Map();arr.forEach((x,i)=>{const k=f(i);if(!cl.has(k))cl.set(k,[]);cl.get(k).push(x.t)});
  cl.forEach(g=>{if(g.length>1){groups.push(g);g.forEach(t=>keys.add(key(t)))}})});
 return {groups,keys}}
/* reopened in the period: a «reopened» stage in the history or as the current stage */
function reopened(a,b){const keys=new Set();D.tickets.forEach(t=>{const k=key(t),w=D.work.get(k);
  if((D.events.get(k)||[]).some(e=>e.stage==='reopened'&&inR(new Date(e.at),a,b))||(w&&w.stage==='reopened'&&inR(new Date(w.updated_at),a,b)))keys.add(k)});return keys}
const inR=(d,a,b)=>!!d&&!isNaN(d)&&d>=a&&d<b;
function pstats(a,b){
 const rec=D.tickets.filter(t=>inR(cdate(t),a,b)),cls=D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),a,b));
 const br=rec.filter(t=>slaP(t).breached).length,hrs=cls.map(t=>(resAt(t)-cdate(t))/36e5).filter(h=>isFinite(h)&&h>=0);
 const rep=repeats(rec),reo=reopened(a,b);
 return {a,b,rec,cls,br,brPct:rec.length?br*100/rec.length:null,avg:hrs.length?hrs.reduce((x,y)=>x+y,0)/hrs.length:null,rep,reo,rate:rating(rec)}}
const SOON_H=24,H3=3;
function items(){return D.tickets.map(t=>({t,st:stageT(t),s:sla(t)}))}
const isOpenX=x=>!done(x.st);
const isSoon=x=>isOpenX(x)&&!x.s.late&&x.s.rem!=null&&x.s.rem<=SOON_H;
const isH3=x=>isOpenX(x)&&!x.s.late&&x.s.rem!=null&&x.s.rem<=H3;
const evToday=k=>(D.events.get(k)||[]).some(e=>(e.type==='close'||e.stage==='resolved'||e.stage==='closed')&&new Date(e.at)>=dayStart());
const arrivedToday=k=>(D.events.get(k)||[]).some(e=>e.type==='arrive'&&new Date(e.at)>=dayStart());
function buckets(all){all=all||items();return {open:all.filter(isOpenX),late:all.filter(x=>isOpenX(x)&&x.s.late),h3:all.filter(isH3),soon:all.filter(isSoon),today:all.filter(x=>evToday(key(x.t))),all}}
function period(from,to){const p=pstats(from,to);return {n:p.cls.length,pct:p.cls.length?Math.round(p.cls.filter(t=>!slaP(t).breached).length*100/p.cls.length):null,avg:p.avg}}

/* ---------- F7: weekly goal, anonymous ranking, near-breach alerts, PDF report, today's visit plan ---------- */
const weekStart=()=>{const t=d0(new Date());return addD(t,-t.getDay())};
const uidKey=k=>k+'_'+(D.me?.id||'me');
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* weekly goal: closed this week vs a target; the suggestion is the average of the last 4 weeks + 10% */
function goalInfo(){const ws=weekStart(),done=D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),ws,addD(new Date(),1))).length;
 const past=[1,2,3,4].map(i=>D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),addD(ws,-7*i),addD(ws,-7*(i-1)))).length);
 const sug=Math.max(5,Math.round(past.reduce((a,b)=>a+b,0)/4*1.1));const goal=+lsGet(uidKey('fmf_goal'),0)||sug;
 const day=new Date().getDay()+1,expect=Math.round(goal*day/7);return {done,goal,sug,custom:!!lsGet(uidKey('fmf_goal'),0),pct:Math.min(100,Math.round(done*100/goal)),behind:done<expect,expect,daysLeft:7-day}}
function goalCard(){const g=goalInfo();return `<div class="card goal"><div class="r1"><h3 style="margin:0">🎯 هدف الأسبوع</h3><button class="link" id="g-ed" style="border:0;background:none">تعديل</button></div>
 <div class="gnum"><b>${fmt(g.done)}</b> / ${fmt(g.goal)} بلاغ مُغلق</div><div class="gbar"><i style="width:${g.pct}%" class="${g.pct>=100?'ok':g.behind?'warn':''}"></i></div>
 <div class="muted">${g.pct>=100?'👏 حققت هدف الأسبوع':g.behind?`أنت متأخر عن الوتيرة — المتوقع حتى اليوم ${fmt(g.expect)}، تبقّى ${fmt(g.goal-g.done)} في ${fmt(g.daysLeft+1)} يوم`:`على الطريق الصحيح — تبقّى ${fmt(g.goal-g.done)} بلاغ`}${g.custom?'':` • الهدف مقترح من متوسط أسابيعك السابقة`}</div></div>`}
function bindGoal(){const b=$('#g-ed');if(!b)return;b.onclick=()=>{const g=goalInfo(),v=prompt('هدف الأسبوع (عدد البلاغات المغلقة)',g.goal);if(v===null)return;const n=Math.round(+v);
 if(!n||n<1){lsSet(uidKey('fmf_goal'),0)}else lsSet(uidKey('fmf_goal'),n);main()}}

/* ranking published by the platform at the last upload: find my rank through the hash of my name */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* V160 (F20): contact with the schools in my score — the platform's weights (fm_settings.score_weights), my coverage of the
   last 4 weekly cycles / 30 days and my satisfaction from the ratings of the last 90 days (fm_eng_scores). A part without
   data gives its share back to the tickets. */
/* V164 (F21): usage — one fm_touch('field') per open, then at most every 10 minutes while visible */
let touchAt=0;function touchField(){if(!D.me||document.hidden||Date.now()-touchAt<6e5||!C.engClient)return;touchAt=Date.now();C.engClient().then(db=>db.rpc('fm_touch',{p_app:'field'})).catch(()=>{})}
setInterval(touchField,60000);document.addEventListener('visibilitychange',touchField);
/* V166 (F23): leaves — my own, the one I cover, and my manager's (with his deputy) */
async function loadLeaves(){if(!D.me||!C.engClient)return;const db=await C.engClient();const x=await db.rpc('fm_leaves');D.leaves=!x.error&&Array.isArray(x.data)?x.data.filter(l=>l.running):[]}
function leaveBanner(){const L=D.leaves||[],me=D.me||{},dd=v=>new Date(v).toLocaleDateString(GREG,{day:'numeric',month:'long'});
 return L.map(l=>l.principal===me.id?`<div class="card" style="background:#eff6ff;border-color:#93c5fd;font-weight:800">🏖️ أنت في إجازة حتى ${esc(dd(l.to_at))} — ينوب عنك ${esc(l.deputy_name)}. مستهدفات التواصل موقوفة خلال الإجازة.</div>`
  :l.deputy===me.id?`<div class="card" style="background:#fffbeb;border-color:#f59e0b;font-weight:800">👥 أنت تنوب عن ${esc(l.principal_name)} حتى ${esc(dd(l.to_at))}: أوامره محوّلة إليك (اقبلها من «الأوامر»)، وترى مدارسه وتسجّل تواصلها.</div>`
  :l.principal===me.reports_to?`<div class="card" style="background:#fffbeb;border-color:#f59e0b;font-weight:800">ℹ️ ${esc(l.principal_name)} في إجازة حتى ${esc(dd(l.to_at))} — النائب: ${esc(l.deputy_name)}. راجعه في الأوامر والاعتماد.</div>`:'').join('')}
async function loadMyEng(){if(!D.me||!['supervisor','engineer'].includes(D.me.role)||!C.engClient)return;const db=await C.engClient();
 const [sc,w]=await Promise.all([db.rpc('fm_eng_scores'),db.from('fm_settings').select('value').eq('key','score_weights').maybeSingle()]);if(sc.error||!Array.isArray(sc.data))return;
 const x=sc.data.find(r=>r.user_id===D.me.id);if(!x)return;const v=(w&&w.data&&w.data.value)||{},W=v.cov==null&&v.sat==null?{cov:10,sat:10}:{cov:Math.max(0,Math.min(50,+v.cov||0)),sat:Math.max(0,Math.min(50,+v.sat||0))};
 D.eng={cov:x.cov==null?null:+x.cov,sat:x.sat==null?null:+x.sat,hit:x.cov_hit,tot:x.cov_total,n:x.sat_n,W}}
function myRating(){const R=rating(D.tickets),x=D.eng;R.f=1;if(!x)return R;const wc=x.cov!=null?x.W.cov:0,ws=x.sat!=null?x.W.sat:0;if(!wc&&!ws)return R;
 const f=(100-wc-ws)/100,score=Math.round(Math.max(0,Math.min(100,R.score*f+(wc?x.cov*wc/100:0)+(ws?x.sat*ws/100:0)))*10)/10;
 const lab=score>=90?['ممتاز','ok']:score>=80?['جيد جداً','pri']:score>=70?['مقبول','warn']:['ضعيف','bad'];
 return Object.assign(R,{score,label:lab[0],cls:lab[1],f,cov:wc?x.cov:undefined,sat:ws?x.sat:undefined,wc,ws,ticketScore:R.score})}
async function loadMyRank(){D.myRank=null;if(!(window.crypto&&crypto.subtle))return;const names=(D.me?.person_names||[]).map(S).filter(Boolean);if(!names.length)return;
 const hs=await Promise.all(names.map(sha));let best=null;
 Object.entries(D.rank||{}).forEach(([reg,o])=>{if(!o||!o.ranks)return;hs.forEach(h=>{const x=o.ranks[h];if(x&&(!best||x.r<best.r))best={reg,r:x.r,s:x.s,n:o.n,at:o.at,scores:o.scores||[]}})});D.myRank=best}
function rankHtml(){const k=D.myRank;if(!k)return '';const top=Math.round(k.r*100/Math.max(1,k.n));
 return `<div class="rank"><div><b>🏅 ترتيبك ${fmt(k.r)} من ${fmt(k.n)}</b> بين مشرفي ${esc(RN[k.reg]||k.reg)}${top<=25?' — ضمن أفضل الربع 👏':''}</div>

  <div class="muted">حسب آخر رفع للملف (${dts(k.at)}) — بدرجتك وقتها ${fmt(k.s,k.s%1?1:0)}. لا تظهر أسماء المشرفين الآخرين.</div></div>`}

/* near-breach alerts: checked every 5 minutes while the app is open (also in a background tab) */
const NKEY=()=>uidKey('fmf_notified');
const notifOn=()=>!!lsGet(uidKey('fmf_alerts'),false);
async function setAlerts(on){if(on&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}lsSet(uidKey('fmf_alerts'),!!on);if(on)checkAlerts(true)}
function checkAlerts(force){if(!notifOn()||!D.tickets.length)return;const sent=lsGet(NKEY(),{}),now=Date.now();let fresh=[];
 Object.keys(sent).forEach(k=>{if(now-sent[k]>2*864e5)delete sent[k]});
 items().filter(isH3).forEach(x=>{const k=key(x.t);if(!sent[k]){sent[k]=now;fresh.push(x)}});lsSet(NKEY(),sent);
 if(!fresh.length){if(force)toast('التنبيهات مفعّلة — لا توجد بلاغات قريبة من الاختراق الآن');return}
 const title=fresh.length>1?`⏰ ${fmt(fresh.length)} بلاغات تقترب من الاختراق`:'⏰ بلاغ يقترب من الاختراق',body=fresh.slice(0,3).map(x=>`${x.t.ticket_id} — ${x.t.school||''} — تبقّى ${fmt(Math.max(0,x.s.rem),1)} س`).join('\n');
 let shown=false;try{if('Notification' in window&&Notification.permission==='granted'){const n=new Notification(title,{body,icon:FM_BRAND.mark,tag:'fmf-h3',renotify:true});n.onclick=()=>{window.focus();D.tab='h3';D.f.ids=null;go('list');n.close()};shown=true}}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
 alertBar(title,body,shown)}
function alertBar(title,body){document.getElementById('fmf-alert')?.remove();const b=document.createElement('div');b.id='fmf-alert';b.className='abar';
 b.innerHTML=`<div><b>${esc(title)}</b><small>${esc(body).replace(/\n/g,'<br>')}</small></div><button data-a="go">عرض</button><button data-a="x">✕</button>`;document.body.appendChild(b);
 b.querySelector('[data-a=go]').onclick=()=>{b.remove();D.tab='h3';D.f.ids=null;go('list')};b.querySelector('[data-a=x]').onclick=()=>b.remove()}
setInterval(()=>checkAlerts(false),5*6e4);

  r.u=r.h3*100+Math.min(r.late,10)*10+r.soon*20+r.emg*5+r.open+r.woLate*15+r.woToday*12+r.wm.length*3;r.visited=done.has(r.name)});

 const pick=todo.filter(r=>r.xy).sort((a,b)=>b.u-a.u).slice(0,D.plan.n),noXY=todo.filter(r=>!r.xy).sort((a,b)=>b.u-a.u).slice(0,5);

 }catch(e){if(!net(e))settle(s,o,String(e.message||e));break}
 }}finally{busy=false}if(n&&scope()===s){message('أُرسلت '+n+' عملية محفوظة');document.dispatchEvent(new Event('fm230-parts-synced'))}return n};
 return navigator.locks?.request?navigator.locks.request('fm-parts230:'+s,execute):execute();}
function guardedFlush(){return flush().catch(e=>{message(e.message);return 0})}
const legacy=()=>{const i=who();return i?.uid?localStorage.getItem('fmf_wh_out:'+i.uid):null};
window.fmfWhOut={list:get,flush:guardedFlush,
 add(o){const s=scope();if(!s)throw Error('الحساب غير متحقق؛ لم تُحفظ العملية');if(o.scope&&o.scope!==s)throw Error('تغير الحساب؛ لم تُحفظ العملية للحساب الآخر');if(o.t==='sign'&&(!o.expected_issued_at||!Array.isArray(o.expected_lines)))throw Error('أعد فتح الطلب لمراجعة الكميات والتوقيع');const L=get(s);if(o.t==='sign'&&L.some(x=>x.t==='sign'&&x.id===o.id))throw Error('يوجد توقيع محفوظ لهذا الطلب؛ راجعه أولًا');L.push({...o,qid:o.qid||uuid(),at:new Date().toISOString()});put(L,s);return true},
 has:id=>get().some(o=>o.t==='sign'&&o.id===id),
 html(mat){const L=get();return `${legacy()?'<div class="cd">⚠️ توجد عمليات من الإصدار السابق بلا هوية شركة موثوقة. لم تُرسل تلقائيًا. <button data-f230-export>تنزيلها للمراجعة</button></div>':''}${L.length?`<div class="cd"><h3>📤 محفوظ لهذا الحساب (${L.length})</h3>${L.map((o,i)=>`<div class="row"><span>${o.t==='new'?'طلب قطع':'توقيع استلام'} ${esc(o.code||o.p?.ticket_ref||'')}<small>${esc(o.err||'بانتظار الإرسال')}</small></span>${o.err?`<button data-f230-retry="${esc(o.qid)}">إعادة المحاولة</button>`:''}<button data-f230-delete="${esc(o.qid)}">حذف</button></div>`).join('')}<button data-f230-send>إرسال الآن</button></div>`:''}`},
 bind(root,reopen){root.querySelector('[data-f230-send]')?.addEventListener('click',()=>guardedFlush().then(()=>reopen?.()));root.querySelectorAll('[data-f230-retry]').forEach(b=>b.onclick=()=>{try{const L=get();const op=L.find(x=>x.qid===b.dataset.f230Retry);if(op)delete op.err;put(L);guardedFlush().then(()=>reopen?.())}catch(e){message(e.message)}});root.querySelectorAll('[data-f230-delete]').forEach(b=>b.onclick=()=>{if(!confirm('حذف العملية المحفوظة لهذا الحساب؟'))return;try{const L=get();const i=L.findIndex(x=>x.qid===b.dataset.f230Delete);if(i>=0)L.splice(i,1);put(L);reopen?.()}catch(e){message(e.message)}});root.querySelector('[data-f230-export]')?.addEventListener('click',()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([legacy()],{type:'application/json'}));a.href=u;a.download='legacy-parts-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})}
};
window.addEventListener('online',()=>{guardedFlush()});setInterval(()=>{if(navigator.onLine)guardedFlush()},60000);
})();
</script>

<script id="fmf-49">(function(){

   (5) «🕒 الحضور» — start / end of the day and «📍 وصلت مدرسة» with the location (distance to the school from the school DB
       coordinates); queued without a connection (localStorage fmf_att_out:<user>, client_id once) and sent in order;
       today's school visits are shared with the day's route (window.__fmfVisits).
   (6) «🚗 سيارتي» — the driver's vehicle: papers expiry, fuel / km / maintenance log with the odometer and a receipt photo.
   (7) «🧾 مستخلصاتي» — the contractor's bills (RLS: his own), status, totals, lines and history.
   (11) «⚡ العدادات» — monthly electricity / water readings of my schools with a photo. */
if(window.__f49)return;window.__f49=1;
const C=window.FMCloud;if(!C)return;
const S=v=>String(v??'').trim(),esc=v=>S(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d)=>(Math.round((+v||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:d??2});
const GREG='ar-SA-u-ca-gregory',dd=v=>v?new Date(String(v).length===10?v+'T12:00:00':v).toLocaleDateString(GREG,{day:'numeric',month:'short',year:'numeric'}):'—';
const tm=v=>v?new Date(v).toLocaleTimeString(GREG,{hour:'2-digit',minute:'2-digit'}):'—';
const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const month=()=>day().slice(0,7);
const toast=m=>{const t=document.getElementById('toast');if(!t){try{alert(m)}catch(e){}return}t.textContent=m;t.className='toast';t.style.display='block';t.style.zIndex='90';setTimeout(()=>t.style.display='none',3500)};
const net=e=>/Failed to fetch|NetworkError|network|Load failed|ERR_INTERNET/i.test(String(e&&e.message||e))||!navigator.onLine;
const missing=e=>/does not exist|schema cache|Could not find/i.test(String(e&&e.message||e));
const ERR=[[/odometer lower/,'قراءة العداد أقل من آخر قراءة'],[/amount required/,'اكتب المبلغ'],[/odometer required/,'اكتب قراءة العداد'],[/reading lower: ([\d.]+)/,'القراءة أقل من الشهر السابق ($1) — إن استُبدل العداد فعّل «عداد جديد / تصفير»'],[/invalid month/,'شهر غير صحيح'],[/not allowed/,'ليست لديك صلاحية'],[/school required/,'اختر المدرسة'],[/too many/,'عدد كبير من التسجيلات اليوم']];
const emsg=e=>{const m=String(e&&e.message||e);if(missing(e))return 'تحتاج تشغيل القسم 45 من supabase_setup.sql';for(const [r,t] of ERR)if(r.test(m))return m.replace(new RegExp('.*'+r.source+'.*'),t);return C.msg?C.msg(m):m};
let ME=null;async function db(){return C.engClient()}
async function rpc(fn,a){const d=await db();const r=await d.rpc(fn,a);if(r.error)throw Error(r.error.message);return r.data}
const uid=()=>ME&&ME.id;
const ls=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
function shrink(file){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(Error('تعذر قراءة الصورة'));r.onload=()=>{const im=new Image();im.onerror=()=>no(Error('صورة غير صالحة'));im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.8,u=c.toDataURL('image/jpeg',q);while(u.length>400000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}u.length>400000?no(Error('الصورة كبيرة جداً')):ok(u)};im.src=r.result};r.readAsDataURL(file)})}
const bkey=(id,name)=>{const b=S(id).toUpperCase().replace(/^S[\s-]*/,'').replace(/[^A-Z0-9]/g,'');return b||'N:'+S(name).replace(/\s+/g,'').toLowerCase()};

 s.innerHTML=`<div class="hd"><button type="button" data-x>→</button><h2>${title}</h2></div><div class="bd">${html}</div>`;s.querySelector('[data-x]').onclick=close;return s}

/* ---------- (5) attendance ---------- */
const KN={in:'▶️ بدء الدوام',out:'⏹️ نهاية الدوام',visit:'📍 وصول مدرسة'};
let ATT=null;   // today's server rows (mine)
const outKey=()=>'fmf_att_out:'+uid(),todKey=()=>'fmf_att_today:'+uid()+':'+day();
const outbox=()=>ls(outKey())||[];
function todayRows(){const L=(ATT||ls(todKey())||[]).slice();for(const o of outbox())if(o.p.at&&o.p.at.slice(0,10)===new Date().toISOString().slice(0,10)&&!L.some(r=>r.client_id===o.p.client_id))L.push(Object.assign({queued:true,err:o.err},o.p));return L.sort((a,b)=>new Date(a.at)-new Date(b.at))}

async function attLoad(){if(!navigator.onLine)return;try{const L=await rpc('fm_att_list',{p_from:day(),p_to:day()});ATT=(L||[]).filter(r=>r.user_id===uid()).map(r=>Object.assign(r,{client_id:r.client_id}));ls(todKey(),ATT)}catch(e){if(missing(e))ATT=null}visitsShare()}
let FL=false;
async function flush(){if(FL||!navigator.onLine||!uid())return;const L=outbox();if(!L.length)return;FL=true;
 try{for(const o of L.slice()){try{await rpc('fm_att_add',{p:o.p});ls(outKey(),outbox().filter(x=>x.p.client_id!==o.p.client_id))}catch(e){if(net(e))break;ls(outKey(),outbox().map(x=>x.p.client_id===o.p.client_id?Object.assign(x,{err:emsg(e)}):x));}}}
 finally{FL=false}await attLoad();home()}
async function attAdd(kind,extra){const p=Object.assign({kind,client_id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),at:new Date().toISOString()},extra||{});
 try{const g=await window.fmfGeo();Object.assign(p,{lat:g.lat,lng:g.lng,acc:g.acc})}catch(e){if(!confirm((e.message||'تعذر تحديد الموقع')+' — التسجيل بدون موقع؟'))return false;p.note=S((p.note||'')+' (بدون موقع)')}
 if(kind==='visit'&&p.lat!=null&&p.xy){p.dist_m=Math.round(window.fmfDist({lat:p.lat,lng:p.lng},p.xy))}delete p.xy;
 ls(outKey(),outbox().concat([{p}]));const t=ls(todKey())||[];t.push(Object.assign({queued:true},p));ls(todKey(),t);visitsShare();
 if(navigator.onLine)await flush();toast(navigator.onLine?'تم التسجيل':'حُفظ على الجوال — يُرسل عند عودة الاتصال');return true}
async function visitDlg(){let g=null;try{g=await window.fmfGeo()}catch(e){}const rows=(window.fmfSchoolRows?window.fmfSchoolRows():[]).filter(r=>r.sc||r.xy);
 rows.forEach(r=>{r._d=g&&r.xy?window.fmfDist(g,r.xy):null});rows.sort((a,b)=>(a._d??1e12)-(b._d??1e12)||a.name.localeCompare(b.name,'ar'));
 const s=sheet('📍 وصلت مدرسة',`<div class="cd"><h3>اختر المدرسة</h3>${g?'':'<div class="wa">تعذر تحديد موقعك — المسافة لن تُحسب</div>'}
  <input data-q placeholder="🔎 ابحث باسم المدرسة"><div data-l style="margin-top:8px"></div></div>`);
 const draw=()=>{const q=S(s.querySelector('[data-q]').value);const L=(q?rows.filter(r=>r.name.includes(q)):rows).slice(0,12);
  s.querySelector('[data-l]').innerHTML=L.map((r,i)=>`<div class="ln"><span><b>${esc(r.name)}</b>${r._d!=null?`<small> • ${r._d<1000?num(r._d,0)+' م':num(r._d/1000,1)+' كم'}${r._d>500?' ⚠️':''}</small>`:''}</span><button type="button" class="st" data-i="${rows.indexOf(r)}">تسجيل الوصول</button></div>`).join('')||'<div class="muted">لا توجد مدارس</div>';
  s.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{const r=rows[+b.dataset.i];if(r._d!=null&&r._d>500&&!confirm(`أنت على بعد ${num(r._d/1000,1)} كم من ${r.name}. تسجيل الوصول مع ذلك؟`))return;b.disabled=true;
   const sc=r.sc||{};if(await attAdd('visit',{school:r.name,bkey:bkey(sc.buildingId,r.name),xy:r.xy}))openAtt();else b.disabled=false})};
 s.querySelector('[data-q]').oninput=draw;draw()}
function hrs(L){const ins=L.filter(r=>r.kind==='in'),outs=L.filter(r=>r.kind==='out');if(!ins.length)return null;const a=new Date(ins[0].at).getTime(),lo=outs.filter(o=>new Date(o.at).getTime()>a).pop();return {from:ins[0].at,to:lo?lo.at:null,h:((lo?new Date(lo.at).getTime():Date.now())-a)/36e5}}
function openAtt(){const L=todayRows(),h=hrs(L),last=L.filter(r=>r.kind!=='visit').pop(),inDay=last&&last.kind==='in',Q=outbox();
 const s=sheet('🕒 الحضور',`${ATT===null&&!ls(todKey())?'':''}
  <div class="cd"><h3>اليوم ${dd(new Date().toISOString())}</h3>${h?`<div class="${h.to?'ok':'wa'}">${h.to?`انتهى الدوام: ${tm(h.from)} – ${tm(h.to)} • ${num(h.h,1)} ساعة`:`بدأت ${tm(h.from)} • ${num(h.h,1)} ساعة حتى الآن`}</div>`:'<div class="wa">لم تسجّل بدء الدوام اليوم</div>'}

   <div class="muted" style="font-size:12px">يُسجَّل موقعك الحالي مع كل ضغطة. يعمل بدون اتصال ويُرسل لاحقاً.</div></div>
  ${Q.length?`<div class="cd"><h3>📤 محفوظ على الجوال (${Q.length})</h3>${Q.map(o=>`<div class="ln"><span>${KN[o.p.kind]} ${tm(o.p.at)}${o.p.school?' — '+esc(o.p.school):''}</span><small>${o.err?'⚠️ '+esc(o.err):'بانتظار الاتصال'}</small></div>`).join('')}<button class="bg b" data-f>🔄 إرسال الآن</button></div>`:''}
  <div class="cd"><h3>سجل اليوم</h3>${L.length?L.map(r=>`<div class="ln"><span>${KN[r.kind]||r.kind}${r.school?' — <b>'+esc(r.school)+'</b>':''}${r.dist_m!=null?` <small>(${r.dist_m<1000?r.dist_m+' م':num(r.dist_m/1000,1)+' كم'}${r.dist_m>500?' ⚠️':''})</small>`:''}</span><small>${tm(r.at)}${r.queued?' • 📤':''}</small></div>`).join(''):'<div class="muted">لا توجد تسجيلات</div>'}</div>`);

/* ---------- (6) my vehicle ---------- */
let VH=null,VL={};
async function vhLoad(){if(!navigator.onLine)return;try{const d=await db();const r=await d.from('fm_vehicles').select('*').eq('driver',uid()).eq('active',true);VH=r.error?null:(r.data||[])}catch(e){VH=null}}
const expTxt=(d,t)=>{if(!d)return '';const n=Math.round((new Date(d+'T12:00:00')-new Date(day()+'T12:00:00'))/864e5);return n<0?`<div class="al">⛔ ${t} منتهية منذ ${-n} يوم</div>`:n<=30?`<div class="wa">⏰ ${t} تنتهي خلال ${n} يوم (${dd(d)})</div>`:''};

 let ph=null;
 const s=sheet('🚗 سيارتي',`${(VH||[]).length>1?`<select data-sv>${VH.map(x=>`<option value="${esc(x.id)}" ${x.id===v.id?'selected':''}>${esc(x.plate)} — ${esc(x.code)}</option>`).join('')}</select>`:''}
  <div class="cd"><h3>${esc(v.plate)} <small>${esc(v.code)} • ${esc([v.make,v.model,v.year].filter(Boolean).join(' '))}</small></h3><div class="ln"><span>آخر قراءة للعداد</span><b>${v.odometer!=null?num(v.odometer,0)+' كم':'—'}</b></div>
   ${expTxt(v.ins_exp,'التأمين')}${expTxt(v.reg_exp,'الاستمارة')}${expTxt(v.check_exp,'الفحص الدوري')}</div>
  <div class="cd"><h3>➕ تسجيل</h3><div class="two"><div><label>النوع</label><select data-k="kind">${Object.entries(VK).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div><div><label>العداد (كم)</label><input data-k="od" inputmode="decimal" placeholder="${v.odometer!=null?num(v.odometer,0):''}"></div></div>
   <div class="two"><div><label>المبلغ (ر.س)</label><input data-k="am" inputmode="decimal"></div><div><label>اللترات</label><input data-k="li" inputmode="decimal"></div></div>
   <label>المحطة / الورشة</label><input data-k="st" maxlength="100"><label>ملاحظة</label><input data-k="nt" maxlength="300">

function shrink(file,max){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let s=Math.min(1,1280/Math.max(im.width,im.height));

 s.querySelector('[data-b]').onclick=()=>openSheet();s.querySelector('[data-v]').onclick=()=>vote(id);

<script id="fm231-common">(function(){'use strict';const C=window.FMCloud;if(!C)return;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const identity=()=>{const field=window.fmPartsIdentity230?.();if(field)return field.scope;const p=C.state?.profile;return p?.id?(C.cfg?.().url||'')+':'+p.id:''};
async function call(fn,args={}){const scope=identity();if(!scope)throw Error('سجّل الدخول أولًا');const d=await C.engClient();if(identity()!==scope)throw Error('تغير الحساب');const r=await d.rpc(fn,args);if(identity()!==scope)throw Error('تغير الحساب');if(r.error){let m=r.error.message;if(/schema cache|does not exist|Could not find/i.test(m))m='يلزم تشغيل supabase_setup.sql';else if(/duplicate stage recipient/.test(m))m='المستلم موجود في مرحلة مفعلة بنفس المدة؛ عدّل المرحلة الحالية';else if(/version conflict/.test(m))m='عُدّلت المرحلة من حساب آخر؛ أعد تحميلها';else if(/recipient inactive or outside region/.test(m))m='أحد المستلمين غير نشط أو خارج نطاق المنطقة';else if(/not allowed/.test(m))m='ليست لديك صلاحية لهذه العملية';throw Error(m)}return r.data}
const date=v=>v?new Date(v).toLocaleString('ar-SA-u-ca-gregory',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const reason={'SLA event no longer current':'أُلغي لتغير حالة البلاغ أو انتهاء المهلة',whatsapp_disabled:'واتساب غير مفعل',invalid_profile_phone:'رقم جوال الحساب غير صالح',template_missing:'قالب التصعيد غير مضبوط',sender_not_configured:'مرسل واتساب غير جاهز',queue_error:'تعذر وضع الرسالة في الانتظار',queue_rejected:'لم يقبل الطابور الرسالة'};
const state={pending:'بانتظار التجهيز',blocked:'متعذر',not_requested:'غير مطلوب',queued:'في طابور الإرسال',sent:'أُرسل عبر المزود',failed:'فشل / أُلغي',unavailable:'غير متاح على الجهاز'};
async function inbox(box,all=false,offset=0){box.innerHTML='<p role="status">جارٍ تحميل التنبيهات…</p>';try{const v=await call('fm_sla231_list',{p_all:all,p_offset:offset});if(!box.isConnected)return;
 box.innerHTML=`<p>غير مقروء في حسابي: <b>${v.unread}</b> • السجل: ${v.total} • إشعار الحساب مستقل عن تفعيل Push وواتساب.</p><div class="fm231-list">${v.items.map(i=>`<article class="fm231-alert ${i.read_at?'read':''}"><header><strong>${esc(i.title)}</strong><span>${esc(i.region)} • ${date(i.created_at)}</span></header><p>${esc(i.body)}</p><p>إلى: ${esc(i.recipient_name)} • مرحلة قبل المهلة بـ ${i.lead_minutes} دقيقة</p><div class="fm231-status"><span>واتساب: ${esc(state[i.wa_state]||i.wa_state)}${i.wa_reason?' — '+esc(reason[i.wa_reason]||i.wa_reason):''}</span><span>Push: ${esc(state[i.push_state]||i.push_state)}</span></div>${!i.source_open?'<p>أُغلق البلاغ أو أُلغي؛ هذا إشعار محفوظ للتوثيق.</p>':Date.parse(i.due_at)<=Date.now()?'<p>انتهت المهلة؛ هذا إشعار محفوظ للتوثيق.</p>':''}${i.mine&&!i.read_at?`<button type="button" data-read="${i.id}">تم الاطلاع</button>`:`<small>${i.read_at?'اطّلع عليه المستلم: '+date(i.read_at):'بانتظار اطلاع المستلم'}</small>`}</article>`).join('')||'<p>لا توجد تصعيدات حتى الآن.</p>'}</div><footer class="fm231-actions"><button data-prev ${offset===0?'disabled':''}>السابق</button><span>${offset+1}–${Math.min(offset+100,v.total)} من ${v.total}</span><button data-next ${offset+100>=v.total?'disabled':''}>التالي</button></footer><small>حالة «أُرسل عبر المزود» تعني قبول قناة الإرسال، ولا تثبت قراءة رسالة واتساب. لا يُنشأ تصعيد جديد بعد انتهاء المهلة.</small>`;
 box.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call('fm_sla231_read',{k:b.dataset.read});await inbox(box,all,offset)}catch(e){b.disabled=false;alert(e.message)}});box.querySelector('[data-prev]').onclick=()=>inbox(box,all,Math.max(0,offset-100));box.querySelector('[data-next]').onclick=()=>inbox(box,all,offset+100);
 }catch(e){box.innerHTML=`<p role="alert">${esc(e.message)}</p>`}}
window.fmSla231={call,esc,date,inbox,identity};
})();
</script>
<script id="fm231-field">(function(){'use strict';const A=window.fmSla231;if(!A)return;let lastScope='',lastFetch=0,unread=0;
