<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--ok:#067a06;--warn:#b45309;--bad:#b42323}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{display:block;font-size:11.5px;color:#94a3b8;font-weight:700}
.top button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 10px;font-weight:800}
.wrap{padding:12px 12px 90px;max-width:760px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;color:#334155}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs b{display:inline-block;min-width:20px;margin-inline-start:4px;border-radius:999px;background:rgba(100,116,139,.15);padding:0 6px;font-size:12px}
.tabs button.on b{background:rgba(255,255,255,.2)}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.tk{display:block;width:100%;text-align:start;cursor:pointer}
.tk .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tk .id{font:900 13px monospace;color:var(--pri)}
.tk .sch{font-weight:900;font-size:15.5px;margin:3px 0 1px}
.tk .cat{color:var(--mut);font-size:13px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800;border:1px solid var(--line);background:#f8fafc;color:#334155}
.c-bad{color:var(--bad);background:#fef2f2;border-color:#fecaca}.c-warn{color:var(--warn);background:#fffbeb;border-color:#fde68a}.c-ok{color:var(--ok);background:#f0fdf4;border-color:#bbf7d0}.c-pri{color:#3730a3;background:#eef2ff;border-color:#c7d2fe}
.empty{text-align:center;color:var(--mut);padding:40px 10px;font-weight:700}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:none}
.sheet.open{display:block}
h3{margin:0 0 8px;font-size:15px;font-weight:900}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}.kv span{color:var(--mut);font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{border:0;border-radius:12px;padding:13px 10px;font-weight:900;background:#e2e8f0;color:var(--ink);text-decoration:none;text-align:center;display:block}
.big.p{background:var(--pri);color:#fff}.big.g{background:var(--ok);color:#fff}.big.d{background:#0f172a;color:#fff}
.big:disabled{opacity:.45}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:#334155}
.stages button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stages button:disabled{opacity:.4}
label.l{display:block;font-weight:800;font-size:13px;color:#475569;margin:10px 0 4px}
.in{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:10px 12px;background:#fff}
textarea.in{min-height:90px;line-height:1.8}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph figure{margin:0;position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e2e8f0}
.ph img{width:100%;height:100%;object-fit:cover}

<div class="toast" id="toast"></div>
<script>
/* FM Cloud core — thin wrapper over supabase-js used by the desktop platform and the field app.
   Every network call goes through FMCloud.api so it can be replaced in tests. */
(function(){
'use strict';
if(window.FMCloud&&window.FMCloud.__core)return;
const CKEY='fm_cloud_v136';
const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const S=v=>String(v??'').trim();
function cfg(){try{const o=JSON.parse(localStorage.getItem(CKEY)||'{}')||{};return {url:S(o.url).replace(/\/+$/,''),key:S(o.key)}}catch(e){return {url:'',key:''}}}
function setCfg(o){try{if(!o)localStorage.removeItem(CKEY);else localStorage.setItem(CKEY,JSON.stringify({url:S(o.url).replace(/\/+$/,''),key:S(o.key)}))}catch(e){}client=null}
let libP=null,client=null;
function ensureLib(){if(window.supabase&&window.supabase.createClient)return Promise.resolve(true);if(libP)return libP;
 libP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB;s.onload=()=>window.supabase?.createClient?res(true):rej(new Error('تعذر تحميل مكتبة Supabase'));s.onerror=()=>{libP=null;rej(new Error('تعذر تحميل مكتبة Supabase — تحقق من الاتصال بالإنترنت'))};document.head.appendChild(s)});return libP}
async function sb(){const c=cfg();if(!c.url||!c.key)throw new Error('لم يتم إعداد الاتصال بالسحابة');if(client)return client;await ensureLib();
 client=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fm-cloud-auth'}});return client}
const chk=({data,error})=>{if(error)throw new Error(error.message||String(error));return data};
const ARmsg=m=>{m=String(m||'');if(/spend approval required/i.test(m))return 'المشتريات فوق سقف الاعتماد — يعتمدها مدير أعلى';if(/reason required/i.test(m))return 'اكتب السبب';if(/Invalid login/i.test(m))return 'البريد أو كلمة المرور غير صحيحة';if(/Email not confirmed/i.test(m))return 'لم يتم تأكيد البريد بعد — افتح رسالة التأكيد في بريدك';if(/already registered/i.test(m))return 'هذا البريد مسجل مسبقاً';if(/row-level security/i.test(m))return 'ليست لديك صلاحية لهذا الإجراء';if(/Failed to fetch|NetworkError|network/i.test(m))return 'تعذر الاتصال بالخادم — تحقق من الإنترنت';if(/Password should/i.test(m))return 'كلمة المرور قصيرة — 6 أحرف على الأقل';return m};
function b64ToBlob(d){const [h,b]=d.split(',');const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:mime})}
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)});

const real={
 async signIn(email,pw){const c=await sb();return chk(await c.auth.signInWithPassword({email:S(email),password:pw}))},
 async signUp(email,pw,name){const c=await sb();return chk(await c.auth.signUp({email:S(email),password:pw,options:{data:{full_name:S(name)}}}))},
 async signOut(){const c=await sb();await c.auth.signOut()},
 async updateContact(phone){const c=await sb();return chk(await c.rpc('fm_update_my_contact',{p_phone:phone}))},
 async changeEmail(em){const c=await sb();return chk(await c.auth.updateUser({email:em},{emailRedirectTo:location.origin+location.pathname.replace(/[^/]*$/,'')+'start.html'}))},
 async setPassword(pw){const c=await sb();chk(await c.auth.updateUser({password:pw}));try{chk(await c.rpc('fm_password_changed'))}catch(e){}return true},
 async session(){const c=await sb();const {data}=await c.auth.getSession();return data?.session||null},
 async me(){const c=await sb();const {data:{user}}=await c.auth.getUser();if(!user)return null;const p=chk(await c.from('profiles').select('*').eq('id',user.id).maybeSingle());return p?Object.assign({},p,{email:p.email||user.email}):{id:user.id,email:user.email,role:'pending',person_names:[],regions:[]}},
 async listProfiles(){const c=await sb();return chk(await c.from('profiles').select('*').order('created_at'))},
 async saveProfile(id,patch){const c=await sb();return chk(await c.from('profiles').update(Object.assign({},patch,{updated_at:new Date().toISOString()})).eq('id',id).select())},
 async pushTickets(rows,onProgress){const c=await sb();for(let i=0;i<rows.length;i+=400){chk(await c.from('tickets').upsert(rows.slice(i,i+400),{onConflict:'region,ticket_id'}));onProgress?.(Math.min(rows.length,i+400),rows.length)}return rows.length},
 async deleteTicketsNotIn(region,ids){const c=await sb();const have=[];for(let f=0;;f+=1000){const d=chk(await c.from('tickets').select('ticket_id').eq('region',region).range(f,f+999));have.push(...d.map(x=>x.ticket_id));if(d.length<1000)break}
  const keep=new Set(ids),gone=have.filter(t=>!keep.has(t));for(let i=0;i<gone.length;i+=200)chk(await c.from('tickets').delete().eq('region',region).in('ticket_id',gone.slice(i,i+200)));return gone.length},
 async pullTickets(region){const c=await sb();const out=[];for(let f=0;;f+=1000){let q=c.from('tickets').select('*').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);out.push(...d);if(d.length<1000)break}return out},
 async getKV(keys){const c=await sb();const r=chk(await c.from('app_kv').select('*').in('key',keys));
 /* V165: engineers / supervisors / contractors read only their schools of the school DB (fm_my_school_db) */
 if(keys.includes('fm_school_master_db_v1')&&!r.some(x=>x.key==='fm_school_master_db_v1')){const m=await c.rpc('fm_my_school_db');if(!m.error&&Array.isArray(m.data))r.push({key:'fm_school_master_db_v1',value:m.data})}return r},
 async setKV(key,value){const c=await sb();return chk(await c.from('app_kv').upsert({key,value,updated_at:new Date().toISOString()},{onConflict:'key'}))},
 async pullWork(region){const c=await sb();const work=[],events=[];
  for(let f=0;;f+=1000){let q=c.from('ticket_work').select('*').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);work.push(...d);if(d.length<1000)break}
  for(let f=0;;f+=1000){let q=c.from('ticket_events').select('*').order('at').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);events.push(...d);if(d.length<1000)break}
  return {work,events}},
 async pushWork(row){const c=await sb();return chk(await c.from('ticket_work').upsert(row,{onConflict:'region,ticket_id'}))},
 async addEvents(rows){if(!rows.length)return [];const c=await sb();return chk(await c.from('ticket_events').insert(rows))},
 async uploadPhoto(region,tid,kind,dataUrl,byName,geo){const c=await sb();const id=uuid();const path=`${region}/${tid}/${id}.jpg`;
  chk(await c.storage.from('ticket-photos').upload(path,b64ToBlob(dataUrl),{contentType:'image/jpeg',upsert:false}));
  chk(await c.from('ticket_photos').insert({id,region,ticket_id:tid,kind,path,by_name:byName,geo:geo||null}));return {id,path}},
 /* V145 work orders: reads go through RLS, every change through fm_wo_create / fm_wo_act */
 async woList(){const c=await sb();return chk(await c.from('work_orders').select('*').order('updated_at',{ascending:false}).limit(1000))},
 async woEvents(id){const c=await sb();return chk(await c.from('wo_events').select('*').eq('wo_id',id).order('at'))},
 async woAssignable(){const c=await sb();return chk(await c.rpc('fm_wo_assignable'))},
 async woCreate(o){const c=await sb();return chk(await c.rpc('fm_wo_create',{p:o}))},
 async woAct(id,action,note,geo,data){const c=await sb();return chk(await c.rpc('fm_wo_act',{p_id:id,p_action:action,p_note:note||null,p_geo:geo||null,p_data:data===undefined?null:data}))},
 async woUpload(id,kind,dataUrl,byName,geo,item,tag){const c=await sb();const pid=uuid();const path=`${id}/${pid}.jpg`;
  chk(await c.storage.from('wo-photos').upload(path,b64ToBlob(dataUrl),{contentType:'image/jpeg',upsert:false}));
  chk(await c.from('wo_photos').insert(Object.assign({id:pid,wo_id:id,kind,path,by_name:byName,geo:geo||null},item!=null?{item}:{},tag?{tag}:{})));return {id:pid,path}},
 async woRepair(src,p){const c=await sb();return chk(await c.rpc('fm_wo_repair',{p_src:src,p}))},
 async woMaterials(){const c=await sb();return chk(await c.from('wo_materials').select('id,name,unit,price,category').eq('active',true).order('category').order('name'))},
 async woPhotos(id){const c=await sb();const rows=chk(await c.from('wo_photos').select('*').eq('wo_id',id).order('at'));if(!rows.length)return [];
  const signed=chk(await c.storage.from('wo-photos').createSignedUrls(rows.map(r=>r.path),3600));const m=new Map(signed.map(s=>[s.path,s.signedUrl]));
  return rows.map(r=>({id:r.id,kind:r.kind,d:m.get(r.path)||'',by:r.by_name,at:r.at,item:r.item??null,tag:r.tag||null}))},
 async listPhotos(region,tid){const c=await sb();const rows=chk(await c.from('ticket_photos').select('*').eq('region',region).eq('ticket_id',tid).order('at'));if(!rows.length)return [];
  const signed=chk(await c.storage.from('ticket-photos').createSignedUrls(rows.map(r=>r.path),3600));const m=new Map(signed.map(s=>[s.path,s.signedUrl]));
  return rows.map(r=>({id:r.id,kind:r.kind,d:m.get(r.path)||'',by:r.by_name,at:new Date(r.at).getTime(),path:r.path,geo:r.geo}))},
 async deletePhoto(id,path){const c=await sb();if(path)await c.storage.from('ticket-photos').remove([path]);return chk(await c.from('ticket_photos').delete().eq('id',id))},
 async photoCounts(region){const c=await sb();const out={};for(let f=0;;f+=1000){let q=c.from('ticket_photos').select('ticket_id').range(f,f+999);if(region)q=q.eq('region',region);const d=chk(await q);d.forEach(x=>out[x.ticket_id]=(out[x.ticket_id]||0)+1);if(d.length<1000)break}return out},
 async subscribe(cb){const c=await sb();const ch=c.channel('fm-work').on('postgres_changes',{event:'*',schema:'public',table:'ticket_work'},p=>cb('work',p)).on('postgres_changes',{event:'INSERT',schema:'public',table:'ticket_events'},p=>cb('event',p)).subscribe();return ()=>{try{c.removeChannel(ch)}catch(e){}}}
};
window.FMCloud={__core:true,cfg,setCfg,api:real,msg:ARmsg,uuid,engClient:sb,
 configured:()=>{const c=cfg();return !!(c.url&&c.key)},
 /* in-app state */
 state:{on:false,profile:null},
 ROLE:{admin:'مدير النظام',engineer:'مهندس',supervisor:'مشرف',contractor:'مقاول',viewer:'مشاهد (إدارة)',pending:'بانتظار التفعيل'}};
})();

</script>

const QK='fmf_queue_v1';

const PDB=(()=>{let p=null;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('fmf_photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=async(m,f)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction('p',m),q=f(t.objectStore('p'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
 return {put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))}})();

 catch(e){if(netErr(e)||!navigator.onLine){const o=Object.assign({},op);delete o.d;if(op.k==='woup')await PDB.put(op.pid,op.d).catch(()=>{});
   let q=qLoad();if(o.k==='woact'&&o.a==='checklist')q=q.filter(x=>!(x.k==='woact'&&x.a==='checklist'&&x.id===o.id));q.push(o);qSave(q);return 'queued'}
  if(op.pid)pendMem.delete(op.pid);throw e}}

 qSave(rest);flushing=false;if(q.length!==rest.length){toast('تم إرسال '+fmt(q.length-rest.length)+' تحديث محفوظ');await pull(true);if(q.some(o=>/^wo/.test(o.k))){await woPull();if(D.curWo&&D.curWo!=='new')woRefresh(D.curWo)}}}

/* column look-up on the uploaded row, same header normalisation as the platform */
const HN=v=>String(v||'').replace(/[​-‏‪-‮؜﻿]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[()\[\]_\-\s.\/]+/g,'').toLowerCase();

const SLM_AL=['SLM','SLA','حالة SLM','حالة SLA','اتفاقية مستوى الخدمة'].map(HN);
const rawCol=(t,al)=>{const r=t.raw||{};const k=Object.keys(r).find(x=>al.includes(HN(x)));return k?r[k]:''};
const rawDesc=t=>{const r=t.raw||{};return S(Object.entries(r).find(([k])=>/وصف|description/i.test(k)&&!/حل/.test(k))?.[1]).replace(/<[^>]+>/g,' ')};
/* date parsing: ISO from the cloud, Excel serials, D/M/Y and Y-M-D with ص/م — as the platform's parseDateTime */
function parseDT(v){
 if(v==null||v==='')return null;if(v instanceof Date)return isNaN(v)?null:v;
 if(typeof v==='number')return v>20000&&v<70000?new Date(Math.round((v-25569)*864e5)):null;
 let s=S(v);if(!s)return null;
 if(/^\d{4}-\d{2}-\d{2}T/.test(s)){const d=new Date(s);return isNaN(d)?null:d}
 if(/^\d{5}(\.\d+)?$/.test(s)){const n=parseFloat(s);return n>20000&&n<70000?new Date(Math.round((n-25569)*864e5)):null}
 const pm=/مساء|م|pm/i.test(s),am=/صباح|ص|am/i.test(s);s=s.replace(/صباحاً|صباحا|مساءً|مساء|ص|م|am|pm/gi,'').trim();
 const hm=(m,i)=>{let h=m[i]?+m[i]:0;if(pm&&h<12)h+=12;if(am&&h===12)h=0;return [h,m[i+1]?+m[i+1]:0,m[i+2]?+m[i+2]:0]};
 let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
 if(m){let d=+m[1],mo=+m[2]-1;if(mo>=12&&d<=12){const x=d;d=mo+1;mo=x-1}const r=new Date(+m[3],mo,d,...hm(m,4));return isNaN(r)?null:r}
 m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
 if(m){const r=new Date(+m[1],+m[2]-1,+m[3],...hm(m,4));return isNaN(r)?null:r}
 const r=new Date(s);return isNaN(r)?null:r}
let MEMO=new Map();
const cdate=t=>t.created_at?new Date(t.created_at):null;
/* resolution date: the work record first, then the resolution column of the uploaded file */
function resAt(t){const w=D.work.get(key(t)),mk=key(t)+'|'+(w?w.updated_at||w.resolved_at||w.stage:'');if(MEMO.has(mk))return MEMO.get(mk);
 let r=null;if(w&&w.resolved_at)r=new Date(w.resolved_at);else if(done(stageT(t)))r=parseDT(rawCol(t,RES_AL));MEMO.set(mk,r);return r}
/* the status the platform shows: the field stage when there is one, otherwise the file status */
const ST_MAP={assigned:'تم التعيين',inspected:'قيد التنفيذ',progress:'قيد التنفيذ',parts:'قيد التنفيذ',resolved:'تم حله',closed:'مغلق',reopened:'قيد التنفيذ',cancelled:'ملغى'};
const platStatus=t=>{const w=D.work.get(key(t));return (w&&ST_MAP[w.stage])||S(t.status)};
const isClosedP=t=>{const s=platStatus(t);return s==='تم حله'||s==='مغلق'};
/* SLA exactly as getTicketSLAInfo: open tickets measured up to the latest date of the uploaded file */
function slaP(t){const pri=S(t.priority)||'متوسط',lim=D.hours[pri]||72,st=platStatus(t),c=cdate(t);
 if(st==='ملغى'||!c||isNaN(c))return {lim,breached:false};
 const closed=st==='تم حله'||st==='مغلق';let end;
 if(closed){const r=resAt(t);if(r&&!isNaN(r)&&r>=c)end=r.getTime();else return {lim,closed,breached:/اختراق|breached|متأخر|غير ملتزم/i.test(S(rawCol(t,SLM_AL)))}}
 else end=Math.max(D.ref[t.region]||Date.now(),c.getTime());
 const el=(end-c.getTime())/36e5;return {lim,el,closed,breached:el>lim}}
/* the platform's supervisor score (calculateStaffPerformanceScore): 35% completion, 35% SLA, 15% critical, 15% backlog */
function rating(L){const total=L.length;let res=0,br=0,cr=0,pen=0;
 L.forEach(t=>{const st=platStatus(t);if(st==='تم حله'||st==='مغلق')res++;else if(['قيد التنفيذ','تم التعيين','موافقة الاستشاري','معلق'].includes(st))pen++;const p=S(t.priority);if(p==='طارئ'||p==='عالي')cr++;if(slaP(t).breached)br++});
 const cl=x=>Math.max(0,Math.min(100,x)),r1=x=>Math.round(x*10)/10;
 const comp=total?cl(res/total*100):100,sl=total?cl((1-br/total)*100):100,crit=total?cl((1-cr/total)*100):100,pend=total?cl((1-pen/total)*100):100;
 const score=r1(cl(.35*comp+.35*sl+.15*crit+.15*pend));
 const lab=score>=90?['ممتاز','ok']:score>=80?['جيد جداً','pri']:score>=70?['مقبول','warn']:['ضعيف','bad'];
 return {score,comp:r1(comp),sla:r1(sl),crit:r1(crit),pend:r1(pend),total,res,br,cr,pen,label:lab[0],cls:lab[1]}}
/* repeated: the platform's rule (v31DetectDuplicates) — same school, description identical or word-similarity ≥ 50% */
const normD=v=>String(v??'').toLowerCase().normalize('NFKD').replace(/[ً-ٰٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ـ/g,'').replace(/[ً-ٟ]/g,'').replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();
function simD(a,b){const A=normD(a),B=normD(b);if(!A||!B)return 0;if(A===B)return 1;
 const ta=new Set(A.split(' ').filter(x=>x.length>1)),tb=new Set(B.split(' ').filter(x=>x.length>1));let hit=0;ta.forEach(x=>{if(tb.has(x))hit++});
 return Math.max(hit/Math.max(1,Math.min(ta.size,tb.size))*.95,hit/Math.max(1,ta.size+tb.size-hit))}
function repeats(L){const by=new Map();L.forEach(t=>{const s=normD(t.school).replace(/\s+/g,'');const d=rawDesc(t);if(!s||!d)return;if(!by.has(s))by.set(s,[]);by.get(s).push({t,d})});
 const keys=new Set(),groups=[];
 by.forEach(arr=>{if(arr.length<2)return;const par=arr.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));
  for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(simD(arr[i].d,arr[j].d)>=.5){const a=f(i),b=f(j);if(a!==b)par[b]=a}
  const cl=new Map();arr.forEach((x,i)=>{const k=f(i);if(!cl.has(k))cl.set(k,[]);cl.get(k).push(x.t)});
  cl.forEach(g=>{if(g.length>1){groups.push(g);g.forEach(t=>keys.add(key(t)))}})});

/* reopened in the period: a «reopened» stage in the history or as the current stage */
function reopened(a,b){const keys=new Set();D.tickets.forEach(t=>{const k=key(t),w=D.work.get(k);
  if((D.events.get(k)||[]).some(e=>e.stage==='reopened'&&inR(new Date(e.at),a,b))||(w&&w.stage==='reopened'&&inR(new Date(w.updated_at),a,b)))keys.add(k)});return keys}

function pstats(a,b){
 const rec=D.tickets.filter(t=>inR(cdate(t),a,b)),cls=D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),a,b));

const SOON_H=24,H3=3;

const DAY=864e5;
const d0=d=>{d=new Date(d);d.setHours(0,0,0,0);return d};
const addD=(d,n)=>new Date(d0(d).getTime()+n*DAY);
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dshow=d=>d.toLocaleDateString(GREG,{day:'numeric',month:'short'});
const PRESETS=[['w','هذا الأسبوع'],['m','هذا الشهر'],['pm','الشهر الماضي'],['d30','آخر 30 يوماً'],['d90','آخر 90 يوماً'],['c','فترة مخصصة']];
function range(k,from,to){const t=d0(new Date());
 if(k==='w'){const a=addD(t,-t.getDay());return [a,addD(t,1)]}
 if(k==='m')return [monthStart(),addD(t,1)];
 if(k==='pm')return [monthStart(-1),monthStart()];
 if(k==='d90')return [addD(t,-89),addD(t,1)];
 if(k==='c'&&from&&to){const a=d0(from),b=addD(to,1);return a<b?[a,b]:[addD(to,0),addD(from,1)]}
 return [addD(t,-29),addD(t,1)]}
function cmpRange(a,b){const p=D.p;if(p.cmp==='c'&&p.cfrom&&p.cto)return range('c',p.cfrom,p.cto);
 if(p.k==='m'||p.k==='pm'){const s=new Date(a);s.setMonth(s.getMonth()-1);const len=b-a;return [s,new Date(Math.min(s.getTime()+len,a.getTime()))]}
 const len=b-a;return [new Date(a-len),a]}
const label=(a,b)=>`${dshow(a)} – ${dshow(addD(b,-1))}`;
/* change versus the comparison period; lower-is-better metrics colour the other way */
function delta(cur,prev,lowGood,isPct){if(cur==null||prev==null)return '<span class="dl">—</span>';const d=cur-prev;if(Math.abs(d)<1e-9)return '<span class="dl">= بدون تغيير</span>';
 const good=lowGood?d<0:d>0,txt=isPct?fmt(Math.abs(d),1)+' نقطة':fmt(Math.abs(d),Math.abs(d)%1?1:0);return `<span class="dl ${lowGood==null?'':good?'up':'down'}">${d>0?'▲':'▼'} ${txt}</span>`}
/* received vs resolved per day (per week beyond 92 days) */
function series(a,b){const days=Math.round((b-a)/DAY),step=days>92?7:1,n=Math.ceil(days/step),R=Array(n).fill(0),Z=Array(n).fill(0),X=[];
 for(let i=0;i<n;i++)X.push(new Date(a.getTime()+i*step*DAY));
 const idx=d=>{const i=Math.floor((d-a)/(step*DAY));return i>=0&&i<n?i:-1};
 D.tickets.forEach(t=>{const c=cdate(t);if(c){const i=idx(c);if(i>=0)R[i]++}if(isClosedP(t)){const r=resAt(t);if(r){const i=idx(r);if(i>=0)Z[i]++}}});
 return {X,R,Z,step}}
const CH={W:360,H:200,L:28,Rm:8,T:12,Bm:24};
function chartSvg(S1){const {W,H,L,Rm,T,Bm}=CH,n=S1.X.length,max=Math.max(1,...S1.R,...S1.Z);
 const nice=Math.ceil(max/4)*4||4,x=i=>L+(n<2?(W-L-Rm)/2:i*(W-L-Rm)/(n-1)),y=v=>T+(H-T-Bm)*(1-v/nice);
 const path=A=>A.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
 const grid=[0,1,2,3,4].map(k=>{const v=nice*k/4;return `<line x1="${L}" x2="${W-Rm}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${fmt(v)}</text>`}).join('');
 const ticks=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i&&v>=0).map(i=>`<text x="${x(i)}" y="${H-8}" class="ax" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${dshow(S1.X[i])}</text>`).join('');
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="البلاغات المستلمة والمحلولة">${grid}${ticks}
  <path d="${path(S1.R)}" class="ln" stroke="#2a78d6"/><path d="${path(S1.Z)}" class="ln" stroke="#eb6834"/>
  <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-Bm}" style="display:none"/><circle class="dt r" r="4.5" style="display:none" fill="#2a78d6"/><circle class="dt z" r="4.5" style="display:none" fill="#eb6834"/>
  <rect x="${L}" y="${T}" width="${W-L-Rm}" height="${H-T-Bm}" fill="transparent" class="hit"/></svg>`}
function bindChart(box,S1){const svg=box.querySelector('svg'),tip=box.querySelector('.ctip'),n=S1.X.length,{W,L,Rm,T,H,Bm}=CH,max=Math.max(1,...S1.R,...S1.Z),nice=Math.ceil(max/4)*4||4;
 const x=i=>L+(n<2?(W-L-Rm)/2:i*(W-L-Rm)/(n-1)),y=v=>T+(H-T-Bm)*(1-v/nice);
 const show=ev=>{const r=svg.getBoundingClientRect(),px=(ev.clientX-r.left)/r.width*W;let i=Math.round((px-L)/((W-L-Rm)/Math.max(1,n-1)));i=Math.max(0,Math.min(n-1,i));
  const xh=svg.querySelector('.xh');xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.style.display='';

  const end=S1.step>1?' – '+dshow(addD(S1.X[i],6)):'';tip.innerHTML=`<b>${dshow(S1.X[i])}${end}</b><div><i style="background:#2a78d6"></i>مستلمة <b>${fmt(S1.R[i])}</b></div><div><i style="background:#eb6834"></i>محلولة <b>${fmt(S1.Z[i])}</b></div>`;
  tip.style.display='block';const left=x(i)/W*r.width;tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,left-tip.offsetWidth/2))+'px'};
 const hide=()=>{tip.style.display='none';svg.querySelectorAll('.xh,.dt').forEach(e=>e.style.display='none')};
 const hit=svg.querySelector('.hit');hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);hit.addEventListener('pointerleave',hide)}

/* ---------- F7: weekly goal, anonymous ranking, near-breach alerts, PDF report, today's visit plan ---------- */
const weekStart=()=>{const t=d0(new Date());return addD(t,-t.getDay())};
const uidKey=k=>k+'_'+(D.me?.id||'me');
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* weekly goal: closed this week vs a target; the suggestion is the average of the last 4 weeks + 10% */
function goalInfo(){const ws=weekStart(),done=D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),ws,addD(new Date(),1))).length;
 const past=[1,2,3,4].map(i=>D.tickets.filter(t=>isClosedP(t)&&inR(resAt(t),addD(ws,-7*i),addD(ws,-7*(i-1)))).length);
 const sug=Math.max(5,Math.round(past.reduce((a,b)=>a+b,0)/4*1.1));const goal=+lsGet(uidKey('fmf_goal'),0)||sug;
 const day=new Date().getDay()+1,expect=Math.round(goal*day/7);return {done,goal,sug,custom:!!lsGet(uidKey('fmf_goal'),0),pct:Math.min(100,Math.round(done*100/goal)),behind:done<expect,expect,daysLeft:7-day}}
function goalCard(){const g=goalInfo();return `<div class="card goal"><div class="r1"><h3 style="margin:0">🎯 هدف الأسبوع</h3><button class="link" id="g-ed" style="border:0;background:none">تعديل</button></div>
 <div class="gnum"><b>${fmt(g.done)}</b> / ${fmt(g.goal)} بلاغ مُغلق</div><div class="gbar"><i style="width:${g.pct}%" class="${g.pct>=100?'ok':g.behind?'warn':''}"></i></div>
 <div class="muted">${g.pct>=100?'👏 حققت هدف الأسبوع':g.behind?`أنت متأخر عن الوتيرة — المتوقع حتى اليوم ${fmt(g.expect)}، تبقّى ${fmt(g.goal-g.done)} في ${fmt(g.daysLeft+1)} يوم`:`على الطريق الصحيح — تبقّى ${fmt(g.goal-g.done)} بلاغ`}${g.custom?'':` • الهدف مقترح من متوسط أسابيعك السابقة`}</div></div>`}
function bindGoal(){const b=$('#g-ed');if(!b)return;b.onclick=()=>{const g=goalInfo(),v=prompt('هدف الأسبوع (عدد البلاغات المغلقة)',g.goal);if(v===null)return;const n=Math.round(+v);
 if(!n||n<1){lsSet(uidKey('fmf_goal'),0)}else lsSet(uidKey('fmf_goal'),n);main()}}

/* ranking published by the platform at the last upload: find my rank through the hash of my name */
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
/* V160 (F20): contact with the schools in my score — the platform's weights (fm_settings.score_weights), my coverage of the
   last 4 weekly cycles / 30 days and my satisfaction from the ratings of the last 90 days (fm_eng_scores). A part without
   data gives its share back to the tickets. */
/* V164 (F21): usage — one fm_touch('field') per open, then at most every 10 minutes while visible */
let touchAt=0;function touchField(){if(!D.me||document.hidden||Date.now()-touchAt<6e5||!C.engClient)return;touchAt=Date.now();C.engClient().then(db=>db.rpc('fm_touch',{p_app:'field'})).catch(()=>{})}
setInterval(touchField,60000);document.addEventListener('visibilitychange',touchField);
/* V166 (F23): leaves — my own, the one I cover, and my manager's (with his deputy) */
async function loadLeaves(){if(!D.me||!C.engClient)return;const db=await C.engClient();const x=await db.rpc('fm_leaves');D.leaves=!x.error&&Array.isArray(x.data)?x.data.filter(l=>l.running):[]}
function leaveBanner(){const L=D.leaves||[],me=D.me||{},dd=v=>new Date(v).toLocaleDateString(GREG,{day:'numeric',month:'long'});
 return L.map(l=>l.principal===me.id?`<div class="card" style="background:#eff6ff;border-color:#93c5fd;font-weight:800">🏖️ أنت في إجازة حتى ${esc(dd(l.to_at))} — ينوب عنك ${esc(l.deputy_name)}. مستهدفات التواصل موقوفة خلال الإجازة.</div>`
  :l.deputy===me.id?`<div class="card" style="background:#fffbeb;border-color:#f59e0b;font-weight:800">👥 أنت تنوب عن ${esc(l.principal_name)} حتى ${esc(dd(l.to_at))}: أوامره محوّلة إليك (اقبلها من «الأوامر»)، وترى مدارسه وتسجّل تواصلها.</div>`
  :l.principal===me.reports_to?`<div class="card" style="background:#fffbeb;border-color:#f59e0b;font-weight:800">ℹ️ ${esc(l.principal_name)} في إجازة حتى ${esc(dd(l.to_at))} — النائب: ${esc(l.deputy_name)}. راجعه في الأوامر والاعتماد.</div>`:'').join('')}
async function loadMyEng(){if(!D.me||!['supervisor','engineer'].includes(D.me.role)||!C.engClient)return;const db=await C.engClient();
 const [sc,w]=await Promise.all([db.rpc('fm_eng_scores'),db.from('fm_settings').select('value').eq('key','score_weights').maybeSingle()]);if(sc.error||!Array.isArray(sc.data))return;
 const x=sc.data.find(r=>r.user_id===D.me.id);if(!x)return;const v=(w&&w.data&&w.data.value)||{},W=v.cov==null&&v.sat==null?{cov:10,sat:10}:{cov:Math.max(0,Math.min(50,+v.cov||0)),sat:Math.max(0,Math.min(50,+v.sat||0))};
 D.eng={cov:x.cov==null?null:+x.cov,sat:x.sat==null?null:+x.sat,hit:x.cov_hit,tot:x.cov_total,n:x.sat_n,W}}
function myRating(){const R=rating(D.tickets),x=D.eng;R.f=1;if(!x)return R;const wc=x.cov!=null?x.W.cov:0,ws=x.sat!=null?x.W.sat:0;if(!wc&&!ws)return R;
 const f=(100-wc-ws)/100,score=Math.round(Math.max(0,Math.min(100,R.score*f+(wc?x.cov*wc/100:0)+(ws?x.sat*ws/100:0)))*10)/10;
 const lab=score>=90?['ممتاز','ok']:score>=80?['جيد جداً','pri']:score>=70?['مقبول','warn']:['ضعيف','bad'];
 return Object.assign(R,{score,label:lab[0],cls:lab[1],f,cov:wc?x.cov:undefined,sat:ws?x.sat:undefined,wc,ws,ticketScore:R.score})}
async function loadMyRank(){D.myRank=null;if(!(window.crypto&&crypto.subtle))return;const names=(D.me?.person_names||[]).map(S).filter(Boolean);if(!names.length)return;
 const hs=await Promise.all(names.map(sha));let best=null;
 Object.entries(D.rank||{}).forEach(([reg,o])=>{if(!o||!o.ranks)return;hs.forEach(h=>{const x=o.ranks[h];if(x&&(!best||x.r<best.r))best={reg,r:x.r,s:x.s,n:o.n,at:o.at,scores:o.scores||[]}})});D.myRank=best}
function rankHtml(){const k=D.myRank;if(!k)return '';const top=Math.round(k.r*100/Math.max(1,k.n));
 return `<div class="rank"><div><b>🏅 ترتيبك ${fmt(k.r)} من ${fmt(k.n)}</b> بين مشرفي ${esc(RN[k.reg]||k.reg)}${top<=25?' — ضمن أفضل الربع 👏':''}</div>
  <div class="dots" title="درجات المشرفين بدون أسماء">${k.scores.map(v=>`<i class="${v===k.s?'me':''}" style="right:${100-Math.max(0,Math.min(100,v))}%"></i>`).join('')}</div>
  <div class="muted">حسب آخر رفع للملف (${dts(k.at)}) — بدرجتك وقتها ${fmt(k.s,k.s%1?1:0)}. لا تظهر أسماء المشرفين الآخرين.</div></div>`}

/* near-breach alerts: checked every 5 minutes while the app is open (also in a background tab) */
const NKEY=()=>uidKey('fmf_notified');
const notifOn=()=>!!lsGet(uidKey('fmf_alerts'),false);
async function setAlerts(on){if(on&&'Notification' in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}lsSet(uidKey('fmf_alerts'),!!on);if(on)checkAlerts(true)}

/* today's visit plan: the most urgent schools, ordered as a route from my position (nearest next) */
function planData(){const rows=schoolRows().filter(r=>r.open);const its=items();
 rows.forEach(r=>{const L=its.filter(x=>isOpenX(x)&&(S(x.t.school)||'—')===r.name);r.h3=L.filter(isH3).length;r.emg=L.filter(x=>x.t.priority==='طارئ').length;
  r.u=r.h3*100+Math.min(r.late,10)*10+r.soon*20+r.emg*5+r.open});
 const pick=rows.filter(r=>r.xy).sort((a,b)=>b.u-a.u).slice(0,D.plan.n),noXY=rows.filter(r=>!r.xy).sort((a,b)=>b.u-a.u).slice(0,5);
 const route=[];let cur=D.myPos,left=pick.slice();
 if(!cur&&left.length){left.sort((a,b)=>b.u-a.u);cur=left[0].xy}
 while(left.length){left.sort((a,b)=>dist(cur,a.xy)-dist(cur,b.xy)||b.u-a.u);
  /* a school with tickets about to breach jumps the queue if it is less than 15 km further */
  const urgent=left.find(r=>r.h3&&dist(cur,r.xy)-dist(cur,left[0].xy)<15000);const nx=urgent||left[0];
  route.push(Object.assign(nx,{leg:D.myPos||route.length?dist(cur,nx.xy):null}));cur=nx.xy;left=left.filter(r=>r!==nx)}
 return {route,noXY}}

/* V156: assignment from the school DB. Every person of the DB (maintenance / light-services supervisor and engineer)
   is matched to an account (email, then name / person_names with Arabic-insensitive compare); the admin can create
   the missing accounts with one temporary password (changed at first sign-in), then assign every school to its people,
   optionally link each supervisor to his engineer and stop assignments that left the DB */
const nrm=v=>String(v||'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ً-ْـ]/g,'').replace(/^\s*(ال)?(مهندس|م\s*[.\/]|م\s)\s*/,'').replace(/\s+/g,' ').trim().toLowerCase();
const RK=r=>/qassim|القصيم/i.test(r||'')?'qassim':/riyadh|الرياض/i.test(r||'')?'riyadh':'';
const SLOTS=[['supervisor','supervisor','supervisorEmail','supervisorPhone','engineer'],['engineer','engineer','engineerEmail','engineerPhone',''],['supervisor','lightSupervisor','lightSupervisorEmail','lightSupervisorPhone','lightEngineer'],['engineer','lightEngineer','lightEngineerEmail','lightEngineerPhone','']];
async function schoolDb(){let s=null;try{s=JSON.parse(localStorage.getItem('fm_school_master_db_v1')||'null')}catch(e){}
 if(!Array.isArray(s)||!s.length){const kv=await C.api.getKV(['fm_school_master_db_v1']);s=kv[0]?.value;if(typeof s==='string')s=JSON.parse(s)}
 if(!Array.isArray(s)||!s.length)throw Error('قاعدة المدارس غير متاحة — ارفعها أولاً من «قاعدة بيانات المدارس»');return s}
function plan(S){const people=new Map(),bad=[],acc=P.filter(p=>p.active!==false&&['engineer','supervisor'].includes(p.role));
 const find=x=>{const em=x.email.toLowerCase();if(em){const m=acc.filter(p=>String(p.email||'').toLowerCase()===em);if(m.length)return m}
  const n=nrm(x.name);return acc.filter(p=>[p.full_name,...(p.person_names||[])].some(v=>nrm(v)===n))};
 for(const s of S){const school_code=code(s.buildingId),school_name=String(s.school||'').trim();if(!school_code||!school_name){bad.push(school_name||'(بلا اسم)');continue}
  for(const [role,k,ke,kp,kb] of SLOTS){const name=String(s[k]||'').trim();if(!name||/^غير (معرف|محدد)$|^[-—]$/.test(name))continue;const key='n:'+nrm(name);
   let x=people.get(key);if(!x)people.set(key,x={key,name,email:'',phone:'',role,regions:new Set(),schools:new Map(),bosses:new Map()});
   if(!x.email&&String(s[ke]||'').includes('@'))x.email=String(s[ke]).trim();if(!x.phone&&s[kp])x.phone=String(s[kp]).trim();
   x.schools.set(school_code,{school_code,school_name,region:RK(s.region)});if(RK(s.region))x.regions.add(RK(s.region));
   if(kb&&String(s[kb]||'').trim()){const b='n:'+nrm(s[kb]);x.bosses.set(b,(x.bosses.get(b)||0)+1)}}}
 const L=[...people.values()];L.forEach(x=>{const m=find(x);x.acc=m.length===1?m[0]:null;x.multi=m.length>1});
 return {L:L.sort((a,b)=>Number(!!a.acc)-Number(!!b.acc)||b.schools.size-a.schools.size),people,bad}}
async function sync(){await safe(async()=>{const S=await schoolDb(),pl=plan(S),L=pl.L,box=root().querySelector('#eg-unmatched');
 const ok=L.filter(x=>x.acc),miss=L.filter(x=>!x.acc&&!x.multi),multi=L.filter(x=>x.multi),nA=ok.reduce((a,x)=>a+x.schools.size,0);
 box.innerHTML=`<p><b>${S.length}</b> مدرسة في القاعدة • <b>${L.length}</b> مشرف / مهندس • لهم حساب: <b>${ok.length}</b> • بلا حساب: <b>${miss.length}</b>${multi.length?` • أكثر من حساب بنفس الاسم: <b>${multi.length}</b>`:''}${pl.bad.length?` • مدارس بلا رقم مبنى (تُتخطّى): ${pl.bad.length}`:''}</p>`

  +(miss.some(x=>!x.email)?`<p>من ليس له بريد في القاعدة: أضف بريده في «قاعدة بيانات المدارس» ثم أعد المراجعة، أو أنشئ حسابه من «السحابة والمستخدمين» وأضف اسمه كما في القاعدة إلى «الأسماء البديلة».</p>`:'')
  +`<h3>تطبيق الإسناد</h3><label><input type="checkbox" id="eg-boss" checked> ربط كل مشرف بمهندسه حسب القاعدة (لمن ليس له مدير مباشر)</label><label><input type="checkbox" id="eg-off"> إيقاف الإسنادات التي لم تعد في القاعدة</label><button id="eg-apply" ${nA?'':'disabled'}>إسناد ${nA} مدرسة لـ ${ok.length} موظف</button>`;
 const cr=box.querySelector('#eg-create');if(cr)cr.onclick=()=>safe(async()=>{const pw=box.querySelector('#eg-tmp').value;if(pw.length<8)throw Error('كلمة المرور المؤقتة 8 أحرف على الأقل');

  for(const x of sel){try{const nid=await C.api.createUser({email:x.email,password:pw,full_name:x.name,role:x.role,regions:[...x.regions],person_names:[x.name]});if(nid)await C.api.saveProfile(nid,{job_title:x.role==='engineer'?'area_engineer':'supervisor'}).catch(()=>{});n++}catch(er){fail.push(x.name+': '+(C.msg?C.msg(er.message):er.message))}cr.textContent=`… ${n} / ${sel.length}`}

  ok.forEach(x=>x.schools.forEach(s=>seen.set(s.school_code+'|'+x.acc.id,{school_code:s.school_code,school_name:s.school_name,region:s.region,user_id:x.acc.id,active:true})));
  const items=[...seen.values()];for(let i=0;i<items.length;i+=200){check(await db.from('fm_eng_assignments').upsert(items.slice(i,i+200),{onConflict:'school_code,user_id'}));b.textContent=`… ${Math.min(i+200,items.length)} / ${items.length}`}
  let off=0,links=0;
  if(box.querySelector('#eg-off').checked){const ids=A.filter(a=>a.active&&!seen.has(a.school_code+'|'+a.user_id)&&!/^TEST-/.test(a.school_code)).map(a=>a.id);
   for(let i=0;i<ids.length;i+=200){check(await db.from('fm_eng_assignments').update({active:false}).in('id',ids.slice(i,i+200)))}off=ids.length}
  if(box.querySelector('#eg-boss').checked)for(const x of ok){if(x.acc.role!=='supervisor'||x.acc.reports_to||!x.bosses.size)continue;
   const bk=[...x.bosses.entries()].sort((a,c)=>c[1]-a[1])[0][0],boss=pl.people.get(bk);if(!boss||!boss.acc||boss.acc.role!=='engineer')continue;
   try{await C.api.saveProfile(x.acc.id,{reports_to:boss.acc.id});links++}catch(er){}}
  A=await all('fm_eng_assignments');if(links)P=await C.api.listProfiles();content();
  msg(`تم إسناد ${items.length} مدرسة لـ ${ok.length} موظف${off?` • أُوقف ${off} إسناد لم يعد في القاعدة`:''}${links?` • رُبط ${links} مشرف بمهندسه`:''}`)})})}

.fm167-dlg{position:fixed;inset:0;z-index:2147482700;background:rgba(2,6,23,.6);display:flex;align-items:center;justify-content:center;padding:14px;direction:rtl;font-family:Cairo,Tahoma,sans-serif}
.fm167-dlg>div{background:#fff;color:#0f172a;border-radius:18px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 18px 14px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.fm167-dlg h3{margin:0 0 8px;font-size:18px}.fm167-dlg .n{border-radius:14px;padding:12px 14px;margin:8px 0;line-height:1.9}
.fm167-dlg .n.normal{background:#eff6ff;border:1px solid #bfdbfe}.fm167-dlg .n.important{background:#fffbeb;border:1px solid #fde68a}.fm167-dlg .n.urgent{background:#fef2f2;border:1px solid #fecaca}
.fm167-dlg .n b{font-size:15px}.fm167-dlg .n small{display:block;color:#64748b;font-size:12px;margin-top:4px}.fm167-dlg .n p{margin:6px 0 0;white-space:pre-wrap}

</style>
<script id="fm-v167-news">(function(){
'use strict';
/* V167: news ticker shared by the platform and the field app. Items come from fm_news_feed() (only those for the
   signed-in person: titles, regions, team); «urgent» items also open a window once on each device. */
const C=window.FMCloud;if(!C)return;
const S=v=>String(v??'').trim(),esc=v=>S(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR={normal:'خبر',important:'مهم',urgent:'عاجل'};
const dt=v=>v?new Date(v).toLocaleString('ar-SA-u-ca-gregory',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'';
const SEEN='fm167_seen',ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};
let items=[],sig='',busy=false;
function bar(){let b=document.getElementById('fm167-bar');if(!b){b=document.createElement('div');b.id='fm167-bar';b.setAttribute('role','marquee');b.setAttribute('aria-label','شريط الأخبار');
 b.innerHTML='<span class="lbl">📢 الأخبار</span><div class="vp"><div class="track"></div></div><button class="pz" type="button" title="إيقاف / تشغيل الحركة">⏸</button>';document.body.prepend(b);
 b.querySelector('.pz').onclick=e=>{b.classList.toggle('paused');e.currentTarget.textContent=b.classList.contains('paused')?'▶':'⏸';try{sessionStorage.setItem('fm167_paused',b.classList.contains('paused')?'1':'')}catch(_){}};
 try{if(sessionStorage.getItem('fm167_paused')){b.classList.add('paused');b.querySelector('.pz').textContent='▶'}}catch(_){}
 b.addEventListener('click',e=>{const it=e.target.closest('.it');if(it)show([items.find(x=>x.id===it.dataset.id)].filter(Boolean),'📢 خبر')})}return b}
function draw(){const s=JSON.stringify(items.map(x=>[x.id,x.text,x.priority,x.updated_at]));if(s===sig)return;sig=s;
 if(!items.length){document.body.classList.remove('fm167-on');return}
 const b=bar(),one=items.slice().reverse().map(x=>`<button type="button" class="it ${x.priority}" data-id="${esc(x.id)}">${x.pinned?'📌':''}<b>${PR[x.priority]||''}</b>${esc(x.text)}</button><span class="sep">◆</span>`).join('');
 const tr=b.querySelector('.track');tr.innerHTML=one+one;const len=items.reduce((a,x)=>a+S(x.text).length,0);tr.style.setProperty('--fm167d',Math.max(25,Math.round(len*0.28+items.length*4))+'s');
 document.body.classList.add('fm167-on')}
function show(L,title,ack){if(!L.length)return;const d=document.createElement('div');d.className='fm167-dlg';
 d.innerHTML=`<div><h3>${title}</h3>${L.map(x=>`<div class="n ${x.priority}"><b>${x.priority==='urgent'?'🚨 ':''}${esc(x.text)}</b>${x.body?`<p>${esc(x.body)}</p>`:''}<small>${esc(x.author_name||'')} • ${esc(dt(x.start_at))}</small></div>`).join('')}<button class="ok" type="button">${ack?'تم الاطلاع':'إغلاق'}</button></div>`;
 document.body.appendChild(d);const close=()=>{if(ack){const s=ls(SEEN,[]);L.forEach(x=>{if(!s.includes(x.id))s.push(x.id)});try{localStorage.setItem(SEEN,JSON.stringify(s.slice(-300)))}catch(e){}}d.remove()};
 d.querySelector('.ok').onclick=close;d.addEventListener('click',e=>{if(e.target===d&&!ack)d.remove()})}
async function load(){if(busy||!C.engClient||document.hidden)return;const st=C.state;let signed=st&&st.on?st.profile:null;
 /* the field app has no cloud state: its session tells whether someone is signed in */
 if(!(st&&st.on)){try{signed=await C.api.session()}catch(e){}}if(!signed)return;busy=true;
 try{const db=await C.engClient();const r=await db.rpc('fm_news_feed');if(r.error)throw r.error;items=Array.isArray(r.data)?r.data:[];draw();
  const seen=ls(SEEN,[]),u=items.filter(x=>x.priority==='urgent'&&!seen.includes(x.id));if(u.length&&!document.querySelector('.fm167-dlg'))show(u,'🚨 خبر عاجل',true)}
 catch(e){items=[];draw()}finally{busy=false}}
window.fmV167Reload=()=>{sig='';return load()};
setTimeout(load,4000);setInterval(load,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script>

body.fm167-on .top{top:var(--fm167h)}body.fm167-on .sheet,body.fm167-on #eng-page{top:var(--fm167h)!important}body.fm167-on .abar{top:calc(env(safe-area-inset-top) + 8px + var(--fm167h))}
#fm167-bar .lbl{padding:0 8px;font-size:13px}#fm167-bar{font-size:13px}
</style>
<script id="fmf-28-saas">(function(){
'use strict';
/* F28 (V179, SaaS): the subscription of the company (section 23 fm_plan_info): a bar 15 days before the end and in the
   grace period, a lock message once it expired (the system admin enters the code in the platform). */
const C=window.FMCloud;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let n=0;const t=setInterval(async()=>{if(++n>60){clearInterval(t);return}try{if(!C||!C.engClient)return;const db=await C.engClient();if(!db)return;const r=await db.rpc('fm_plan_info');if(r.error||!r.data)return;clearInterval(t);const i=r.data;
 if(i.state==='warn'||i.state==='grace'){const b=document.createElement('div');b.style.cssText='position:fixed;left:0;right:0;bottom:64px;z-index:1500;padding:7px 12px;text-align:center;font:800 12.5px Cairo,Tahoma,sans-serif;direction:rtl;'+(i.state==='warn'?'background:#fef3c7;color:#92400e':'background:#b91c1c;color:#fff');
  b.textContent=i.state==='warn'?`⏳ ينتهي اشتراك ${i.company} خلال ${i.days_left} يوم`:`⛔ انتهى اشتراك ${i.company} — يتوقف الدخول خلال ${+i.grace_days+ +i.days_left} يوم`;b.onclick=()=>b.remove();document.body.appendChild(b)}
 if(i.state==='expired'){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:3000;background:rgba(15,23,42,.94);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:800 15px Cairo,Tahoma,sans-serif;direction:rtl;line-height:2';
  d.innerHTML=`<div><div style="font-size:44px">🔒</div>انتهى اشتراك ${esc(i.company)}<br><span style="font-size:13px;color:#cbd5e1">البيانات محفوظة — يعود العمل بعد أن يُدخل مدير النظام كود التفعيل في المنصة.</span></div>`;document.body.appendChild(d)}}catch(e){}},2500);
})();
</script>
