<style>
/* SU1 (V262) — supplier portal: a private link per supplier, no account */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:#0f172a}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#7c3aed);display:flex;align-items:flex-start;justify-content:center;padding:14px}
.box{width:min(760px,100%);background:#fff;border-radius:22px;padding:18px 16px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.brand{text-align:center;color:#64748b;font-weight:800;font-size:13px}
h1{margin:2px 0;text-align:center;font-size:22px}.sub{text-align:center;color:#475569;font-size:13px;margin-bottom:10px}
.msg{text-align:center;color:#991b1b;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.kp div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center}.kp b{display:block;font-size:20px}.kp span{font-size:11.5px;color:#64748b}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{flex:0 0 auto;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font:800 13px Cairo,Tahoma,sans-serif;cursor:pointer}.tabs button.on{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.bdg{background:#dc2626;color:#fff;border-radius:999px;padding:0 6px;margin-inline-start:4px;font-size:11px}
.it{border:1px solid #e2e8f0;border-radius:14px;padding:10px;margin-bottom:10px}.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}small{color:#64748b}
.st{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569}.st.new,.st.approved{background:#dbeafe;color:#1e40af}.st.accepted,.st.received,.st.paid{background:#dcfce7;color:#166534}.st.rejected{background:#fee2e2;color:#991b1b}.st.partial{background:#fef3c7;color:#92400e}
table{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:5px 4px;text-align:right}th{color:#475569;font-size:12px}
input,textarea,select{width:100%;font:600 14px Cairo,Tahoma,sans-serif;border:1px solid #cbd5e1;border-radius:10px;padding:8px}td input{padding:5px;width:110px}
label.f{display:block;font-weight:800;font-size:13px;margin:8px 0 3px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;padding:11px;background:#1e3a8a;color:#fff;font:800 15px Cairo,Tahoma,sans-serif;cursor:pointer}.btn.s{display:inline-block;width:auto;padding:6px 14px;font-size:13px;margin:6px 0 0}.btn:disabled{opacity:.6}
.ok{background:#dcfce7;color:#166534;border-radius:10px;padding:8px;font-weight:800;text-align:center}.empty{color:#64748b;text-align:center;padding:16px}
.foot{margin-top:14px;text-align:center;color:#94a3b8;font-size:11.5px}.tot{font-weight:900;text-align:left}
@media(max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
</style>

<script>
(function(){
'use strict';
const CTRL={url:'https://hjumfnwabrtexyenshkg.supabase.co',key:'sb_publishable_g8_N3wEdQ7_fM9VKGan2iw_7xfcrByg'};
let CFG=CTRL;const CO=(new URLSearchParams(location.search).get('c')||'').trim().toLowerCase();
async function tenantCfg(){if(!CO)return true;try{const r=await fetch(CTRL.url+'/rest/v1/rpc/saas_tenant',{method:'POST',headers:{apikey:CTRL.key,Authorization:'Bearer '+CTRL.key,'Content-Type':'application/json'},body:JSON.stringify({p_code:CO})});const t=await r.json();
 if(!r.ok||!t||t.status==='unknown'||!t.url)return false;CFG={url:t.url,key:t.key};try{if(t.name)document.title='RakizoraFM | '+t.name}catch(e){}return true}catch(e){return false}}
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(new URLSearchParams(location.search).get('k')||'').trim().toLowerCase();
const ERR={'invalid link':'الرابط غير صحيح أو تم إيقافه. اطلب رابطاً جديداً من الشركة.','not open':'طلب عرض السعر لم يعد مفتوحاً.','no prices':'أدخل سعراً لصنف واحد على الأقل.','invalid price':'سعر غير صحيح.','photo too large':'الملف كبير جداً. أرسل صورة أو PDF أصغر.','invalid photo':'نوع الملف غير مدعوم (صورة أو PDF).','too many':'تم إرسال فواتير كثيرة اليوم. حاول غداً.','invoice no required':'اكتب رقم الفاتورة.','invalid amount':'اكتب مبلغ الفاتورة.','photo required':'أرفق صورة الفاتورة أو ملف PDF.','unknown po':'طلب الشراء غير موجود.','duplicate invoice':'رقم الفاتورة هذا مُرسل من قبل.'};
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const x=await r.json().catch(()=>null);if(!r.ok){const m=(x&&x.message)||('HTTP '+r.status);throw Error(ERR[m]||m)}return x}
const date=v=>{try{return v?new Date(v).toLocaleDateString('ar-SA-u-ca-gregory',{timeZone:'Asia/Riyadh',year:'numeric',month:'short',day:'numeric'}):''}catch(e){return ''}};
const n=v=>{try{return (+v||0).toLocaleString('ar-SA-u-nu-latn',{maximumFractionDigits:2})}catch(e){return String(v)}};
const PST={approved:'معتمد — بانتظار التوريد',partial:'استُلم جزئياً',received:'استُلم'},IST={new:'قيد المراجعة',accepted:'مقبولة',rejected:'مرفوضة',paid:'مدفوعة'};
function fail(t){app.innerHTML='<div class="brand">RakizoraFM · إدارة المرافق</div><h1>بوابة المورد</h1><p class="msg">'+esc(t)+'</p>'}
/* a photo → JPEG ≤ 1600 px under the limit; a PDF is sent as it is when small enough */
function readFile(file,limit){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(Error('read'));
 if(file.type==='application/pdf'){r.onload=()=>r.result.length<=limit?res(r.result):rej(Error(ERR['photo too large']));r.readAsDataURL(file);return}
 r.onload=()=>{const im=new Image();im.onerror=()=>rej(Error(ERR['invalid photo']));im.onload=()=>{let w=im.width,h=im.height,m=1600;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
  const c=document.createElement('canvas');let q=.75,out='';for(let i=0;i<7;i++){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);out=c.toDataURL('image/jpeg',q);if(out.length<=limit)break;q-=.1;w=Math.round(w*.85);h=Math.round(h*.85)}
  out.length<=limit?res(out):rej(Error(ERR['photo too large']))};im.src=r.result};r.readAsDataURL(file)})}
let I=null,tab=null,msg='',invPo='';
async function load(){I=await rpc('fm_supplier_portal',{p_token:token})}
async function start(){if(!(await tenantCfg()))return fail('رمز الشركة في الرابط غير صحيح أو تعذّر الاتصال.');if(!/^[0-9a-f]{64}$/.test(token))return fail('الرابط غير صحيح.');
 try{await load()}catch(e){return fail(e.message==='HTTP 400'||/الرابط/.test(e.message)?ERR['invalid link']:'تعذّر الاتصال. تحقق من الإنترنت ثم أعد فتح الرابط.')}
 if(!I||I.state!=='ok')return fail(ERR['invalid link']);draw()}
function draw(){const R=I.rfqs||[],P=I.pos||[],V=I.invoices||[],F=I.fas||[];const waiting=R.filter(r=>!r.quote).length;if(!tab)tab=R.length?'rfq':'po';
 app.innerHTML=`<div class="brand">RakizoraFM · إدارة المرافق</div><h1>🏢 ${esc(I.supplier)}</h1><div class="sub">بوابة المورد — عروض الأسعار وطلبات الشراء والفواتير</div>
 <div class="kp"><div><b>${R.length}</b><span>طلبات عروض مفتوحة</span></div><div><b>${P.filter(p=>p.status!=='received').length}</b><span>طلبات شراء قيد التوريد</span></div><div><b>${V.filter(v=>v.status==='new'||v.status==='accepted').length}</b><span>فواتير لم تُدفع</span></div><div><b>${F.length}</b><span>اتفاقيات سارية</span></div></div>
 <div class="tabs">${[['rfq','📨 طلبات عروض الأسعار'+(waiting?`<span class="bdg">${waiting}</span>`:'')],['po','📦 طلبات الشراء'],['inv','🧾 فواتيري'],['fa','📑 الاتفاقيات']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div>
 ${msg?`<div class="ok">${esc(msg)}</div>`:''}<div id="pane"></div><div class="foot">هذا الرابط خاص بشركتكم — لا تشاركه.</div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';draw()});const p=app.querySelector('#pane');
 if(tab==='rfq')return drawRfq(p,R);if(tab==='po')return drawPo(p,P);if(tab==='inv')return drawInv(p,V,P);
 p.innerHTML=F.length?F.map(f=>`<div class="it"><div class="r1"><b>${esc(f.code)} — ${esc(f.title)}</b><span class="st accepted">سارية</span></div><small>${esc(date(f.start))} ← ${esc(date(f.end))}${+f.cap?` · المستخدم ${n(f.used)} من ${n(f.cap)} ر.س`:` · المستخدم ${n(f.used)} ر.س`}</small></div>`).join(''):'<div class="empty">لا توجد اتفاقيات سارية.</div>'}
function drawRfq(p,R){p.innerHTML=R.length?R.map((r,i)=>`<div class="it" data-i="${i}"><div class="r1"><b>${esc(r.code)}</b><span class="st ${r.quote?'accepted':'new'}">${r.quote?'أرسلتم عرضاً — يمكن تعديله':'بانتظار عرضكم'}</span></div>
  <small>${esc(date(r.at))}${r.due?' · آخر موعد '+esc(date(r.due)):''}${r.note?' · '+esc(r.note):''}</small>
  <table><thead><tr><th>الصنف</th><th>الكمية</th><th>سعر الوحدة (ر.س)</th><th>القيمة</th></tr></thead><tbody>${(r.lines||[]).map(l=>{const q=(r.quote?.prices||[]).find(x=>x.material_id===l.material_id);return `<tr><td>${esc(l.name||'صنف')}${l.specs?`<br><small>${esc(l.specs)}</small>`:''}</td><td>${n(l.qty)} ${esc(l.unit||'')}</td><td><input type="number" min="0" step="0.01" data-m="${esc(l.material_id)}" data-q="${l.qty}" value="${q&&q.price!=null?esc(q.price):''}"></td><td data-v>—</td></tr>`}).join('')}</tbody></table>
  <div class="tot">الإجمالي: <span data-t>0</span> ر.س</div>
  <div class="g2"><div><label class="f">مدة التوريد (يوم)</label><input type="number" min="0" data-dd value="${esc(r.quote?.delivery_days??'')}"></div><div><label class="f">العرض ساري حتى</label><input type="date" data-vu value="${esc(r.quote?.valid_until||'')}"></div></div>
  <label class="f">ملاحظات</label><input data-nt value="${esc(r.quote?.note||'')}"><label class="f">مرفق العرض (صورة أو PDF، اختياري)</label><input type="file" accept="image/*,application/pdf" data-ph>
  <button class="btn" data-go>${r.quote?'💾 تحديث العرض':'📨 إرسال العرض'}</button></div>`).join(''):'<div class="empty">لا توجد طلبات عروض أسعار مفتوحة الآن.</div>';
 p.querySelectorAll('.it').forEach(box=>{const r=R[+box.dataset.i];const calc=()=>{let t=0;box.querySelectorAll('[data-m]').forEach(inp=>{const v=inp.value===''?null:(+inp.value)*(+inp.dataset.q);inp.closest('tr').querySelector('[data-v]').textContent=v==null?'—':n(v);t+=v||0});box.querySelector('[data-t]').textContent=n(t)};
  box.querySelectorAll('[data-m]').forEach(i=>i.oninput=calc);calc();
  box.querySelector('[data-go]').onclick=async e=>{const b=e.target;b.disabled=true;try{let ph=null;const f=box.querySelector('[data-ph]').files[0];if(f)ph=await readFile(f,420000);
   const prices=[...box.querySelectorAll('[data-m]')].map(i=>({material_id:i.dataset.m,price:i.value===''?null:+i.value}));
   const t=await rpc('fm_supplier_quote',{p_token:token,p_rfq:r.id,p:{prices,delivery_days:box.querySelector('[data-dd]').value||null,valid_until:box.querySelector('[data-vu]').value||null,note:box.querySelector('[data-nt]').value,photo:ph}});
   msg='✅ وصل عرضكم على '+r.code+' — الإجمالي '+n(t)+' ر.س';await load();draw()}catch(err){alert(err.message);b.disabled=false}}})}
function drawPo(p,P){p.innerHTML=P.length?P.map(o=>`<div class="it"><div class="r1"><b>${esc(o.code)}</b><span class="st ${esc(o.status)}">${esc(PST[o.status]||o.status)}</span></div><small>${esc(date(o.at))} · الإجمالي ${n(o.total)} ر.س${(o.inv||[]).length?' · فواتير: '+o.inv.map(x=>esc(x.code)+' ('+esc(IST[x.status]||x.status)+')').join('، '):''}</small>
  <table><thead><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>المستلم</th></tr></thead><tbody>${(o.lines||[]).map(l=>`<tr><td>${esc(l.name||'صنف')}</td><td>${n(l.qty)} ${esc(l.unit||'')}</td><td>${n(l.price)}</td><td>${n(l.recv)}</td></tr>`).join('')}</tbody></table>
  <button class="btn s" data-inv="${esc(o.id)}">🧾 رفع فاتورة لهذا الطلب</button></div>`).join(''):'<div class="empty">لا توجد طلبات شراء معتمدة لكم.</div>';
 p.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{invPo=b.dataset.inv;tab='inv';msg='';draw()})}
function drawInv(p,V,P){p.innerHTML=`<div class="it"><b>➕ فاتورة جديدة</b>
  <label class="f">طلب الشراء</label><select data-po><option value="">— بدون —</option>${P.map(o=>`<option value="${esc(o.id)}" ${o.id===invPo?'selected':''}>${esc(o.code)} · ${n(o.total)} ر.س</option>`).join('')}</select>
  <div class="g2"><div><label class="f">رقم الفاتورة</label><input data-no></div><div><label class="f">تاريخ الفاتورة</label><input type="date" data-dt></div><div><label class="f">المبلغ شامل الضريبة (ر.س)</label><input type="number" min="0" step="0.01" data-am></div><div><label class="f">الضريبة (اختياري)</label><input type="number" min="0" step="0.01" data-vat></div></div>
  <label class="f">صورة الفاتورة أو PDF</label><input type="file" accept="image/*,application/pdf" data-ph><label class="f">ملاحظة</label><input data-nt>
  <button class="btn" data-go>📤 إرسال الفاتورة</button></div>
  ${V.length?V.map(v=>`<div class="it"><div class="r1"><b>${esc(v.code)} · فاتورة ${esc(v.no)}</b><span class="st ${esc(v.status)}">${esc(IST[v.status]||v.status)}</span></div><small>${esc(date(v.at))} · ${n(v.amount)} ر.س${v.po?' · '+esc(v.po):''}${v.pay_ref?' · مرجع الدفع '+esc(v.pay_ref):''}</small>${v.response?`<div><small>💬 ${esc(v.response)}</small></div>`:''}</div>`).join(''):'<div class="empty">لم ترسلوا فواتير بعد.</div>'}`;
 p.querySelector('[data-go]').onclick=async e=>{const b=e.target;b.disabled=true;try{const f=p.querySelector('[data-ph]').files[0];if(!f)throw Error(ERR['photo required']);const ph=await readFile(f,560000);
  const r=await rpc('fm_supplier_invoice',{p_token:token,p:{po_id:p.querySelector('[data-po]').value||null,invoice_no:p.querySelector('[data-no]').value,invoice_date:p.querySelector('[data-dt]').value||null,amount:p.querySelector('[data-am]').value,vat:p.querySelector('[data-vat]').value||null,photo:ph,note:p.querySelector('[data-nt]').value}});
  msg='✅ وصلت الفاتورة '+(r&&r.code||'')+' — ستراجعها الشركة';invPo='';await load();draw()}catch(err){alert(err.message);b.disabled=false}}}
window.__fmSU={draw:()=>draw(),get I(){return I}};
start();
})();
</script>
