<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* CO1 (V377) — contractor portal: a private link per contract, no account */
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:#0f172a}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#7c2d12 60%,#c2410c);display:flex;align-items:flex-start;justify-content:center;padding:14px}
.box{width:min(760px,100%);background:#fff;border-radius:22px;padding:18px 16px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.brand{text-align:center;color:#64748b;font-weight:800;font-size:13px}h1{margin:2px 0;text-align:center;font-size:22px}.sub{text-align:center;color:#475569;font-size:13px;margin-bottom:10px}
.msg{text-align:center;color:#991b1b;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.kp div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:8px;text-align:center}.kp b{display:block;font-size:18px}.kp span{font-size:11.5px;color:#64748b}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{flex:0 0 auto;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 12px;font:800 13px Cairo,Tahoma,sans-serif;cursor:pointer}.tabs button.on{background:#7c2d12;color:#fff;border-color:#7c2d12}
.it{border:1px solid #e2e8f0;border-radius:14px;padding:10px;margin-bottom:10px}.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}small{color:#64748b}
.st{border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569}.st.submitted,.st.reviewed,.st.open{background:#fef3c7;color:#92400e}.st.approved,.st.answered{background:#dbeafe;color:#1e40af}.st.paid,.st.accepted{background:#dcfce7;color:#166534}.st.returned,.st.rejected{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;margin:6px 0;font-size:13px}th,td{border-bottom:1px solid #e2e8f0;padding:5px 4px;text-align:right}th{color:#475569;font-size:12px}
textarea{width:100%;font:600 14px Cairo,Tahoma,sans-serif;border:1px solid #cbd5e1;border-radius:10px;padding:8px}
.btn{display:inline-block;margin-top:6px;border:0;border-radius:10px;padding:6px 12px;background:#7c2d12;color:#fff;font:800 13px Cairo,Tahoma,sans-serif;cursor:pointer}.btn.l{background:#fff;color:#7c2d12;border:1px solid #fdba74}
.ok{background:#dcfce7;color:#166534;border-radius:10px;padding:8px;font-weight:800;text-align:center}.empty{color:#64748b;text-align:center;padding:16px}.neg{color:#b91c1c;font-weight:800}
.foot{margin-top:14px;text-align:center;color:#94a3b8;font-size:11.5px}
@media(max-width:560px){.kp{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="box" id="app"><div class="sub">جارٍ التحميل…</div></main>
<script>
(function(){
'use strict';
const CTRL={url:'https://hjumfnwabrtexyenshkg.supabase.co',key:'sb_publishable_g8_N3wEdQ7_fM9VKGan2iw_7xfcrByg'};
let CFG=CTRL;const CO=(new URLSearchParams(location.search).get('c')||'').trim().toLowerCase();
async function tenantCfg(){if(!CO)return true;try{const r=await fetch(CTRL.url+'/rest/v1/rpc/saas_tenant',{method:'POST',headers:{apikey:CTRL.key,Authorization:'Bearer '+CTRL.key,'Content-Type':'application/json'},body:JSON.stringify({p_code:CO})});const t=await r.json();
 if(!r.ok||!t||t.status==='unknown'||!t.url)return false;CFG={url:t.url,key:t.key};try{if(t.name)document.title='RakizoraFM | '+t.name}catch(e){}return true}catch(e){return false}}
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(new URLSearchParams(location.search).get('k')||'').trim().toLowerCase();
const ERR={'invalid link':'الرابط غير صحيح أو تم إيقافه. اطلب رابطاً جديداً من الشركة.','too many today':'وصلت الحد اليومي للاعتراضات.','text required':'اكتب سبب الاعتراض (5 أحرف على الأقل).','bill not found':'المستخلص غير متاح.'};
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const x=await r.json().catch(()=>null);if(!r.ok){const m=(x&&x.message)||('HTTP '+r.status);throw Error(ERR[m]||m)}return x}
const date=v=>{try{return v?new Date(v).toLocaleDateString('ar-SA-u-ca-gregory',{timeZone:'Asia/Riyadh',year:'numeric',month:'short',day:'numeric'}):''}catch(e){return ''}};
const n=v=>{try{return (+v||0).toLocaleString('ar-SA-u-nu-latn',{maximumFractionDigits:2})}catch(e){return String(v)}};
const BST={submitted:'مقدَّم — قيد المراجعة',reviewed:'روجع — بانتظار الاعتماد',approved:'معتمد — بانتظار الصرف',paid:'مصروف',returned:'أُعيد للتعديل'},OST={open:'قيد الدراسة',accepted:'مقبول',rejected:'مرفوض',answered:'تم الرد'},KL={ded:'خصم',kpi:'خصم أداء',pen:'غرامة'};
function fail(t){app.innerHTML='<div class="brand">RakizoraFM · إدارة المرافق</div><h1>بوابة المقاول</h1><p class="msg">'+esc(t)+'</p>'}
let I=null,tab='b',msg='';
async function load(){I=await rpc('fm_contractor_portal',{p_token:token})}
function render(){const c=I.contract||{},B=I.bills||[],O=I.objections||[];const sum=k=>B.reduce((a,b)=>a+ +(b[k]||0),0);
 app.innerHTML=`<div class="brand">${esc(I.company||'RakizoraFM')} · إدارة المرافق</div><h1>بوابة المقاول</h1><div class="sub">${esc(c.contractor)} • ${esc(c.code)} ${esc(c.name)}</div>
  <div class="kp"><div><b>${B.length}</b><span>مستخلص</span></div><div><b>${n(sum('total'))}</b><span>إجمالي المستحق (ر.س)</span></div><div><b class="neg">${n(sum('deductions'))}</b><span>الخصومات والغرامات</span></div><div><b>${c.held!=null?n(c.held):'—'}</b><span>المحتجز لديكم حالياً</span></div></div>
  ${msg?`<div class="ok">${esc(msg)}</div>`:''}
  <div class="tabs"><button data-t="b" class="${tab==='b'?'on':''}">🧾 المستخلصات</button><button data-t="o" class="${tab==='o'?'on':''}">📝 اعتراضاتي (${O.length})</button></div><div data-v></div>
  <div class="foot">هذا الرابط خاص بعقدكم — لا تشاركه. للاستفسار تواصل مع الشركة.</div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;msg='';render()});const v=app.querySelector('[data-v]');
 if(tab==='o'){v.innerHTML=O.map(o=>`<div class="it"><div class="r1"><b>${esc(o.code)} — ${esc(o.bill||'')}</b><span class="st ${esc(o.status)}">${OST[o.status]||esc(o.status)}</span></div>${o.line?`<small>${esc(o.line)}${o.amount!=null?' • '+n(o.amount)+' ر.س':''}</small>`:''}<div>${esc(o.text)}</div>${o.response?`<div style="margin-top:6px;background:#f8fafc;border-radius:8px;padding:6px"><b>رد الشركة:</b> ${esc(o.response)}</div>`:''}<small>${date(o.at)}</small></div>`).join('')||'<div class="empty">لا توجد اعتراضات.</div>';return}
 v.innerHTML=B.map(b=>`<div class="it"><div class="r1"><b>${esc(b.code)} — ${esc(b.month)}</b><span class="st ${esc(b.status)}">${BST[b.status]||esc(b.status)}</span></div>
  <table><tr><td>إجمالي الأعمال</td><td>${n(b.gross)}</td></tr><tr><td>الخصومات والغرامات</td><td class="neg">${n(b.deductions)}</td></tr><tr><td>الصافي</td><td>${n(b.net)}</td></tr><tr><td>الضريبة</td><td>${n(b.vat)}</td></tr><tr><td>المحتجزات</td><td>${n(b.retention)}</td></tr><tr><td><b>المستحق</b></td><td><b>${n(b.total)}</b></td></tr></table>
  ${b.paid_at?`<small>صُرف في ${date(b.paid_at)}</small>`:''}
  ${(b.lines||[]).length?`<div style="margin-top:6px"><b>الخصومات والغرامات</b><table>${b.lines.map(l=>`<tr><td>${KL[l.k]||''}: ${esc(l.t||'')}</td><td class="neg">${n(l.a)}</td><td><button class="btn l" data-ob="${esc(b.id)}" data-i="${l.i}" data-t="${esc(l.t||'')}">📝 اعتراض</button></td></tr>`).join('')}</table></div>`:''}
  <button class="btn l" data-ob="${esc(b.id)}" data-i="" data-t="">📝 اعتراض عام على المستخلص</button><div data-f="${esc(b.id)}"></div></div>`).join('')||'<div class="empty">لا توجد مستخلصات مقدَّمة بعد.</div>';
 v.querySelectorAll('[data-ob]').forEach(x=>x.onclick=()=>{const f=v.querySelector(`[data-f="${x.dataset.ob}"]`);f.innerHTML=`<div style="margin-top:8px"><small>${x.dataset.t?'على: '+esc(x.dataset.t):'اعتراض عام'}</small><textarea rows="3" data-tx placeholder="سبب الاعتراض والمستندات المتوفرة لديكم"></textarea><button class="btn" data-snd>📤 إرسال الاعتراض</button></div>`;
  f.querySelector('[data-snd]').onclick=async e=>{e.currentTarget.disabled=true;try{const r=await rpc('fm_contractor_objection',{p_token:token,p:{bill_id:x.dataset.ob,line:x.dataset.i===''?null:+x.dataset.i,text:f.querySelector('[data-tx]').value}});msg='✅ أُرسل الاعتراض '+r.code+' — سيصلكم الرد هنا';await load();tab='o';render()}catch(er){alert(er.message);e.currentTarget.disabled=false}}})}
(async()=>{if(!/^[0-9a-f]{64}$/.test(token))return fail('الرابط غير صحيح.');if(!await tenantCfg())return fail('الشركة غير معروفة.');try{await load();render()}catch(e){fail(e.message)}})();
})();
</script>
</body>
</html>
