<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="fm-version" content="SA2">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f172a">
<title>RakizoraFM | لوحة مالك المنصة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* SA1 (V179) — platform owner console: companies (one Supabase project each), plans, invoices, activation codes */
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--bad:#b91c1c;--ok:#15803d;--warn:#c2410c;--bg:#f1f5f9}
*{box-sizing:border-box}
html,body{margin:0;font-family:Cairo,Tahoma,sans-serif;color:var(--ink);background:var(--bg)}
.top{background:#0f172a;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:18px;flex:1}.top small{color:#94a3b8;font-weight:700}
.top button{border:0;border-radius:10px;padding:7px 12px;font:800 13px Cairo,Tahoma,sans-serif;background:#1e293b;color:#e2e8f0;cursor:pointer}
main{max-width:1250px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 16px;font:800 13.5px Cairo,Tahoma,sans-serif;cursor:pointer;color:#334155}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi span{display:block;color:#475569;font-weight:800;font-size:12.5px}.kpi b{font-size:24px}.kpi small{display:block;color:var(--mut);font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:16px}
.tw{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #edf1f6;padding:8px 10px;text-align:right;white-space:nowrap}th{background:#f8fafc;font-weight:800;color:#334155}td.wrap{white-space:normal}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:800}
.tag.trial{background:#e0e7ff;color:#3730a3}.tag.active{background:#dcfce7;color:#166534}.tag.suspended{background:#fee2e2;color:#b91c1c}.tag.unpaid{background:#fef3c7;color:#92400e}.tag.paid{background:#dcfce7;color:#166534}.tag.cancelled{background:#f1f5f9;color:#64748b}
.b{border:1px solid #cbd5e1;background:#fff;border-radius:9px;padding:5px 11px;font:800 12px Cairo,Tahoma,sans-serif;cursor:pointer;color:#1d4ed8;margin:1px}
.b.p{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dialog{border:0;border-radius:16px;padding:0;width:min(720px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(15,23,42,.35);font-family:Cairo,Tahoma,sans-serif;direction:rtl}
dialog::backdrop{background:rgba(15,23,42,.45)}
.in{padding:16px 18px;display:grid;gap:10px}.in h3{margin:0}
label.f{display:grid;gap:4px;font-weight:800;font-size:12.5px;color:#334155}
input,select,textarea{font:600 13.5px Cairo,Tahoma,sans-serif;border:1px solid #cbd5e1;border-radius:10px;padding:8px 10px;width:100%;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ft{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#f8fafc;border-radius:0 0 16px 16px;position:sticky;bottom:0}
.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:8px 12px;font-weight:700;font-size:12.5px;line-height:1.9}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 12px;font-weight:700;font-size:12.5px}
.code{direction:ltr;text-align:left;font:600 12px ui-monospace,Consolas,monospace;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;word-break:break-all;white-space:pre-wrap}
.login{max-width:400px;margin:60px auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 20px 50px rgba(15,23,42,.15);display:grid;gap:10px}
.login h2{margin:0;text-align:center}.err{color:var(--bad);font-weight:800;font-size:13px}
.logo{width:34px;height:34px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);vertical-align:middle}
@media(max-width:700px){.two,.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
/* The control project = the owner's Supabase project (saas_control.sql). Publishable key only. */
const CTRL={url:'https://hjumfnwabrtexyenshkg.supabase.co',key:'sb_publishable_g8_N3wEdQ7_fM9VKGan2iw_7xfcrByg'};
const LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
const S=v=>String(v??'').trim(),esc=v=>S(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),app=$('#app');
const GREG='ar-SA-u-ca-gregory';
const num=(v,d)=>(+v||0).toLocaleString('en-US',{maximumFractionDigits:d??2});
const money=v=>num(v)+' ر.س';
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const addMonths=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCMonth(x.getUTCMonth()+n);x.setUTCDate(x.getUTCDate()-1);return x.toISOString().slice(0,10)};
const daysLeft=d=>d?Math.round((Date.parse(d+'T00:00:00Z')-Date.parse(today()+'T00:00:00Z'))/864e5):null;
const dshow=d=>d?new Date(String(d).slice(0,10)+'T12:00:00Z').toLocaleDateString(GREG,{year:'numeric',month:'short',day:'numeric'}):'—';
const siteBase=()=>{const u=new URL('start.html',location.href);u.search='';u.hash='';return u.href};
const STL={trial:'تجريبي',active:'نشط',suspended:'موقوف'},IST={unpaid:'غير مدفوعة',paid:'مدفوعة',cancelled:'ملغاة'};
let libP=null,client=null;
function ensureLib(){if(window.supabase&&window.supabase.createClient)return Promise.resolve();if(libP)return libP;
 libP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIB;s.onload=()=>res();s.onerror=()=>{libP=null;rej(Error('Failed to fetch'))};document.head.appendChild(s)});return libP}
async function sb(){if(client)return client;await ensureLib();client=window.supabase.createClient(CTRL.url,CTRL.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'fm-saas-auth'}});return client}
const chk=({data,error})=>{if(error)throw Error(error.message||String(error));return data};
/* all network calls go through API so tests can replace it */
const API=window.FMSaasAPI=window.FMSaasAPI||{
 async session(){const c=await sb();return (await c.auth.getSession()).data?.session||null},
 async signIn(e,p){const c=await sb();return chk(await c.auth.signInWithPassword({email:e,password:p}))},
 async signOut(){const c=await sb();await c.auth.signOut()},
 async isOwner(){const c=await sb();return !!chk(await c.rpc('saas_is_owner'))},
 async tenants(){const c=await sb();return chk(await c.from('saas_tenants').select('*').order('created_at'))},
 async saveTenant(t,isNew){const c=await sb();return isNew?chk(await c.from('saas_tenants').insert(t).select()):chk(await c.from('saas_tenants').update(t).eq('code',t.code).select())},
 async settings(){const c=await sb();return Object.fromEntries((chk(await c.from('saas_settings').select('key,value'))||[]).map(x=>[x.key,x.value]))},
 async saveSetting(k,v){const c=await sb();return chk(await c.from('saas_settings').upsert([{key:k,value:v,updated_at:new Date().toISOString()}],{onConflict:'key'}))},
 async invoices(){const c=await sb();return chk(await c.from('saas_invoices').select('*').order('created_at',{ascending:false}).limit(1000))},
 async addInvoice(o){const c=await sb();return chk(await c.from('saas_invoices').insert(o).select())[0]},
 async updInvoice(id,o){const c=await sb();return chk(await c.from('saas_invoices').update(o).eq('id',id).select())[0]}
};
const ERR=m=>/Invalid login/i.test(m)?'البريد أو كلمة المرور غير صحيحة':/duplicate key/i.test(m)?'رمز الشركة مستخدم من قبل':/saas_tenants_url_check/.test(m)?'رابط المشروع يجب أن يكون https://xxxx.supabase.co':/anon_key_check/.test(m)?'المفتاح غير صالح — استخدم المفتاح العام (anon / publishable) فقط':/code_check/.test(m)?'رمز الشركة: أحرف إنجليزية صغيرة وأرقام و- (2–30)':/logo_check/.test(m)?'الشعار كبير — اختر صورة أصغر':/does not exist|schema cache/i.test(m)?'شغّل saas_control.sql في مشروع التحكم أولاً':/Failed to fetch/i.test(m)?'تعذر الاتصال':m;
const toast=(m,bad)=>{const t=document.createElement('div');t.textContent=m;t.style.cssText=`position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:${bad?'#b91c1c':'#0f172a'};color:#fff;padding:10px 18px;border-radius:12px;font:800 13.5px Cairo,Tahoma,sans-serif;z-index:99`;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)};
/* activation code = base64url(JSON {c,p,l,u,n,m?}) + '.' + hex HMAC-SHA256(that text, tenant secret) — verified by fm_plan_activate */
async function signCode(t,plan,limit,until,nonce,mods){const o={c:t.code,p:plan,l:+limit||0,u:until,n:nonce};if(mods&&typeof mods==='object')o.m=mods;const p=JSON.stringify(o);
 const b=btoa(unescape(encodeURIComponent(p))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(t.secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const sig=new Uint8Array(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(b)));return b+'.'+[...sig].map(x=>x.toString(16).padStart(2,'0')).join('')}
window.fmSaasSign=signCode;
let T=[],INV=[],SET={},TAB='dash';
const plans=()=>Array.isArray(SET.plans)?SET.plans:[];
const planOf=k=>plans().find(p=>p.k===k)||{k,name:k,max:0,price:0};
/* SA2 (V181): the parts of the platform. A plan (باقة) lists its parts; other parts are add-ons priced per month
   (base + per school × the school limit). The company's parts {key: until-date | null} travel in the activation code (m). */
const MODS=[['tickets','🎫 البلاغات والـ SLA'],['wo','🛠️ أوامر العمل'],['wh','📦 المستودعات وقطع الغيار'],['eng','💬 التواصل مع المدارس والرضا'],['portal','🏫 بوابة مدير المدرسة'],['costs','💰 تكاليف المباني']];
const MODN=k=>(MODS.find(m=>m[0]===k)||[k,k])[1];
const planMods=k=>{const p=planOf(k);return Array.isArray(p.modules)?p.modules:MODS.map(m=>m[0])};
const addons=()=>Array.isArray(SET.addons)?SET.addons:[];
const addonOf=k=>addons().find(a=>a.k===k)||{k,base:0,per_school:0};
const addonPrice=(k,limit)=>(+addonOf(k).base||0)+(+addonOf(k).per_school||0)*(+limit||0);
const tMods=t=>t&&t.modules&&typeof t.modules==='object'&&!Array.isArray(t.modules)?t.modules:null;
const modsTxt=m=>m?Object.keys(m).map(k=>MODN(k).replace(/^\S+\s/,'')+(m[k]?` (حتى ${m[k]})`:'')).join('، ')||'—':'كل الأجزاء';
/* the parts picker: parts of the plan are included; others are add-ons (with an optional end date for a trial) */
function modPicker(planKey,cur,limit,trial){const inc=planMods(planKey);return `<table><thead><tr><th>الجزء</th><th>الحالة</th>${trial?'<th>حتى (تجربة)</th>':'<th>سعر الإضافة / شهر</th>'}</tr></thead><tbody>${MODS.map(([k,n])=>{const i=inc.includes(k),on=i||(cur&&k in cur);
  return `<tr><td><label><input type="checkbox" data-mod="${k}" ${on?'checked':''} ${i?'disabled':''}> ${esc(n)}</label></td><td>${i?'<span class="tag active">ضمن الباقة</span>':'إضافة'}</td>${trial?`<td><input type="date" data-mu="${k}" value="${esc(cur&&cur[k]||'')}"></td>`:`<td>${i?'—':money(addonPrice(k,limit))}</td>`}</tr>`}).join('')}</tbody></table>`}
function readPicker(d,planKey){const m={};planMods(planKey).forEach(k=>m[k]=null);d.querySelectorAll('[data-mod]:not(:disabled)').forEach(c=>{if(c.checked){const u=d.querySelector(`[data-mu="${c.dataset.mod}"]`);m[c.dataset.mod]=u&&u.value?u.value:null}});
 d.querySelectorAll('[data-mod]:disabled').forEach(c=>{const u=d.querySelector(`[data-mu="${c.dataset.mod}"]`);if(u&&u.value)m[c.dataset.mod]=u.value});return m}
const seller=()=>Object.assign({name:'RakizoraFM',vat_no:'',address:'',iban:'',vat_pct:15},SET.seller||{});

/* ---------- sign in ---------- */
function login(err){app.innerHTML=`<div class="login"><h2>🔐 لوحة مالك المنصة</h2><div style="text-align:center;color:var(--mut);font-weight:700;font-size:13px">RakizoraFM SaaS — الشركات والاشتراكات والفواتير</div>
 <label class="f">البريد<input id="e" type="email" dir="ltr" autocomplete="username"></label><label class="f">كلمة المرور<input id="p" type="password" dir="ltr" autocomplete="current-password"></label>
 ${err?`<div class="err">${esc(err)}</div>`:''}<button class="b p" id="go" style="padding:10px">دخول</button></div>`;
 $('#go').onclick=async()=>{try{await API.signIn(S($('#e').value),$('#p').value);boot()}catch(e){login(ERR(e.message))}};
 $('#p').onkeydown=e=>{if(e.key==='Enter')$('#go').click()}}
async function boot(){app.innerHTML='<div class="login">جارٍ التحميل…</div>';
 try{if(!await API.session())return login();if(!await API.isOwner()){app.innerHTML=`<div class="login"><h2>غير مصرح</h2><div class="err">هذا الحساب ليس من مالكي المنصة. أضفه في saas_owners من محرر SQL.</div><button class="b" id="out">خروج</button></div>`;$('#out').onclick=async()=>{await API.signOut();login()};return}
  await reload();render()}catch(e){app.innerHTML=`<div class="login"><div class="err">${esc(ERR(e.message))}</div><button class="b" id="out">خروج</button></div>`;$('#out').onclick=async()=>{try{await API.signOut()}catch(_){}login()}}}
async function reload(){[T,INV,SET]=await Promise.all([API.tenants(),API.invoices(),API.settings()])}

/* ---------- main ---------- */
function render(){app.innerHTML=`<div class="top"><h1>🏢 لوحة مالك المنصة <small>RakizoraFM SaaS</small></h1><button id="rl">🔄</button><button id="out">خروج</button></div><main>
 <div class="tabs">${[['dash','📊 نظرة عامة'],['co','🏢 الشركات'],['inv','🧾 الفواتير'],['set','⚙️ الباقات والبائع']].map(([k,l])=>`<button data-t="${k}" class="${TAB===k?'on':''}">${l}</button>`).join('')}</div><div id="pane"></div></main>`;
 $('#rl').onclick=async()=>{await reload();render()};$('#out').onclick=async()=>{await API.signOut();login()};
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render()});
 ({dash,co:companies,inv:invoices,set:settingsTab})[TAB]($('#pane'))}
function dash(p){const act=T.filter(t=>t.status==='active'),tr=T.filter(t=>t.status==='trial'),exp=T.filter(t=>t.status!=='suspended'&&daysLeft(t.active_until)!=null&&daysLeft(t.active_until)<=30).sort((a,b)=>daysLeft(a.active_until)-daysLeft(b.active_until));
 const mrr=act.reduce((s,t)=>{const m=tMods(t),inc=planMods(t.plan);return s+(+planOf(t.plan).price||0)+(m?Object.keys(m).filter(k=>!inc.includes(k)&&!m[k]).reduce((a,k)=>a+addonPrice(k,t.schools_limit),0):0)},0),unpaid=INV.filter(i=>i.status==='unpaid'),y=new Date().getFullYear(),paidY=INV.filter(i=>i.status==='paid'&&String(i.paid_at||'').startsWith(String(y)));
 p.innerHTML=`<div class="kpis"><div class="kpi"><span>شركات نشطة</span><b>${act.length}</b><small>${tr.length} تجريبية · ${T.filter(t=>t.status==='suspended').length} موقوفة</small></div>
  <div class="kpi"><span>الإيراد الشهري المتكرر</span><b>${money(mrr)}</b><small>حسب باقات الشركات النشطة</small></div>
  <div class="kpi"><span>فواتير غير مدفوعة</span><b style="color:${unpaid.length?'var(--bad)':'var(--ok)'}">${money(unpaid.reduce((s,i)=>s+ +i.total,0))}</b><small>${unpaid.length} فاتورة</small></div>
  <div class="kpi"><span>المحصّل هذه السنة</span><b>${money(paidY.reduce((s,i)=>s+ +i.total,0))}</b><small>${paidY.length} فاتورة</small></div></div>
 <div class="card"><h3>⏰ اشتراكات تنتهي خلال 30 يوماً</h3>${exp.length?`<div class="tw"><table><thead><tr><th>الشركة</th><th>الباقة</th><th>ينتهي</th><th>المتبقي</th><th></th></tr></thead><tbody>${exp.map(t=>{const d=daysLeft(t.active_until);return `<tr><td><b>${esc(t.name)}</b></td><td>${esc(planOf(t.plan).name)}</td><td>${dshow(t.active_until)}</td><td style="color:${d<0?'var(--bad)':'var(--warn)'};font-weight:800">${d<0?'منتهٍ منذ '+(-d)+' يوم':d+' يوم'}</td><td><button class="b p" data-inv="${esc(t.code)}">🧾 فاتورة تجديد</button></td></tr>`}).join('')}</tbody></table></div>`:'<div style="color:var(--mut);font-weight:700">لا يوجد ✅</div>'}</div>`;
 p.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>invoiceDlg(T.find(t=>t.code===b.dataset.inv)))}
function companies(p){p.innerHTML=`<div class="row" style="margin-bottom:10px"><button class="b p" id="add">➕ شركة جديدة</button></div><div class="card"><div class="tw"><table><thead><tr><th>الشركة</th><th>الرمز</th><th>الباقة</th><th>المدارس</th><th>الحالة</th><th>حتى</th><th>التواصل</th><th></th></tr></thead><tbody>
 ${T.map(t=>{const d=daysLeft(t.active_until);return `<tr><td>${t.logo?`<img class="logo" src="${esc(t.logo)}" alt=""> `:''}<b>${esc(t.name)}</b></td><td dir="ltr">${esc(t.code)}</td><td>${esc(planOf(t.plan).name)}<div style="font-size:11.5px;color:var(--mut)">${esc(modsTxt(tMods(t)))}</div></td><td>${+t.schools_limit?num(t.schools_limit,0):'بلا حد'}</td><td><span class="tag ${esc(t.status)}">${STL[t.status]||t.status}</span></td>
  <td>${dshow(t.active_until)}${d!=null?`<div style="font-size:11.5px;color:${d<0?'var(--bad)':d<=30?'var(--warn)':'var(--mut)'};font-weight:800">${d<0?'منتهٍ':d+' يوم'}</div>`:''}</td><td class="wrap">${esc(t.contact_name||'')}<div style="font-size:11.5px;color:var(--mut)" dir="ltr">${esc(t.contact_phone||'')}</div></td>
  <td><button class="b" data-ed="${esc(t.code)}">✏️ تعديل</button><button class="b" data-pr="${esc(t.code)}">🚀 التجهيز والرابط</button><button class="b" data-inv="${esc(t.code)}">🧾 فاتورة</button><button class="b" data-code="${esc(t.code)}">🔑 كود يدوي</button></td></tr>`}).join('')||'<tr><td colspan="8">لا توجد شركات بعد</td></tr>'}</tbody></table></div></div>`;
 $('#add').onclick=()=>tenantDlg(null);
 p.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>tenantDlg(T.find(t=>t.code===b.dataset.ed)));
 p.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>provision(T.find(t=>t.code===b.dataset.pr)));
 p.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>invoiceDlg(T.find(t=>t.code===b.dataset.inv)));
 p.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>manualCode(T.find(t=>t.code===b.dataset.code)))}
function dlg(html){const d=document.createElement('dialog');d.innerHTML=html;document.body.appendChild(d);d.addEventListener('close',()=>d.remove());d.showModal();d.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>d.close());return d}
/* the key must be public: an sb_publishable_ key or a JWT whose role is anon */
function keyOk(k){k=S(k);if(/^sb_secret_/.test(k))return false;if(/^sb_publishable_/.test(k))return true;try{const r=JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role;return r==='anon'}catch(e){return false}}
function shrinkLogo(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=256,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let o=c.toDataURL('image/png');if(o.length>190000)o=c.toDataURL('image/jpeg',.85);res(o)};im.src=r.result};r.readAsDataURL(file)})}

 <tr><td colspan="3">ضريبة القيمة المضافة ${num(i.vat_pct)}%</td><td>${money(vat)}</td></tr><tr class="tot"><td colspan="3">الإجمالي المستحق</td><td>${money(i.total)}</td></tr></tbody></table>
 ${s.iban?`<div class="box">التحويل البنكي: <b dir="ltr">${esc(s.iban)}</b> — يرجى ذكر رقم الفاتورة في التحويل.</div>`:''}<p class="m">بعد استلام الدفعة يُرسل كود التفعيل لمدير النظام لديكم.</p><script>setTimeout(()=>print(),600)<\/script></body></html>`);w.document.close()}
/* ---------- settings ---------- */
function settingsTab(p){const s=seller();p.innerHTML=`<div class="card"><h3>📦 الباقات (حسب عدد المدارس والأجزاء)</h3><div class="tw"><table><thead><tr><th>الرمز</th><th>الاسم</th><th>حد المدارس (0 = بلا حد)</th><th>السعر الشهري (ر.س قبل الضريبة)</th><th>الأجزاء المشمولة</th><th></th></tr></thead><tbody data-pl>
 ${plans().map((x,i)=>`<tr><td><input data-p="k" data-i="${i}" value="${esc(x.k)}" dir="ltr"></td><td><input data-p="name" data-i="${i}" value="${esc(x.name)}"></td><td><input data-p="max" data-i="${i}" value="${esc(x.max)}"></td><td><input data-p="price" data-i="${i}" value="${esc(x.price)}"></td><td class="wrap">${MODS.map(([k,n])=>`<label style="display:block;white-space:nowrap;font-size:12.5px"><input type="checkbox" data-pm="${k}" data-i="${i}" ${planMods(x.k).includes(k)?'checked':''}> ${esc(n)}</label>`).join('')}</td><td><button class="b" data-rm="${i}" style="color:var(--bad)">حذف</button></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin-top:8px"><button class="b" id="pa">➕ باقة</button><button class="b p" id="ps">💾 حفظ الباقات</button></div></div>
 <div class="card"><h3>➕ الأجزاء الإضافية (لمن لا تشملها باقته)</h3><div class="note">السعر الشهري = مبلغ ثابت + سعر لكل مدرسة × حد مدارس الشركة.</div><div class="tw"><table><thead><tr><th>الجزء</th><th>مبلغ ثابت / شهر</th><th>لكل مدرسة / شهر</th></tr></thead><tbody>
 ${MODS.map(([k,n])=>`<tr><td>${esc(n)}</td><td><input data-ad="base" data-k2="${k}" value="${esc(addonOf(k).base||0)}"></td><td><input data-ad="per_school" data-k2="${k}" value="${esc(addonOf(k).per_school||0)}"></td></tr>`).join('')}</tbody></table></div>
 <div class="row" style="margin-top:8px"><button class="b p" id="as">💾 حفظ أسعار الأجزاء</button></div></div>
 <div class="card"><h3>🏷️ بيانات البائع في الفواتير</h3><div class="two"><label class="f">الاسم<input data-s="name" value="${esc(s.name)}"></label><label class="f">الرقم الضريبي<input data-s="vat_no" dir="ltr" value="${esc(s.vat_no)}"></label></div>
 <div class="two"><label class="f">العنوان<input data-s="address" value="${esc(s.address)}"></label><label class="f">الآيبان<input data-s="iban" dir="ltr" value="${esc(s.iban)}"></label></div><label class="f" style="max-width:220px">نسبة الضريبة %<input data-s="vat_pct" value="${esc(s.vat_pct)}"></label>
 <div class="row" style="margin-top:8px"><button class="b p" id="ss">💾 حفظ</button></div></div>`;
 const L=plans().map(x=>Object.assign({},x,{modules:planMods(x.k)}));
 p.querySelectorAll('[data-pm]').forEach(c=>c.onchange=()=>{const x=L[+c.dataset.i];x.modules=MODS.map(m=>m[0]).filter(k=>p.querySelector(`[data-pm="${k}"][data-i="${c.dataset.i}"]`).checked)});
 $('#as').onclick=async()=>{const A=MODS.map(([k])=>({k,base:+p.querySelector(`[data-ad=base][data-k2="${k}"]`).value||0,per_school:+p.querySelector(`[data-ad=per_school][data-k2="${k}"]`).value||0}));try{await API.saveSetting('addons',A);await reload();toast('تم الحفظ')}catch(e){toast(ERR(e.message),1)}};
 p.querySelectorAll('[data-p]').forEach(i=>i.oninput=()=>{const v=i.dataset.p==='max'||i.dataset.p==='price'?+i.value||0:S(i.value);L[+i.dataset.i][i.dataset.p]=v});
 p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{L.splice(+b.dataset.rm,1);SET.plans=L;settingsTab(p)});
 $('#pa').onclick=()=>{L.push({k:'plan'+(L.length+1),name:'باقة جديدة',max:100,price:0,modules:['tickets']});SET.plans=L;settingsTab(p)};
 $('#ps').onclick=async()=>{if(L.some(x=>!/^[a-z0-9_-]+$/.test(x.k))||new Set(L.map(x=>x.k)).size!==L.length){toast('رموز الباقات: إنجليزية صغيرة وغير مكررة',1);return}try{await API.saveSetting('plans',L);await reload();toast('تم الحفظ')}catch(e){toast(ERR(e.message),1)}};
 $('#ss').onclick=async()=>{const o={};p.querySelectorAll('[data-s]').forEach(i=>o[i.dataset.s]=i.dataset.s==='vat_pct'?+i.value||0:S(i.value));try{await API.saveSetting('seller',o);await reload();toast('تم الحفظ')}catch(e){toast(ERR(e.message),1)}}}
boot();
})();
</script>
