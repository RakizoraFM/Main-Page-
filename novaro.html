<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="fm-version" content="NV1">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>نوفارو — جرد الأصول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
<style id="nv-style">
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#2563eb;--pri-s:#eff6ff;--ok:#15803d;--ok-s:#ecfdf5;--warn:#b45309;--warn-s:#fffbeb;--bad:#b91c1c;--bad-s:#fef2f2;--r:14px;--sh:0 6px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;min-height:100vh}
a{color:var(--pri2);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#1e3a8a,#1d4ed8);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top img{height:34px;width:34px;border-radius:8px;object-fit:cover;background:#fff}
.top .brand{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who{font-size:13px;opacity:.9;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:13px}
.top button:hover{background:rgba(255,255,255,.28)}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
.wide{max-width:1280px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:21px}
.card h3{margin:0 0 12px;font-size:17px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.full{grid-column:1/-1}
label.f{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:4px}
label.f .req{color:var(--bad)}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:11px;background:#fff;outline:none;transition:.15s}
.in:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.in[disabled]{background:#f1f5f9}
.err{color:var(--bad);font-size:12px;margin-top:3px;min-height:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--pri2);color:#fff;transition:.15s;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:#fff;color:#334155;border:2px solid var(--line)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.warn{background:#d97706}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1}
.msg{border-radius:11px;padding:10px 14px;margin-bottom:14px;font-weight:700;font-size:14px}
.msg.ok{background:var(--ok-s);color:var(--ok);border:1px solid #bbf7d0}
.msg.bad{background:var(--bad-s);color:var(--bad);border:1px solid #fecaca}
.msg.info{background:var(--pri-s);color:var(--pri);border:1px solid #bfdbfe}
.msg.warn{background:var(--warn-s);color:var(--warn);border:1px solid #fde68a}
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps span{flex:1;height:6px;border-radius:4px;background:#dbe3ef}
.steps span.on{background:var(--pri2)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{background:#f8fafc;color:#475569;font-weight:800;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
table.t th.s{cursor:pointer}
table.t th.s:hover{color:var(--pri2)}
table.t td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
table.t tr:hover td{background:#f8fbff}
.thumb{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--line);cursor:zoom-in;background:#f1f5f9;display:inline-block;vertical-align:middle}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-s);color:var(--ok)}
.p-warn{background:var(--warn-s);color:var(--warn)}
.p-bad{background:var(--bad-s);color:var(--bad)}
.p-pri{background:var(--pri-s);color:var(--pri)}
.p-mut{background:#f1f5f9;color:#475569}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:26px;font-weight:800}
.kpi span{color:var(--mut);font-size:13px;font-weight:700}
.kpi.c1 b{color:var(--pri2)}.kpi.c2 b{color:var(--ok)}.kpi.c3 b{color:#d97706}.kpi.c4 b{color:#64748b}.kpi.c5 b{color:#7c3aed}
.bars{display:flex;align-items:flex-end;gap:4px;height:180px;padding:8px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.bar{flex:1;min-width:16px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#3b82f6,#1d4ed8);border-radius:5px 5px 0 0;min-height:2px}
.bar small{font-size:10px;color:var(--mut);writing-mode:vertical-rl;transform:rotate(180deg);margin-top:4px;height:42px}
.bar em{font-style:normal;font-size:10px;font-weight:800;color:#334155}
.menu{display:grid;gap:12px}
.menu .btn{padding:16px;font-size:16px}
.choice{display:flex;gap:16px;flex-wrap:wrap}
.choice label{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:700;font-size:14px}
.sr{position:relative}
.sr-list{position:absolute;z-index:20;inset-inline:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);max-height:320px;overflow:auto;margin-top:4px}
.sr-list div{padding:9px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-size:14px}
.sr-list div:hover,.sr-list div.act{background:var(--pri-s)}
.sr-list small{color:var(--mut);display:block;font-size:12px}
.picked{border:2px solid var(--pri2);background:var(--pri-s);border-radius:12px;padding:10px 14px;margin-top:10px}
#map{height:300px;border-radius:12px;border:1px solid var(--line);z-index:1}
.lay{display:flex;min-height:calc(100vh - 54px)}
.side{width:230px;flex:none;background:#0f172a;color:#cbd5e1;padding:12px 8px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
.side a{display:block;color:#cbd5e1;padding:9px 12px;border-radius:10px;font-weight:700;font-size:14px;margin-bottom:2px}
.side a:hover{background:#1e293b;color:#fff}
.side a.on{background:var(--pri2);color:#fff}
.side .g{font-size:11px;color:#64748b;padding:12px 12px 4px;font-weight:800}
.main{flex:1;min-width:0}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.dlg-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 10px}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:300;font-weight:700;box-shadow:var(--sh);max-width:90vw}
.kv{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--mut);font-weight:700}
.kv dd{margin:0;word-break:break-word}
.muted{color:var(--mut)}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;direction:ltr;unicode-bidi:embed}
.hide{display:none!important}
.chk{width:17px;height:17px;cursor:pointer}
@media(max-width:860px){
  .lay{display:block}
  .side{position:static;width:auto;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px;white-space:nowrap}
  .side .g{display:none}
  .side a{display:inline-block;margin:0}
  .row>h2.grow{flex-basis:100%}
  .top .who{display:none}
}
@media print{.top,.side,.no-print{display:none!important}.lay{display:block}.card{box-shadow:none}}
</style>
</head>

<script id="nv-core">
/* Novaro asset collection — single-file app. Data lives on this device (IndexedDB). */
'use strict';
const NV={version:'NV1',date:'2026-10-13'};
const FLOORS=['الأرضي','الأول','الثاني','الثالث','الرابع','الملعب','المقصف'];
const ROOM_NUMBERS=Array.from({length:20},(_,i)=>String(i+1));
const STATUS={Works:'يعمل','Does not work':'لا يعمل'};
const PC={Parent:'أصل رئيسي (Parent)',Child:'أصل فرعي (Child)'};
const TABLES=['schools','employees','categories','types','conditions','rooms','collections','log','settings'];
const PAGE=25;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const now=()=>new Date().toISOString();
const norm=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
const fmtD=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'})};
const fmtDT=iso=>{if(!iso)return '';const d=new Date(iso);return isNaN(d)?'':d.toLocaleString('ar-SA-u-ca-gregory-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})};
const dayKey=iso=>{const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const num=v=>{const n=Number(v);return isFinite(n)?n:0};
const money=v=>v==null||v===''?'':Number(v).toLocaleString('en-US',{maximumFractionDigits:2});
function toast(t,ms=2600){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms)}
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ---------- IndexedDB ---------- */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('novaro_v1',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const s=t.objectStore(store);let out;const r=fn(s);if(r&&'onsuccess' in r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(store,k){return this.tx(store,'readonly',s=>s.get(k))},
  put(store,k,v){return this.tx(store,'readwrite',s=>s.put(v,k))},
  del(store,k){return this.tx(store,'readwrite',s=>s.delete(k))},
  keys(store){return this.tx(store,'readonly',s=>s.getAllKeys())},
  clear(store){return this.tx(store,'readwrite',s=>s.clear())}
};

/* ---------- state ---------- */
const S={};
let saveTimer={};
function save(table){clearTimeout(saveTimer[table]);saveTimer[table]=setTimeout(()=>IDB.put('kv',table,S[table]).catch(e=>toast('تعذر الحفظ: '+e.message,5000)),60)}
function saveNow(table){clearTimeout(saveTimer[table]);return IDB.put('kv',table,S[table])}
async function saveAll(){for(const t of TABLES)await saveNow(t)}
const byId=(table,id)=>S[table].find(x=>x.id===id);
const idx={};
function reindex(){for(const t of ['schools','employees','categories','types','conditions','rooms']){idx[t]=new Map(S[t].map(x=>[x.id,x]))}}
const get=(t,id)=>id&&idx[t]?idx[t].get(id):undefined;

function seedData(){
  const seed=JSON.parse(document.getElementById('nv-seed').textContent);
  const t0=now();
  S.schools=seed.schools.map((r,i)=>({id:'s'+(i+1),moe:r[0],ident:r[1],site:r[2],name:r[3],district:r[4],city:r[5],gender:r[6],stage:r[7],status:'active',completed_at:null,completed_by:null,created_at:t0}));
  S.categories=[];S.types=[];
  const catKey=new Map();
  seed.types.forEach(r=>{const k=r[0]+'|'+r[1];let c=catKey.get(k);if(!c){c={id:'c'+(S.categories.length+1),ar:r[0],en:r[1]};catKey.set(k,c);S.categories.push(c)}
    if(!S.types.some(x=>x.cat===c.id&&x.en===r[2]))S.types.push({id:'t'+(S.types.length+1),cat:c.id,en:r[2],ar:r[3]})});
  S.conditions=['مناسب','جيد','ضعيف'].map((n,i)=>({id:'k'+(i+1),ar:n}));
  S.rooms=seed.rooms.map((r,i)=>({id:'r'+(i+1),en:r[0],ar:r[1]}));
  S.employees=seed.emps.map((r,i)=>({id:'e'+(i+1),number:r[0],name:r[1]}));
  S.collections=[];S.log=[];
  S.settings={app_name:'نوفارو — جرد الأصول',admin_email:'',logo:null,pin_hash:null,seeded_at:t0};
}
async function loadState(){
  await IDB.open();
  for(const t of TABLES)S[t]=await IDB.get('kv',t);
  if(!S.settings||!S.schools){seedData();await saveAll()}
  for(const t of TABLES)if(S[t]==null)S[t]=t==='settings'?{}:[];
  reindex();
}

/* ---------- photos ---------- */
const urlCache=new Map();
async function photoURL(key){if(!key)return '';if(urlCache.has(key))return urlCache.get(key);const b=await IDB.get('photos',key).catch(()=>null);if(!b)return '';const u=URL.createObjectURL(b);urlCache.set(key,u);return u}
function resizeImage(file,max=1600,q=.82){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('image')),'image/jpeg',q)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('الملف ليس صورة صالحة'))};img.src=u})}
async function storePhoto(file){if(!file)return null;if(file.size>15*1024*1024)throw new Error('حجم الصورة أكبر من 15 م.ب');const b=await resizeImage(file);const k='p_'+uid();await IDB.put('photos',k,b);return k}
async function deletePhoto(key){if(!key)return;if(S.collections.some(c=>c.school_image===key||c.asset_image===key))return;await IDB.del('photos',key).catch(()=>{});const u=urlCache.get(key);if(u){URL.revokeObjectURL(u);urlCache.delete(key)}}
async function hydratePhotos(root=document){for(const el of $$('[data-photo]',root)){const u=await photoURL(el.dataset.photo);if(u){el.src=u;el.onclick=()=>lightbox(u)}else{el.removeAttribute('data-photo');el.alt='—'}}}
function lightbox(src){const d=document.createElement('div');d.className='lb';d.innerHTML='<img alt="">';d.firstChild.src=src;d.onclick=()=>d.remove();document.body.appendChild(d)}
const thumb=k=>k?`<img class="thumb" data-photo="${esc(k)}" alt="">`:'<span class="thumb" style="display:inline-flex;align-items:center;justify-content:center;color:#94a3b8;cursor:default">—</span>';

/* ---------- dialogs ---------- */
function dialog(html,onMount){return new Promise(res=>{const bg=document.createElement('div');bg.className='dlg-bg';bg.innerHTML='<div class="dlg">'+html+'</div>';document.body.appendChild(bg);const close=v=>{bg.remove();res(v)};bg.addEventListener('click',e=>{if(e.target===bg)close(null)});$$('[data-close]',bg).forEach(b=>b.onclick=()=>close(b.dataset.close==='1'?true:null));onMount&&onMount(bg,close)})}
const confirmDlg=(text,ok='تأكيد',cls='bad')=>dialog(`<h3>تأكيد</h3><p>${esc(text)}</p><div class="row end"><button class="btn sec" data-close="0">إلغاء</button><button class="btn ${cls}" data-close="1">${esc(ok)}</button></div>`);

/* ---------- domain ---------- */
const empName=id=>(get('employees',id)||{}).name||'—';
const roomLabel=c=>{const r=get('rooms',c.room_name_id);return r?r.ar:''};
const isClosedRoom=id=>{const r=get('rooms',id);return !!r&&r.en==='Closed room'};
const submitted=c=>!!c.submitted_at;
function schoolStats(){const m=new Map();for(const c of S.collections){let s=m.get(c.school_id);if(!s){s={any:0,sub:0,qty:0,last:null,emp:null};m.set(c.school_id,s)}s.any++;if(c.submitted_at){s.sub++;s.qty+=num(c.quantity);if(!s.last||c.submitted_at>s.last){s.last=c.submitted_at}}if(!s.emp||(c.updated_at||'')>(s.empAt||'')){s.emp=c.employee_id;s.empAt=c.updated_at||''}}return m}
function schoolState(s,st){if(s.completed_at)return 'completed';if(st&&st.any)return 'in_progress';return 'not_started'}
const STATE_LBL={completed:['مكتملة','p-ok'],in_progress:['قيد العمل','p-warn'],not_started:['لم تبدأ','p-mut']};
function statePill(k){const x=STATE_LBL[k];return `<span class="pill ${x[1]}">${x[0]}</span>`}

async function writeXlsx(sheets,name){try{await needXLSX()}catch(e){xlsxP=null;return toast(e.message,4000)}const wb=XLSX.utils.book_new();for(const [n,rows] of sheets){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(()=>({wch:18}));ws['!views']=[{RTL:true}];XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))}XLSX.writeFile(wb,name)}

function exportRow(c){const e=get('employees',c.employee_id)||{},s=get('schools',c.school_id)||{},t=get('types',c.type_id)||{};return [c.id,e.name||'',e.number||'',s.name||'',s.moe||'',s.ident||'',s.city||'',s.district||'',s.site||'',(get('categories',c.category_id)||{}).ar||'',t.ar||'',t.en||'',(get('conditions',c.condition_id)||{}).ar||'',c.submitted_at?num(c.quantity):'',c.price??'',STATUS[c.status]||c.status||'',c.manufacturer||'',c.brand||'',c.model||'',c.capacity||'',c.serial||'',c.agency||'',c.warranty||'',c.install_date||'',c.floor||'',c.room_number||'',roomLabel(c),c.asad_country||'',c.lat??'',c.lng??'',c.tag||'',c.parent_child||'',c.notes||'',c.school_image?c.school_image+'.jpg':'',c.asset_image?c.asset_image+'.jpg':'',c.submitted_at?fmtDT(c.submitted_at):'مسودة',fmtDT(c.created_at)]}

const blobToData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const dataToBlob=async d=>(await fetch(d)).blob();
async function buildPackage(opts){const o=opts||{};const pkg={app:'novaro',v:1,at:now(),kind:o.kind||'full',by:o.by||null,data:{}};
  if(o.kind==='employee'){const mine=S.collections.filter(c=>c.employee_id===o.by);const sch=new Set(mine.map(c=>c.school_id));pkg.data.collections=mine;pkg.data.schools=S.schools.filter(s=>sch.has(s.id));pkg.data.employees=S.employees.filter(e=>e.id===o.by);pkg.data.log=S.log.filter(l=>l.emp===o.by)}
  else{for(const t of TABLES)pkg.data[t]=t==='settings'?Object.assign({},S.settings,{pin_hash:undefined}):S[t]}
  if(o.photos!==false){pkg.photos={};const keys=new Set();for(const c of pkg.data.collections){c.school_image&&keys.add(c.school_image);c.asset_image&&keys.add(c.asset_image)}for(const k of keys){const b=await IDB.get('photos',k).catch(()=>null);if(b)pkg.photos[k]=await blobToData(b)}}
  return pkg}
async function exportPackage(opts){toast('جارٍ تجهيز الملف…');const pkg=await buildPackage(opts);const name=(opts&&opts.kind==='employee'?'novaro-'+((get('employees',opts.by)||{}).number||'emp')+'-':'novaro-backup-')+stamp()+'.json';download(new Blob([JSON.stringify(pkg)],{type:'application/json'}),name)}
async function readPackage(file){const pkg=JSON.parse(await file.text());if(!pkg||pkg.app!=='novaro'||!pkg.data)throw new Error('الملف ليس نسخة من نوفارو');return pkg}
/* Merge a package from another device: records by id (newer updated_at wins), school completion kept, lookups/employees matched by natural key. */
async function mergePackage(pkg){const d=pkg.data;const rep={coll:0,upd:0,sch:0,emp:0,photos:0};const remap={employees:{},schools:{},categories:{},types:{},conditions:{},rooms:{}};
  const matchBy=(t,keyFn,make)=>{for(const x of (d[t]||[])){const k=keyFn(x);let m=S[t].find(y=>keyFn(y)===k);if(!m&&make){m=make(x);S[t].push(m);if(t==='employees')rep.emp++}if(m)remap[t][x.id]=m.id}};
  matchBy('employees',e=>String(e.number),x=>Object.assign({},x,{id:byId('employees',x.id)?'e'+uid():x.id}));
  matchBy('categories',c=>c.ar+'|'+c.en,x=>Object.assign({},x,{id:byId('categories',x.id)?'c'+uid():x.id}));
  for(const x of (d.types||[])){const cat=remap.categories[x.cat]||x.cat;let m=S.types.find(y=>y.cat===cat&&y.en===x.en);if(!m){m=Object.assign({},x,{cat,id:byId('types',x.id)?'t'+uid():x.id});S.types.push(m)}remap.types[x.id]=m.id}
  matchBy('conditions',c=>c.ar,x=>Object.assign({},x,{id:byId('conditions',x.id)?'k'+uid():x.id}));
  matchBy('rooms',r=>r.en+'|'+r.ar,x=>Object.assign({},x,{id:byId('rooms',x.id)?'r'+uid():x.id}));
  for(const x of (d.schools||[])){let m=S.schools.find(y=>y.ident===x.ident);if(!m){m=Object.assign({},x,{id:byId('schools',x.id)?'s'+uid():x.id});S.schools.push(m)}remap.schools[x.id]=m.id;
    if(x.completed_at&&(!m.completed_at||x.completed_at<m.completed_at)){m.completed_at=x.completed_at;m.completed_by=remap.employees[x.completed_by]||x.completed_by;m.status='inactive';rep.sch++}}
  const R=(t,v)=>v==null?v:(remap[t][v]||v);
  for(const x of (d.collections||[])){const c=Object.assign({},x,{employee_id:R('employees',x.employee_id),school_id:R('schools',x.school_id),category_id:R('categories',x.category_id),type_id:R('types',x.type_id),condition_id:R('conditions',x.condition_id),room_name_id:R('rooms',x.room_name_id)});
    const i=S.collections.findIndex(y=>y.id===c.id);if(i<0){S.collections.push(c);rep.coll++}else if((c.updated_at||'')>(S.collections[i].updated_at||'')){S.collections[i]=c;rep.upd++}}
  for(const l of (d.log||[]))if(!S.log.some(y=>y.id===l.id))S.log.push(l);S.log.sort((a,b)=>a.at<b.at?1:-1);
  for(const [k,v] of Object.entries(pkg.photos||{})){if(!(await IDB.get('photos',k).catch(()=>null))){await IDB.put('photos',k,await dataToBlob(v));rep.photos++}}
  reindex();await saveAll();return rep}
async function restorePackage(pkg){if(pkg.kind!=='full')throw new Error('هذا ملف فني وليس نسخة كاملة — استخدم «دمج»');const pin=S.settings.pin_hash;for(const t of TABLES)S[t]=pkg.data[t]||(t==='settings'?{}:[]);S.settings.pin_hash=pin;await IDB.clear('photos');urlCache.clear();for(const [k,v] of Object.entries(pkg.photos||{}))await IDB.put('photos',k,await dataToBlob(v));reindex();await saveAll()}

async function hashPin(p){const data=new TextEncoder().encode('novaro:'+p);if(window.crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}let h=5381;for(const b of data)h=((h<<5)+h+b)>>>0;return 'd'+h.toString(16)}

<script id="nv-field">
/* Technician wizard: login → school → location → asset details → success → (add another | finish school) */
const app=()=>$('#app');

function schoolBlock(sc,empId){if(sc.status==='inactive'||sc.completed_at)return 'هذه المدرسة غير نشطة أو مكتملة.';if(S.collections.some(c=>c.school_id===sc.id&&c.employee_id!==empId))return 'يعمل على هذه المدرسة فني آخر.';return ''}
function schoolSearch(input,list,onPick,filter){let items=[],act=-1;
  const render=()=>{list.innerHTML=items.map((s,i)=>`<div data-i="${i}" class="${i===act?'act':''}">${esc(s.name)}<small>${esc(s.moe)} · ${esc(s.ident)} · ${esc(s.city)}${s.district?' — '+esc(s.district):''}</small></div>`).join('')||'<div class="muted">لا توجد نتائج</div>';list.classList.remove('hide')};
  input.addEventListener('input',()=>{const q=norm(input.value);if(q.length<2){list.classList.add('hide');return}items=S.schools.filter(s=>(!filter||filter(s))&&(norm(s.name).includes(q)||norm(s.moe).includes(q)||norm(s.ident).includes(q))).slice(0,40);act=-1;render()});
  input.addEventListener('keydown',e=>{if(list.classList.contains('hide'))return;if(e.key==='ArrowDown'){act=Math.min(items.length-1,act+1);render();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(0,act-1);render();e.preventDefault()}else if(e.key==='Enter'&&act>=0){e.preventDefault();pick(items[act])}});
  list.addEventListener('mousedown',e=>{const d=e.target.closest('[data-i]');if(d){e.preventDefault();pick(items[+d.dataset.i])}});
  input.addEventListener('blur',()=>setTimeout(()=>list.classList.add('hide'),150));
  function pick(s){list.classList.add('hide');input.value=s.name;onPick(s)}}
function photoInput(name,required,current){return `<div class="choice" style="margin-bottom:8px"><label><input type="radio" name="${name}_m" value="cam" checked> التقاط صورة</label><label><input type="radio" name="${name}_m" value="gal"> من المعرض</label></div>

  ${current?`<div class="row" style="margin-top:8px;background:var(--ok-s);padding:6px;border-radius:10px">${thumb(current)}<span style="color:var(--ok);font-size:13px;font-weight:700">الصورة الحالية محفوظة — اختر صورة جديدة لاستبدالها فقط</span></div>`:''}`}

function bindAssetForm(c){const cat=$('#a_category_id'),typ=$('#a_type_id');
  cat.onchange=()=>{const ts=S.types.filter(t=>t.cat===cat.value).sort((a,b)=>a.ar.localeCompare(b.ar,'ar'));typ.innerHTML='<option value="">اختر…</option>'+ts.map(x=>`<option value="${esc(x.id)}">${esc(x.ar)} (${esc(x.en)})</option>`).join('');typ.disabled=!cat.value};
  bindPhotoInput('aimg');hydratePhotos($('#app'));
  const lat=$('#a_lat'),lng=$('#a_lng');let map,marker;
  const set=(a,b,move)=>{lat.value=(+a).toFixed(8);lng.value=(+b).toFixed(8);if(marker){marker.setLatLng([+a,+b]);if(move)map.setView([+a,+b],17)}};
  const detect=()=>{if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع');navigator.geolocation.getCurrentPosition(p=>set(p.coords.latitude,p.coords.longitude,true),er=>toast('تعذر تحديد الموقع: '+er.message),{enableHighAccuracy:true,timeout:15000})};
  $('#geo').onclick=detect;
  const has=c.lat!=null&&c.lat!==''&&c.lng!=null&&c.lng!=='';
  needLeaflet().then(()=>{if(!document.body.contains($('#map')))return;const p=has?[+c.lat,+c.lng]:[24.7136,46.6753];map=L.map('map').setView(p,has?16:12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
    marker=L.marker(p,{draggable:true}).addTo(map);marker.on('dragend',e=>{const q=e.target.getLatLng();set(q.lat,q.lng)});map.on('click',e=>{set(e.latlng.lat,e.latlng.lng)});
    const sync=()=>{if(lat.value&&lng.value&&isFinite(+lat.value)&&isFinite(+lng.value))marker.setLatLng([+lat.value,+lng.value])};lat.onchange=lng.onchange=sync;
    if(!has&&!c._noAutoGeo)detect()}).catch(()=>{leafP=null;$('#map').outerHTML='<div class="msg warn">تعذر تحميل الخريطة (لا يوجد اتصال) — أدخل الإحداثيات يدوياً أو استخدم «تحديد موقعي».</div>';if(!has&&!c._noAutoGeo)detect()})}
async function readAssetForm(c){const g=k=>$('#a_'+k).value.trim();const errs=[];
  const out={category_id:g('category_id')||null,type_id:g('type_id')||null,condition_id:g('condition_id')||null,quantity:g('quantity')===''?null:Math.round(num(g('quantity'))),price:g('price')===''?null:num(g('price')),status:g('status')||null,
    manufacturer:g('manufacturer'),brand:g('brand'),model:g('model'),capacity:g('capacity'),serial:g('serial'),agency:g('agency'),warranty:g('warranty'),install_date:g('install_date'),asad_country:g('asad_country'),
    lat:g('lat')===''?null:num(g('lat')),lng:g('lng')===''?null:num(g('lng')),parent_child:($('[name=a_pc]:checked')||{}).value||null,tag:g('tag'),notes:g('notes')};
  if(!out.category_id)errs.push('الفئة');if(!out.type_id)errs.push('نوع الأصل');if(!out.condition_id)errs.push('الحالة الفنية');if(!out.status)errs.push('التشغيل');if(!out.parent_child)errs.push('أصل/فرعي');
  if(out.quantity==null||out.quantity<1)errs.push('العدد (1 أو أكثر)');if(out.price==null||out.price<0)errs.push('السعر');
  if(out.lat!=null&&(out.lat<-90||out.lat>90))errs.push('خط العرض');if(out.lng!=null&&(out.lng<-180||out.lng>180))errs.push('خط الطول');
  const f=$('#aimg').files[0];if(!f&&!c.asset_image)errs.push('صورة الأصل');
  if(errs.length)throw new Error('أكمل الحقول: '+errs.join('، '));
  if(f){const k=await storePhoto(f);out._oldImg=c.asset_image;out.asset_image=k}
  return out}

function vSuccess(){
  if(!needEmp())return;const s=sess();const sc=s.school&&get('schools',s.school);if(!sc){go('#home');return}
  const list=S.collections.filter(x=>x.school_id===sc.id&&x.submitted_at).sort((a,b)=>a.submitted_at<b.submitted_at?1:-1);
  const total=list.reduce((a,c)=>a+num(c.quantity),0);const c=curColl();
  app().innerHTML=`<div class="wrap">${steps(4)}${takeFlash()}<div class="card"><h2>✅ تم الحفظ</h2><p class="sub">${esc(sc.name)} — ${list.length} سجل · ${total} أصل</p>
  ${sc.completed_at?'<div class="msg info">تم إنهاء هذه المدرسة.</div>':`<div class="menu">
  <button class="btn" id="same" ${c&&c.floor?'':'disabled'}>➕ أصل آخر في نفس الغرفة</button>

  <button class="btn ok" id="fin">🏁 إنهاء جرد المدرسة</button></div>`}
  <div class="row" style="margin-top:12px"><a class="btn sec sm" href="#home">الرئيسية</a><a class="btn sec sm" href="#history">سجلّي</a></div></div>
  ${list.length?`<div class="card"><h3>أصول المدرسة</h3>${assetTable(list,true)}</div>`:''}</div>`;
  hydratePhotos();
  if(sc.completed_at)return;
  const add=same=>{const e=curEmp();const base=curColl()||list.find(x=>x.employee_id===e.id)||{};
    let d=S.collections.find(x=>x.employee_id===e.id&&x.school_id===sc.id&&!x.submitted_at);
    const loc=same?{floor:base.floor,room_number:base.room_number,room_name_id:base.room_name_id}:{floor:null,room_number:null,room_name_id:null};
    if(d)Object.assign(d,blankAsset(),loc,{updated_at:now()});else{d=newCollection(e.id,sc.id,base.school_image||null,loc);S.collections.push(d)}
    save('collections');setSess({coll:d.id});if(same){setFlash('أصل جديد في نفس الغرفة.','info');go('#asset')}else go('#location')};
  $('#same').onclick=()=>add(true);$('#other').onclick=()=>add(false);
  $('#fin').onclick=async()=>{if(!list.some(x=>x.employee_id===curEmp().id))return toast('سجّل أصلاً واحداً على الأقل قبل الإنهاء');
    if(!await confirmDlg('إنهاء جرد «'+sc.name+'»؟ لن يمكن إضافة أصول جديدة لها بعد ذلك.','إنهاء','ok'))return;
    const e=curEmp();S.collections=S.collections.filter(x=>!(x.school_id===sc.id&&x.employee_id===e.id&&!x.submitted_at));

function empOptions(sel,blank='كل الفنيين'){return `<option value="">${blank}</option>`+S.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'ar')).map(e=>`<option value="${esc(e.id)}" ${sel===e.id?'selected':''}>${esc(e.name)} (${esc(e.number)})</option>`).join('')}

/* ---------- dashboard ---------- */
function vDash(){const st=schoolStats();let comp=0,prog=0,ns=0;for(const s of S.schools){const k=schoolState(s,st.get(s.id));k==='completed'?comp++:k==='in_progress'?prog++:ns++}
  const sub=S.collections.filter(submitted);const totalQty=sub.reduce((a,c)=>a+num(c.quantity),0);const value=sub.reduce((a,c)=>a+num(c.quantity)*num(c.price),0);
  const tech=new Map();for(const c of S.collections){let t=tech.get(c.employee_id);if(!t){t={done:new Set(),prog:new Set(),qty:0,rec:0};tech.set(c.employee_id,t)}const s=get('schools',c.school_id);(s&&s.completed_at?t.done:t.prog).add(c.school_id);if(c.submitted_at){t.qty+=num(c.quantity);t.rec++}}
  const techRows=[...tech.entries()].map(([id,t])=>({id,name:empName(id),done:t.done.size,prog:t.prog.size,total:t.done.size+t.prog.size,qty:t.qty,rec:t.rec})).sort((a,b)=>b.total-a.total||b.qty-a.qty);
  const days=[];const d0=new Date();d0.setHours(0,0,0,0);for(let i=29;i>=0;i--){const d=new Date(d0);d.setDate(d.getDate()-i);days.push({k:dayKey(d),qty:0,rec:0})}const dm=new Map(days.map(d=>[d.k,d]));
  for(const c of sub){const x=dm.get(dayKey(c.submitted_at));if(x){x.qty+=num(c.quantity);x.rec++}}const mx=Math.max(1,...days.map(d=>d.qty));
  const cat=new Map();for(const c of sub){if(!c.category_id)continue;cat.set(c.category_id,(cat.get(c.category_id)||0)+num(c.quantity))}const catRows=[...cat.entries()].sort((a,b)=>b[1]-a[1]);
  const cond=new Map();for(const c of sub){if(!c.condition_id)continue;cond.set(c.condition_id,(cond.get(c.condition_id)||0)+num(c.quantity))}
  const notWork=sub.filter(c=>c.status==='Does not work').reduce((a,c)=>a+num(c.quantity),0);
  shell('dash',`<h2 style="margin:0 0 12px">لوحة المؤشرات</h2>
  <div class="kpis"><div class="kpi c1"><b>${S.schools.length}</b><span>إجمالي المدارس</span></div><div class="kpi c2"><b>${comp}</b><span>مدارس مكتملة</span></div><div class="kpi c3"><b>${prog}</b><span>قيد العمل</span></div><div class="kpi c4"><b>${ns}</b><span>لم تبدأ</span></div><div class="kpi c5"><b>${totalQty.toLocaleString('en-US')}</b><span>أصل مسجّل (${sub.length} سجل)</span></div><div class="kpi c1"><b>${money(value)}</b><span>القيمة الحالية (ريال)</span></div><div class="kpi" style="--x:0"><b style="color:var(--bad)">${notWork}</b><span>أصول لا تعمل</span></div></div>
  <div class="card"><h3>الإنجاز اليومي — آخر 30 يوماً (عدد الأصول)</h3><div class="bars">${days.map(d=>`<div class="bar" title="${d.k}: ${d.qty} أصل · ${d.rec} سجل"><em>${d.qty||''}</em><i style="height:${Math.round(d.qty/mx*120)}px"></i><small>${d.k.slice(5)}</small></div>`).join('')}</div></div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
  <div class="card"><h3>أداء الفنيين</h3>${techRows.length?`<div class="tbl-w"><table class="t"><thead><tr><th>الفني</th><th>مكتملة</th><th>قيد العمل</th><th>الإجمالي</th><th>الأصول</th></tr></thead><tbody>${techRows.map(r=>`<tr><td><a href="#admin/groups" data-emp="${esc(r.id)}">${esc(r.name)}</a></td><td><span class="pill p-ok">${r.done}</span></td><td><span class="pill p-warn">${r.prog}</span></td><td><b>${r.total}</b></td><td>${r.qty}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">لا توجد بيانات بعد.</p>'}</div>
  <div class="card"><h3>الأصول حسب الفئة</h3>${catRows.length?`<div class="tbl-w"><table class="t"><tbody>${catRows.map(([id,q])=>`<tr><td>${esc((get('categories',id)||{}).ar||'—')}</td><td style="width:45%"><div style="background:#dbeafe;border-radius:6px;height:10px;width:${Math.max(2,Math.round(q/catRows[0][1]*100))}%"></div></td><td><b>${q}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:10px">${S.conditions.map(k=>`<span class="pill p-pri">${esc(k.ar)}: ${cond.get(k.id)||0}</span>`).join('')}</div>`:'<p class="muted">لا توجد بيانات بعد.</p>'}</div></div>`);
  $$('[data-emp]').forEach(a=>a.onclick=()=>{Object.assign(UI.groups,{emp:a.dataset.emp,page:1})});
}

/* ---------- collections grouped by technician + school ---------- */
function groupRows(){const st=UI.groups,q=norm(st.q);const m=new Map();
  for(const c of S.collections){const k=c.employee_id+'|'+c.school_id;let g=m.get(k);if(!g){g={k,emp:c.employee_id,school:c.school_id,qty:0,rec:0,last:null,recs:[]};m.set(k,g)}g.recs.push(c);if(c.submitted_at){g.qty+=num(c.quantity);g.rec++;if(!g.last||c.submitted_at>g.last)g.last=c.submitted_at}}
  const sst=schoolStats();let rows=[...m.values()];
  rows=rows.filter(g=>{const s=get('schools',g.school)||{};if(st.emp&&g.emp!==st.emp)return false;if(st.school&&g.school!==st.school)return false;
    if(st.state&&schoolState(s,sst.get(g.school))!==st.state)return false;if(st.date&&!g.recs.some(c=>c.submitted_at&&dayKey(c.submitted_at)===st.date))return false;
    if(q){const hit=norm(s.name).includes(q)||norm(s.moe).includes(q)||norm(s.ident).includes(q)||norm(empName(g.emp)).includes(q)||g.recs.some(c=>norm(c.brand).includes(q)||norm(c.serial).includes(q)||norm(c.tag).includes(q)||norm(roomLabel(c)).includes(q)||norm((get('types',c.type_id)||{}).ar).includes(q));if(!hit)return false}return true});
  const key={emp:g=>empName(g.emp),school:g=>(get('schools',g.school)||{}).name,qty:g=>g.qty,last:g=>g.last}[st.sort]||(g=>g.last);
  rows.sort((a,b)=>cmp(key(a),key(b))*(st.dir==='asc'?1:-1));return rows}

    st.sel.clear();vGroups()});
}

const SCH_COLS={moe:['الرقم الوزاري','MoE No','moe_no'],ident:['معرّف المبنى','school_identifier','Building'],site:['الموقع','Site'],name:['اسم المدرسة','Arabic Name','name_ar','المدرسة'],district:['الحي/المنطقة','District Arabic','district_ar'],city:['المحافظة','city_ar','City'],gender:['بنين/بنات','gender'],stage:['المرحلة','stage']};
async function importSchools(){const f=await pickFile('.xlsx,.xls,.csv');if(!f)return;let rows;try{rows=await readXlsx(f)}catch(e){return toast(e.message,4000)}
  const pick=(r,k)=>{for(const n of SCH_COLS[k]){if(n in r)return String(r[n]).trim()}return null};let add=0,upd=0,skip=0;
  for(const r of rows){const ident=pick(r,'ident');if(!ident){skip++;continue}let s=S.schools.find(x=>x.ident===ident);const vals={};for(const k of Object.keys(SCH_COLS)){const v=pick(r,k);if(v!=null&&k!=='ident')vals[k]=v}
    if(s){for(const [k,v] of Object.entries(vals))if(v!=='')s[k]=v;upd++}else{if(!vals.name){skip++;continue}S.schools.push(Object.assign({id:'s'+uid(),ident,moe:'',site:'',name:'',district:'',city:'',gender:'',stage:'',status:'active',completed_at:null,completed_by:null,created_at:now()},vals));add++}}
  reindex();save('schools');setFlash(`الاستيراد: ${add} جديدة، ${upd} محدّثة، ${skip} صف متجاهل (بدون معرّف أو اسم). الأعمدة الفارغة لا تمسح القيم.`);vSchools()}

  <div class="err" id="e"></div><div class="row" style="margin-top:14px">${isNew?'':`<button type="button" class="btn bad" id="del">حذف المدرسة${used?` و${used} سجل`:''}</button>`}<span class="grow"></span><a class="btn sec" href="#admin/schools">إلغاء</a><button class="btn">حفظ</button></div></form>`);

    for(const r of rows){const n=String(r['الرقم الوظيفي']??r['employee_number']??r['number']??'').trim(),nm=String(r['الاسم']??r['name']??'').trim();if(!n||!nm)continue;const e=S.employees.find(x=>String(x.number)===n);if(e){e.name=nm;upd++}else{S.employees.push({id:'e'+uid(),number:n,name:nm});add++}}
    reindex();save('employees');setFlash(`الاستيراد: ${add} جديد، ${upd} محدّث. (الأعمدة: الرقم الوظيفي، الاسم)`);vEmps()}}
function empDialog(e){dialog(`<h3>${e?'تعديل فني':'فني جديد'}</h3><label class="f">الرقم الوظيفي</label><input class="in" id="dn" value="${esc(e?e.number:'')}"><label class="f" style="margin-top:10px">الاسم</label><input class="in" id="dm" value="${esc(e?e.name:'')}"><div class="err" id="de"></div><div class="row end" style="margin-top:14px"><button class="btn sec" data-close="0">إلغاء</button><button class="btn" id="dok">حفظ</button></div>`,(bg,close)=>{$('#dok',bg).onclick=()=>{const n=$('#dn',bg).value.trim(),m=$('#dm',bg).value.trim();if(!n||!m){$('#de',bg).textContent='الحقلان مطلوبان';return}if(S.employees.some(x=>String(x.number)===n&&x!==e)){$('#de',bg).textContent='الرقم مستخدم';return}if(e)Object.assign(e,{number:n,name:m});else S.employees.push({id:'e'+uid(),number:n,name:m});reindex();save('employees');close(true);vEmps()}})}

/* ---------- lookups (generic CRUD) ---------- */
const LK={
  cats:{t:'categories',title:'فئات الأصول',fields:[['ar','الاسم بالعربية',1],['en','الاسم بالإنجليزية',1]],uniq:x=>x.ar+'|'+x.en,
    used:id=>S.collections.filter(c=>c.category_id===id).length+S.types.filter(t=>t.cat===id).length,
    del:id=>{const tids=new Set(S.types.filter(t=>t.cat===id).map(t=>t.id));S.types=S.types.filter(t=>t.cat!==id);for(const c of S.collections){if(c.category_id===id)c.category_id=null;if(tids.has(c.type_id))c.type_id=null}save('types');save('collections')},note:'حذف الفئة يحذف أنواعها ويُفرغ الفئة والنوع في السجلات المرتبطة.'},
  types:{t:'types',title:'أنواع الأصول',fields:[['cat','الفئة',1,'cat'],['ar','الاسم بالعربية',1],['en','الاسم بالإنجليزية',1]],uniq:x=>x.cat+'|'+x.en,used:id=>S.collections.filter(c=>c.type_id===id).length,del:id=>{for(const c of S.collections)if(c.type_id===id)c.type_id=null;save('collections')}},
  conds:{t:'conditions',title:'الحالات الفنية',fields:[['ar','الاسم',1]],uniq:x=>x.ar,used:id=>S.collections.filter(c=>c.condition_id===id).length,del:id=>{for(const c of S.collections)if(c.condition_id===id)c.condition_id=null;save('collections')}},
  rooms:{t:'rooms',title:'أسماء الغرف',fields:[['ar','الاسم بالعربية',1],['en','الاسم بالإنجليزية',1]],uniq:x=>x.en+'|'+x.ar,used:id=>S.collections.filter(c=>c.room_name_id===id).length,del:id=>{for(const c of S.collections)if(c.room_name_id===id)c.room_name_id=null;save('collections')},note:'الغرفة ذات الاسم الإنجليزي «Closed room» تعني غرفة مغلقة تُنهى دون أصول — لا تغيّر اسمها الإنجليزي.'}};
function vLookup(key){const L=LK[key];let list=S[L.t].slice();const catF=key==='types'?UI.types.cat:'';if(catF)list=list.filter(x=>x.cat===catF);list.sort((a,b)=>key==='conds'?0:(a.ar||'').localeCompare(b.ar||'','ar'));
  shell(key,`<div class="row" style="margin-bottom:12px"><h2 class="grow" style="margin:0">${L.title} (${list.length})</h2><button class="btn sm" id="add">➕ إضافة</button><button class="btn sec sm" id="xl">⬇️ Excel</button></div>
  ${L.note?`<div class="msg info">${L.note}</div>`:''}<div class="card">${key==='types'?`<div class="filters"><select class="in" id="fc"><option value="">كل الفئات</option>${S.categories.map(c=>`<option value="${esc(c.id)}" ${catF===c.id?'selected':''}>${esc(c.ar)}</option>`).join('')}</select></div>`:''}
  <div class="tbl-w"><table class="t"><thead><tr>${L.fields.map(f=>`<th>${f[1]}</th>`).join('')}<th>الاستخدام</th><th></th></tr></thead><tbody>${list.map(x=>`<tr>${L.fields.map(f=>`<td>${f[3]==='cat'?esc((get('categories',x.cat)||{}).ar||''):esc(x[f[0]])}</td>`).join('')}<td>${L.used(x.id)}</td><td class="nowrap"><button class="btn sm sec" data-ed="${esc(x.id)}">تعديل</button> <button class="btn sm bad" data-del="${esc(x.id)}">حذف</button></td></tr>`).join('')}</tbody></table></div></div>`);
  if($('#fc'))$('#fc').onchange=e=>{UI.types.cat=e.target.value;vLookup(key)};
  const form=x=>dialog(`<h3>${x?'تعديل':'إضافة'} — ${L.title}</h3>${L.fields.map(f=>`<label class="f" style="margin-top:8px">${f[1]}</label>${f[3]==='cat'?`<select class="in" id="d_${f[0]}">${S.categories.map(c=>`<option value="${esc(c.id)}" ${(x?x.cat:catF)===c.id?'selected':''}>${esc(c.ar)}</option>`).join('')}</select>`:`<input class="in" id="d_${f[0]}" value="${esc(x?x[f[0]]:'')}">`}`).join('')}<div class="err" id="de"></div><div class="row end" style="margin-top:14px"><button class="btn sec" data-close="0">إلغاء</button><button class="btn" id="dok">حفظ</button></div>`,(bg,close)=>{
    $('#dok',bg).onclick=()=>{const v={};for(const f of L.fields){v[f[0]]=$('#d_'+f[0],bg).value.trim();if(f[2]&&!v[f[0]]){$('#de',bg).textContent='أكمل الحقول';return}}
      if(S[L.t].some(y=>y!==x&&L.uniq(y)===L.uniq(v))){$('#de',bg).textContent='موجود مسبقاً';return}
      if(x)Object.assign(x,v);else S[L.t].push(Object.assign({id:L.t[0]+uid()},v));reindex();save(L.t);close(true);vLookup(key)}});
  $('#add').onclick=()=>form(null);$$('[data-ed]').forEach(b=>b.onclick=()=>form(get(L.t,b.dataset.ed)));
  $$('[data-del]').forEach(b=>b.onclick=async()=>{const id=b.dataset.del,u=L.used(id);if(!await confirmDlg(u?`العنصر مستخدم في ${u} موضع، وسيُفرغ منها. متابعة؟`:'حذف العنصر؟','حذف'))return;L.del(id);S[L.t]=S[L.t].filter(x=>x.id!==id);reindex();save(L.t);vLookup(key)});
  $('#xl').onclick=()=>writeXlsx([[L.title,[L.fields.map(f=>f[1]),...list.map(x=>L.fields.map(f=>f[3]==='cat'?(get('categories',x.cat)||{}).ar||'':x[f[0]]))]]],'novaro-'+key+'-'+stamp()+'.xlsx')}

/* ---------- change log ---------- */
function logList(list){return `<div class="tbl-w"><table class="t"><thead><tr><th>الوقت</th><th>بواسطة</th><th>المدرسة</th><th>التغييرات</th><th></th></tr></thead><tbody>${list.map(l=>`<tr><td class="nowrap muted" style="font-size:12px">${fmtDT(l.at)}</td><td>${l.by==='admin'?'<span class="pill p-pri">المشرف</span>':esc(empName(String(l.by).replace('emp:','')))}</td><td>${esc((get('schools',l.school)||{}).name||'')}</td>
  <td style="font-size:13px">${Object.entries(l.changes).map(([k,v])=>`<div><b>${esc(FIELD_LBL[k]||k)}:</b> <span class="muted" style="text-decoration:line-through">${esc(fieldText(k,v.old))}</span> ← ${esc(fieldText(k,v.new))}</div>`).join('')}</td><td>${S.collections.some(c=>c.id===l.coll)?`<a class="btn sm sec" href="#admin/rec/${esc(l.coll)}">السجل</a>`:'<span class="muted">محذوف</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function vLog(){const st=UI.log;const list=S.log.slice((st.page-1)*50,st.page*50);
  shell('log',`<h2 style="margin:0 0 6px">سجل التعديلات</h2><p class="sub">كل تعديل على سجل أُرسل سابقاً (من الفني أو المشرف) يُحفظ هنا بدلاً من البريد الإلكتروني في النظام الأصلي.</p><div class="card">${list.length?logList(list):'<p class="muted">لا توجد تعديلات.</p>'}${pager(S.log.length,st.page,50)}</div>`);bindPager(p=>{st.page=p;vLog()})}

/* ---------- settings & data ---------- */
async function vSettings(){let est='';try{const e=await navigator.storage.estimate();est=`${(e.usage/1048576).toFixed(1)} م.ب مستخدمة من ${(e.quota/1048576/1024).toFixed(1)} ج.ب متاحة`}catch(e){}
  const nPhotos=(await IDB.keys('photos').catch(()=>[])).length;
  shell('settings',`<h2 style="margin:0 0 12px">الإعدادات والبيانات</h2>
  <form class="card" id="fs"><h3>عام</h3><div class="grid"><div><label class="f">اسم التطبيق</label><input class="in" id="g_name" value="${esc(S.settings.app_name||'')}"></div>
  <div><label class="f">بريد المشرف (للعرض فقط — لا يُرسل بريد من هذا الملف)</label><input class="in" id="g_mail" value="${esc(S.settings.admin_email||'')}"></div>
  <div><label class="f">الشعار</label><input type="file" class="in" id="g_logo" accept="image/*">${S.settings.logo?'<label style="font-size:13px"><input type="checkbox" id="g_nologo"> إزالة الشعار الحالي</label>':''}</div></div>
  <div class="row end" style="margin-top:12px"><button class="btn">حفظ</button></div></form>
  <form class="card" id="fp"><h3>رمز دخول المشرف</h3><div class="grid"><div><label class="f">الرمز الحالي</label><input class="in" type="password" id="p0"></div><div><label class="f">الرمز الجديد</label><input class="in" type="password" id="p1" minlength="4"></div><div><label class="f">تأكيد الجديد</label><input class="in" type="password" id="p2"></div></div><div class="err" id="pe"></div><div class="row end" style="margin-top:12px"><button class="btn">تغيير الرمز</button></div></form>
  <div class="card"><h3>البيانات على هذا الجهاز</h3><p class="sub">${S.collections.length} سجل · ${nPhotos} صورة · ${S.schools.length} مدرسة · ${S.employees.length} فني${est?' · '+est:''}</p>
  <div class="row"><button class="btn" id="bk">💾 نسخة احتياطية كاملة (مع الصور)</button><button class="btn sec" id="bk2">نسخة بدون صور</button><button class="btn sec" id="mg">🔀 دمج ملفات الفنيين / جهاز آخر</button><button class="btn sec" id="rs">♻️ استعادة نسخة كاملة</button></div>
  <div class="row" style="margin-top:10px"><button class="btn sec" id="xa">⬇️ Excel لكل الأصول</button><button class="btn sec" id="za">🖼️ كل الصور (ZIP)</button></div>
  <p class="muted" style="font-size:13px;margin-top:10px">طريقة العمل بأكثر من جهاز: كل فني يضغط «إرسال بياناتي» من صفحته الرئيسية ويرسل الملف، والمشرف يدمج الملفات من «دمج». الدمج يضيف السجلات الجديدة ويحدّث الأقدم بالأحدث ولا يحذف شيئاً.</p></div>
  <div class="card" style="border-color:#fecaca"><h3 style="color:var(--bad)">منطقة الخطر</h3><div class="row"><button class="btn bad" id="wipe">مسح كل البيانات والعودة للبيانات الأولية</button></div></div>
  <p class="muted" style="font-size:12px">الإصدار ${NV.version} · ${NV.date}</p>`);
  $('#fs').onsubmit=async ev=>{ev.preventDefault();S.settings.app_name=$('#g_name').value.trim()||'نوفارو';S.settings.admin_email=$('#g_mail').value.trim();
    const f=$('#g_logo').files[0];if(f){try{const b=await resizeImage(f,256,.9);S.settings.logo=await blobToData(b)}catch(e){return toast(e.message)}}if($('#g_nologo')&&$('#g_nologo').checked)S.settings.logo=null;await saveNow('settings');applyBrand();toast('تم الحفظ')};
  $('#fp').onsubmit=async ev=>{ev.preventDefault();const e=$('#pe');if(await hashPin($('#p0').value.trim())!==S.settings.pin_hash){e.textContent='الرمز الحالي غير صحيح';return}const p=$('#p1').value.trim();if(p.length<4){e.textContent='4 خانات على الأقل';return}if(p!==$('#p2').value.trim()){e.textContent='غير متطابق';return}S.settings.pin_hash=await hashPin(p);await saveNow('settings');e.textContent='';$('#fp').reset();toast('تم تغيير الرمز')};
  $('#bk').onclick=()=>exportPackage({kind:'full'});$('#bk2').onclick=()=>exportPackage({kind:'full',photos:false});
  $('#xa').onclick=()=>exportCollections(S.collections.filter(submitted));$('#za').onclick=()=>exportPhotosZip(S.collections);
  $('#mg').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.multiple=true;i.onchange=async()=>{let out=[];for(const f of i.files){try{const r=await mergePackage(await readPackage(f));out.push(`${f.name}: ${r.coll} سجل جديد، ${r.upd} محدّث، ${r.photos} صورة، ${r.sch} مدرسة مكتملة${r.emp?`، ${r.emp} فني جديد`:''}`)}catch(e){out.push(`${f.name}: ${e.message}`)}}setFlash(out.join(' | '),'info');vSettings()};i.click()};
  $('#rs').onclick=async()=>{const f=await pickFile('.json');if(!f)return;let pkg;try{pkg=await readPackage(f)}catch(e){return toast(e.message,4000)}if(!await confirmDlg('الاستعادة تستبدل كل البيانات الحالية على هذا الجهاز بمحتوى الملف. متابعة؟','استعادة'))return;try{await restorePackage(pkg);applyBrand();setFlash('تمت الاستعادة.');vSettings()}catch(e){toast(e.message,4000)}};
  $('#wipe').onclick=async()=>{if(!await confirmDlg('سيُحذف كل شيء على هذا الجهاز (السجلات، الصور، التعديلات) وتعود القوائم الأولية. خذ نسخة احتياطية أولاً. متابعة؟','مسح الكل'))return;const pin=S.settings.pin_hash;await IDB.clear('photos');urlCache.clear();seedData();S.settings.pin_hash=pin;reindex();await saveAll();clearSess();applyBrand();setFlash('تمت إعادة الضبط.');vSettings()}}
</script>
<script id="nv-boot">
/* Hash router and start-up */
function applyBrand(){const n=S.settings.app_name||'نوفارو';$('#brand').textContent=n;document.title=n;if(S.settings.logo)$('#logo').src=S.settings.logo}
function topBar(admin){const e=curEmp();$('#who').textContent=admin?'المشرف':e?e.name:'';const a=$('#topAdmin'),o=$('#topOut');
  a.textContent=admin?'واجهة الفني':'لوحة الإدارة';a.onclick=()=>go(admin?(e?'#home':'#login'):'#admin');
  o.classList.toggle('hide',!(admin?isAdmin():e));o.onclick=()=>{if(admin){setAdmin(false);go('#admin')}else{clearSess();go('#login')}}}
function route(){const h=decodeURIComponent(location.hash.replace(/^#/,''));const [a,b,c,d]=h.split('/');window.scrollTo(0,0);
  if(a==='admin'){topBar(true);if(!isAdmin()){vAdminLogin();return}
    switch(b){case 'groups':return vGroups();case 'group':return vGroup(c,d);case 'rec':return vRecord(c);case 'edit':return vEdit(c);case 'schools':return vSchools();case 'school':return vSchoolForm(c);case 'emps':return vEmps();
      case 'cats':case 'types':case 'conds':case 'rooms':return vLookup(b);case 'log':return vLog();case 'settings':return vSettings();default:return vDash()}}
  topBar(false);
  if(!curEmp()&&a!=='login'){if(a)clearSess();return a?go('#login'):vLogin()}
  switch(a){case 'login':return curEmp()?go('#home'):vLogin();case 'school':return vSchool();case 'location':return vLocation();case 'asset':return vAsset();case 'success':return vSuccess();case 'history':return vHistory();case 'done':return vDone();default:return vHome()}}
window.addEventListener('hashchange',route);
(async()=>{try{await loadState();applyBrand();if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});route()}
  catch(e){app().innerHTML=`<div class="wrap"><div class="msg bad">تعذر فتح قاعدة البيانات المحلية: ${esc(e.message||e)}. جرّب متصفحاً آخر أو اخرج من وضع التصفح الخاص.</div></div>`}})();
</script>
