<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* R1 (V160) — public school rating page: one-time link from a supervisor / engineer contact, no account */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:#0f172a}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4c1d95);display:flex;align-items:flex-start;justify-content:center;padding:18px}
.box{width:min(520px,100%);background:#fff;border-radius:22px;padding:22px 20px;box-shadow:0 24px 70px rgba(0,0,0,.35);margin:auto 0}
.brand{text-align:center;color:#64748b;font-weight:800;font-size:13px}
h1{margin:4px 0 2px;text-align:center;font-size:21px;font-weight:900}
.sub{text-align:center;color:#64748b;font-size:13.5px;font-weight:700;line-height:1.8;margin-bottom:6px}
.q{border:1px solid #e2e8f0;border-radius:16px;padding:12px 14px;margin:12px 0}
.q b{display:block;font-size:15px}.q small{display:block;color:#64748b;font-weight:700;font-size:12.5px}
.stars{display:flex;gap:6px;margin-top:8px}
.stars button{flex:1;max-width:58px;aspect-ratio:1;border:1px solid #cbd5e1;border-radius:12px;background:#f8fafc;font:900 24px Cairo,Tahoma,sans-serif;color:#cbd5e1;cursor:pointer;padding:0}
.stars button.on{background:#fef3c7;border-color:#f59e0b;color:#f59e0b}
.lv{font-size:12.5px;font-weight:800;color:#92400e;min-height:18px;margin-top:4px}
.na{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-size:12.5px;font-weight:700;color:#475569}
label.f{display:block;font-weight:800;color:#334155;font-size:13px;margin:10px 0 4px}
input[type=text],textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font:600 15px Cairo,Tahoma,sans-serif;background:#fff}
textarea{min-height:90px}
.go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;background:#2563eb;color:#fff;font:900 16px Cairo,Tahoma,sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.8;margin:12px 0 0;background:#fef2f2;color:#b42323}
.ok{text-align:center;font-size:15px;font-weight:800;line-height:2}.ok .big{font-size:52px}
.foot{text-align:center;color:#94a3b8;font-size:11.5px;margin-top:14px;font-weight:700}
</style>
</head>
<body>
<main class="box" id="app"><div class="sub">جارٍ التحميل…</div></main>
<script>
(function(){
'use strict';
// same project as start.html DEFAULT_CFG (publishable / anon key only)
const CFG={url:'https://hjumfnwabrtexyenshkg.supabase.co',key:'sb_publishable_g8_N3wEdQ7_fM9VKGan2iw_7xfcrByg'};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(new URLSearchParams(location.search).get('t')||'').trim();
const LV=['','ضعيف جداً','ضعيف','مقبول','جيد','ممتاز'];
const ERR={'already rated':'تم إرسال التقييم لهذه الزيارة من قبل. شكراً لك.','link expired':'انتهت صلاحية رابط التقييم (7 أيام). اطلب رابطاً جديداً من المشرف.','invalid link':'رابط التقييم غير صحيح.','invalid rating':'اختر درجة لكل بند مطلوب.'};
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const x=await r.json().catch(()=>null);if(!r.ok){const m=(x&&x.message)||('HTTP '+r.status);throw Error(ERR[m]||m)}return x}
function fail(t){app.innerHTML='<div class="brand">RakizoraFM · إدارة المرافق</div><h1>تقييم الخدمة</h1><p class="msg">'+esc(t)+'</p>'}
function date(v){try{return new Date(v).toLocaleDateString('ar-SA-u-ca-gregory',{timeZone:'Asia/Riyadh',year:'numeric',month:'long',day:'numeric'})}catch(e){return ''}}
function q(k,title,hint,optional){return '<div class="q" data-q="'+k+'"><b>'+title+'</b>'+(hint?'<small>'+esc(hint)+'</small>':'')+'<div class="stars">'+[1,2,3,4,5].map(n=>'<button type="button" data-v="'+n+'" aria-label="'+n+' من 5">★</button>').join('')+'</div><div class="lv"></div>'+(optional?'<label class="na"><input type="checkbox" data-na> لم أتعامل معه</label>':'')+'</div>'}
async function start(){
 if(!/^[0-9a-f]{64}$/.test(token))return fail('رابط التقييم غير صحيح.');
 let i;try{i=await rpc('fm_eng_rate_info',{p_token:token})}catch(e){return fail('تعذّر الاتصال. تحقق من الإنترنت ثم أعد فتح الرابط.')}
 if(!i||i.state==='invalid')return fail('رابط التقييم غير صحيح.');
 if(i.state==='used')return fail(ERR['already rated']);
 if(i.state==='expired')return fail(ERR['link expired']);
 const ch={phone:'اتصال هاتفي',whatsapp:'تواصل واتساب',visit:'زيارة ميدانية'}[i.channel]||'تواصل';
 app.innerHTML='<div class="brand">RakizoraFM · إدارة المرافق</div><h1>تقييم الخدمة</h1><div class="sub">'+esc(i.school)+'<br>'+ch+' بتاريخ '+esc(date(i.at))+'</div>'
  +'<p class="sub">رأيكم يساعدنا على تحسين خدمات الصيانة. من 1 (ضعيف جداً) إلى 5 (ممتاز).</p>'
  +q('q_service','جودة الخدمة وسرعة الاستجابة','جودة أعمال الصيانة وسرعة الاستجابة للبلاغات',false)
  +(i.supervisor?q('q_supervisor','تواصل المشرف','المشرف: '+i.supervisor,true):'')
  +(i.engineer?q('q_engineer','تواصل المهندس','المهندس: '+i.engineer,true):'')
  +q('q_overall','الرضا العام عن الخدمة','',false)
  +'<label class="f">ملاحظات أو مقترحات (اختياري)</label><textarea id="comment" maxlength="1000"></textarea>'
  +'<label class="f">الاسم (اختياري)</label><input type="text" id="rn" maxlength="100" autocomplete="name">'
  +'<label class="f">الصفة</label><input type="text" id="rt" maxlength="100" value="مدير المدرسة">'
  +'<button class="go" id="send">إرسال التقييم</button><p class="msg" id="err" hidden></p><div class="foot">يُستخدم الرابط مرة واحدة فقط.</div>';
 const val={};
 app.querySelectorAll('.q').forEach(box=>{const k=box.dataset.q,bs=[...box.querySelectorAll('[data-v]')],na=box.querySelector('[data-na]');
  const paint=()=>{bs.forEach(b=>b.classList.toggle('on',+b.dataset.v<=(val[k]||0)));box.querySelector('.lv').textContent=val[k]?LV[val[k]]:''};
  bs.forEach(b=>b.onclick=()=>{val[k]=+b.dataset.v;if(na)na.checked=false;paint()});
  if(na)na.onchange=()=>{if(na.checked)delete val[k];paint()}});
 app.querySelector('#send').onclick=async e=>{const b=e.currentTarget,err=app.querySelector('#err');err.hidden=true;
  const miss=[...app.querySelectorAll('.q')].filter(box=>{const na=box.querySelector('[data-na]');return !val[box.dataset.q]&&!(na&&na.checked)});
  if(miss.length){err.textContent='اختر درجة لكل بند (أو «لم أتعامل معه»).';err.hidden=false;miss[0].scrollIntoView({behavior:'smooth',block:'center'});return}
  b.disabled=true;
  try{await rpc('fm_eng_rate_submit',{p_token:token,p:Object.assign({},val,{comment:app.querySelector('#comment').value,rater_name:app.querySelector('#rn').value,rater_title:app.querySelector('#rt').value})});
   app.innerHTML='<div class="ok"><div class="big">🙏</div>شكراً لكم، تم استلام تقييمكم.<br><span style="color:#64748b;font-size:13px">'+esc(i.school)+'</span></div>'}
  catch(x){err.textContent=x.message==='Failed to fetch'?'تعذّر الإرسال. تحقق من الإنترنت ثم حاول مرة أخرى.':x.message;err.hidden=false;b.disabled=false}};
}
start();
})();
</script>
</body>
</html>
