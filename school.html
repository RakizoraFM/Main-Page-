<style>
/* SP1 (V175) — school principal portal: a permanent private link per school, no account */
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:#0f172a}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#0f766e);display:flex;align-items:flex-start;justify-content:center;padding:14px}
.box{width:min(560px,100%);background:#fff;border-radius:22px;padding:18px 16px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.brand{text-align:center;color:#64748b;font-weight:800;font-size:13px}
h1{margin:2px 0;text-align:center;font-size:20px;font-weight:900}
.sub{text-align:center;color:#64748b;font-size:13px;font-weight:700;line-height:1.8}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kp div{background:#f1f5f9;border-radius:14px;padding:8px;text-align:center}.kp b{display:block;font-size:20px}.kp span{font-size:11.5px;font-weight:800;color:#475569}
.tabs{display:flex;gap:6px;margin:6px 0 12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 10px;font:800 13px Cairo,Tahoma,sans-serif;color:#334155;cursor:pointer}
.tabs button.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
label.f{display:block;font-weight:800;color:#334155;font-size:13px;margin:12px 0 5px}
input[type=text],input[type=tel],textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font:600 15px Cairo,Tahoma,sans-serif;background:#fff}
textarea{min-height:100px}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:1px solid #cbd5e1;background:#f8fafc;border-radius:999px;padding:7px 12px;font:800 13px Cairo,Tahoma,sans-serif;color:#334155;cursor:pointer}
.cats button.on{background:#0f766e;border-color:#0f766e;color:#fff}
.urg{display:flex;gap:8px;align-items:center;margin-top:12px;padding:10px 12px;border:1px solid #fecaca;background:#fef2f2;border-radius:12px;font-weight:800;color:#b91c1c;font-size:13.5px}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.ph img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid #e2e8f0}
.ph label{width:76px;height:76px;border:2px dashed #cbd5e1;border-radius:10px;display:grid;place-items:center;font-size:26px;color:#94a3b8;cursor:pointer}
.ph .x{position:relative}.ph .x button{position:absolute;top:-6px;left:-6px;border:0;background:#b91c1c;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;background:#2563eb;color:#fff;font:900 16px Cairo,Tahoma,sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.8;margin:12px 0 0;background:#fef2f2;color:#b42323}
.okm{border-radius:12px;padding:12px;font-size:14.5px;font-weight:800;line-height:1.9;margin:12px 0 0;background:#ecfdf5;color:#065f46;text-align:center}
.it{border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;margin:8px 0}
.it .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.it .r1 b{font-size:14px}
.it p{margin:6px 0 0;font-size:13.5px;font-weight:600;color:#334155;line-height:1.7}
.it small{color:#64748b;font-weight:700;font-size:12px}
.st{border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.st.new{background:#e0e7ff;color:#3730a3}.st.accepted,.st.in_progress{background:#fef3c7;color:#92400e}.st.done{background:#dcfce7;color:#166534}.st.rejected{background:#fee2e2;color:#b91c1c}.st.open{background:#f1f5f9;color:#334155}
.rep{margin-top:6px;background:#f8fafc;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;color:#0f172a}
.stars{display:flex;gap:6px;margin-top:8px}.stars button{flex:1;max-width:46px;aspect-ratio:1;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;font:900 20px Cairo,Tahoma,sans-serif;color:#cbd5e1;cursor:pointer;padding:0}.stars button.on{background:#fef3c7;border-color:#f59e0b;color:#f59e0b}
.empty{text-align:center;color:#64748b;font-weight:700;padding:22px 6px}
.foot{text-align:center;color:#94a3b8;font-size:11.5px;margin-top:14px;font-weight:700;line-height:1.8}
</style>
</head>

<script>
(function(){
'use strict';
// same project as start.html DEFAULT_CFG (publishable / anon key only)
const CFG={url:'https://hjumfnwabrtexyenshkg.supabase.co',key:'sb_publishable_g8_N3wEdQ7_fM9VKGan2iw_7xfcrByg'};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=(new URLSearchParams(location.search).get('k')||'').trim().toLowerCase();
const CATS=['❄️ تكييف','💡 كهرباء','🚰 سباكة','🧹 نظافة','🔥 أمن وسلامة','🚪 أبواب ونوافذ','🧱 مباني وأسوار','📦 أخرى'];
const RST={new:'جديد — بانتظار المراجعة',accepted:'تم الاستلام',in_progress:'قيد التنفيذ',done:'تم الإنجاز',rejected:'مرفوض'};
const WST={assigned:'مُسند',accepted:'مقبول',in_progress:'قيد التنفيذ',done:'بانتظار الاعتماد',returned:'قيد التصحيح',stopped:'موقوف'};
const ERR={'invalid link':'الرابط غير صحيح أو تم إيقافه. اطلب رابطاً جديداً من مشرف الصيانة.','too many requests':'تم إرسال عدد كبير من الطلبات اليوم. حاول غداً أو تواصل مع المشرف.','description required':'اكتب وصفاً واضحاً للطلب.','invalid photos':'تعذّر إرفاق إحدى الصور. جرّب صورة أخرى.','already rated':'تم تقييم هذا الطلب من قبل.','not finished':'يمكن التقييم بعد إنجاز الطلب.'};
async function rpc(fn,body){const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const x=await r.json().catch(()=>null);if(!r.ok){const m=(x&&x.message)||('HTTP '+r.status);throw Error(ERR[m]||m)}return x}
const date=v=>{try{return new Date(v).toLocaleDateString('ar-SA-u-ca-gregory',{timeZone:'Asia/Riyadh',year:'numeric',month:'short',day:'numeric'})}catch(e){return ''}};
function fail(t){app.innerHTML='<div class="brand">RakizoraFM · إدارة المرافق</div><h1>بوابة المدرسة</h1><p class="msg">'+esc(t)+'</p>'}
let I=null,tab='new',form={cat:'',desc:'',urgent:false,name:'',phone:'',photos:[]},sent='';
try{const s=JSON.parse(localStorage.getItem('fmsp_contact')||'{}');form.name=s.name||'';form.phone=s.phone||''}catch(e){}
/* a photo → JPEG data URL, longest side ≤ 1280 px, under 560 000 characters */
function shrink(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(Error('read'));r.onload=()=>{const im=new Image();im.onerror=()=>rej(Error('image'));im.onload=()=>{
 let w=im.width,h=im.height,m=1280;if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k)}
 const c=document.createElement('canvas');let q=.72,out='';for(let i=0;i<6;i++){c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);out=c.toDataURL('image/jpeg',q);if(out.length<=560000)break;q-=.12;w=Math.round(w*.8);h=Math.round(h*.8)}
 out.length<=560000?res(out):rej(Error('size'))};im.src=r.result};r.readAsDataURL(file)})}
async function load(){I=await rpc('fm_school_portal',{p_token:token})}
async function start(){if(!/^[0-9a-f]{64}$/.test(token))return fail('الرابط غير صحيح.');
 try{await load()}catch(e){return fail('تعذّر الاتصال. تحقق من الإنترنت ثم أعد فتح الرابط.')}
 if(!I||I.state!=='ok')return fail(ERR['invalid link']);draw()}
function draw(){const open=(I.requests||[]).filter(r=>['new','accepted','in_progress'].includes(r.status)).length;
 app.innerHTML=`<div class="brand">RakizoraFM · إدارة المرافق</div><h1>🏫 ${esc(I.school)}</h1><div class="sub">بوابة المدرسة — ارفع طلبك وتابع حالته</div>
 <div class="kp"><div><b>${open}</b><span>طلباتي المفتوحة</span></div><div><b>${(I.tickets||[]).length}</b><span>بلاغات مفتوحة</span></div><div><b>${(I.orders||[]).length}</b><span>أعمال جارية</span></div></div>
 <div class="tabs">${[['new','➕ طلب جديد'],['mine','📋 طلباتي'],['open','🛠️ المفتوح على المدرسة']].map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('')}</div><div id="pane"></div>
 <div class="foot">هذا الرابط خاص بمدرستكم — لا تشاركه خارج إدارة المدرسة.</div>`;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;sent='';draw()});
 const p=app.querySelector('#pane');
 if(tab==='new')return drawForm(p);
 if(tab==='mine'){const L=I.requests||[];p.innerHTML=L.length?L.map(r=>`<div class="it"><div class="r1"><b>${esc(r.category)}${r.urgency==='urgent'?' · 🚨 عاجل':''}</b><span class="st ${esc(r.status)}">${esc(RST[r.status]||r.status)}</span></div>
   <small>${esc(r.code||'')} · ${esc(date(r.created_at))}${r.photos?` · 📷 ${r.photos}`:''}</small><p>${esc(r.description)}</p>
   ${r.response?`<div class="rep">💬 ${esc(r.response)}</div>`:''}${r.wo_code?`<small>أمر عمل: ${esc(r.wo_code)}</small>`:''}
   ${r.status==='done'?(r.rating?`<small>تقييمكم: ${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</small>`:`<div><small>قيّموا تنفيذ الطلب:</small><div class="stars" data-r="${esc(r.id)}">${[1,2,3,4,5].map(n=>`<button data-v="${n}">★</button>`).join('')}</div></div>`):''}</div>`).join(''):'<div class="empty">لا توجد طلبات بعد.</div>';
  p.querySelectorAll('[data-r]').forEach(box=>box.querySelectorAll('[data-v]').forEach(b=>b.onclick=async()=>{const v=+b.dataset.v;box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.v<=v));
   const c=prompt('ملاحظة على التنفيذ (اختياري):','');if(c===null){box.querySelectorAll('button').forEach(x=>x.classList.remove('on'));return}
   try{await rpc('fm_school_request_rate',{p_token:token,p_id:box.dataset.r,p_score:v,p_comment:c||''});await load();draw()}catch(e){alert(e.message)}}));return}
 const T=I.tickets||[],O=I.orders||[];
 p.innerHTML=`<label class="f">بلاغات مفتوحة (${T.length})</label>${T.length?T.map(t=>`<div class="it"><div class="r1"><b>${esc(t.cat||'بلاغ')}</b><span class="st open">${esc(t.status||'')}</span></div><small>رقم ${esc(t.id)} · ${esc(date(t.at))}${t.priority?' · '+esc(t.priority):''}</small></div>`).join(''):'<div class="empty">لا توجد بلاغات مفتوحة ✅</div>'}
  <label class="f">أعمال صيانة جارية (${O.length})</label>${O.length?O.map(o=>`<div class="it"><div class="r1"><b>${esc(o.title)}</b><span class="st in_progress">${esc(WST[o.status]||o.status)}</span></div><small>${esc(o.code||'')} · ${esc(date(o.at))}</small></div>`).join(''):'<div class="empty">لا توجد أعمال جارية</div>'}`}
function drawForm(p){if(sent){p.innerHTML=`<div class="okm">✅ تم استلام طلبكم برقم <b>${esc(sent)}</b><br>سيراجعه فريق الصيانة ويمكنكم متابعته من «📋 طلباتي».</div><button class="go" id="again">➕ طلب آخر</button>`;p.querySelector('#again').onclick=()=>{sent='';draw()};return}
 p.innerHTML=`<label class="f">نوع الطلب *</label><div class="cats">${CATS.map(c=>`<button type="button" data-c="${esc(c)}" class="${form.cat===c?'on':''}">${c}</button>`).join('')}</div>
  <label class="f">وصف الطلب *</label><textarea id="d" maxlength="1000" placeholder="مثال: المكيف في الفصل 3/أ لا يبرد منذ يومين">${esc(form.desc)}</textarea>
  <label class="urg"><input type="checkbox" id="u" ${form.urgent?'checked':''}> 🚨 عاجل — يؤثر على سلامة الطلاب أو سير الدراسة</label>
  <label class="f">صور (اختياري — حتى 3)</label><div class="ph">${form.photos.map((x,i)=>`<span class="x"><img src="${x}" alt=""><button type="button" data-rm="${i}">✕</button></span>`).join('')}${form.photos.length<3?'<label>📷<input type="file" accept="image/*" id="ph" hidden></label>':''}</div>
  <label class="f">اسم مقدّم الطلب</label><input type="text" id="n" maxlength="100" value="${esc(form.name)}" autocomplete="name">
  <label class="f">جوال للتواصل</label><input type="tel" id="m" maxlength="30" value="${esc(form.phone)}" dir="ltr" autocomplete="tel">
  <button class="go" id="send">إرسال الطلب</button><p class="msg" id="err" hidden></p>`;
 const keep=()=>{form.desc=p.querySelector('#d').value;form.urgent=p.querySelector('#u').checked;form.name=p.querySelector('#n').value;form.phone=p.querySelector('#m').value};
 p.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{keep();form.cat=b.dataset.c;drawForm(p)});
 p.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{keep();form.photos.splice(+b.dataset.rm,1);drawForm(p)});
 const ph=p.querySelector('#ph');if(ph)ph.onchange=async()=>{keep();const f=ph.files[0];if(!f)return;try{form.photos.push(await shrink(f))}catch(e){alert('تعذّر قراءة الصورة')}drawForm(p)};
 p.querySelector('#send').onclick=async e=>{keep();const err=p.querySelector('#err'),b=e.currentTarget;err.hidden=true;
  if(!form.cat){err.textContent='اختر نوع الطلب.';err.hidden=false;return}if(form.desc.trim().length<5){err.textContent=ERR['description required'];err.hidden=false;return}
  b.disabled=true;b.textContent='جارٍ الإرسال…';
  try{sent=await rpc('fm_school_request_new',{p_token:token,p:{category:form.cat.replace(/^\S+\s/,''),description:form.desc.trim(),urgency:form.urgent?'urgent':'normal',contact_name:form.name,contact_phone:form.phone,photos:form.photos}});
   try{localStorage.setItem('fmsp_contact',JSON.stringify({name:form.name,phone:form.phone}))}catch(_){}
   form={cat:'',desc:'',urgent:false,name:form.name,phone:form.phone,photos:[]};await load().catch(()=>{});draw()}
  catch(x){err.textContent=x.message==='Failed to fetch'?'تعذّر الإرسال. تحقق من الإنترنت ثم حاول مرة أخرى.':x.message;err.hidden=false;b.disabled=false;b.textContent='إرسال الطلب'}}}
start();
})();
</script>
