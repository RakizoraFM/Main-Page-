<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#2563eb;--bad:#b42323}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Cairo,Tahoma,sans-serif;color:var(--ink)}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e3a8a 60%,#4c1d95);display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:min(420px,100%);background:#fff;border-radius:22px;padding:26px 24px 22px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{display:block;width:min(230px,72%);height:auto;margin:0 auto 10px}
h2{margin:4px 0 2px;text-align:center;font-size:21px;font-weight:900}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px;font-weight:700}
label{display:block;font-weight:800;color:#334155;font-size:12.5px;margin:10px 0 4px}
input{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;font:600 15px Cairo,Tahoma,sans-serif;background:#fff}
input:focus{outline:2px solid #93c5fd;border-color:#60a5fa}
.go{width:100%;margin-top:16px;border:0;border-radius:12px;padding:12px;background:var(--pri);color:#fff;font:900 15.5px Cairo,Tahoma,sans-serif;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.go.sec{background:#eef2ff;color:#3730a3;margin-top:8px}
.links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.links a{color:var(--pri);font-weight:800;text-decoration:none}
.links a.mut{color:var(--mut)}
.msg{border-radius:12px;padding:9px 12px;font-size:13px;font-weight:700;line-height:1.8;margin:10px 0 0}
.msg.err{background:#fef2f2;color:var(--bad);border:1px solid #fecaca}
.msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.who{display:flex;align-items:center;gap:12px;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.who .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;font-weight:900;font-size:19px;flex:none}
.who b{display:block;font-size:16px}
.who span{color:var(--mut);font-size:12.5px;font-weight:700}
.spin{width:30px;height:30px;border:3px solid #dbeafe;border-top-color:var(--pri);border-radius:50%;margin:18px auto;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.foot{text-align:center;color:#94a3b8;font-size:11.5px;margin-top:14px}
.tn{display:flex;align-items:center;justify-content:center;gap:8px;margin:-2px 0 10px;font-weight:900;font-size:15px}.tn img{width:34px;height:34px;object-fit:contain;border-radius:8px}
</style>

/* every network call goes through API so tests can replace it */
async function ctlTenant(code){const r=await fetch(DEFAULT_CFG.url+'/rest/v1/rpc/saas_tenant',{method:'POST',headers:{apikey:DEFAULT_CFG.key,Authorization:'Bearer '+DEFAULT_CFG.key,'Content-Type':'application/json'},body:JSON.stringify({p_code:code})});
 if(!r.ok)throw new Error('control '+r.status);return r.json()}
const API=window.FMStartAPI=window.FMStartAPI||{
 async session(){const c=await sb();const {data}=await c.auth.getSession();return data?.session||null},
 async me(){const c=await sb();const {data:{user}}=await c.auth.getUser();if(!user)return null;const p=chk(await c.from('profiles').select('*').eq('id',user.id).maybeSingle());return p?Object.assign({},p,{email:p.email||user.email}):{id:user.id,email:user.email,role:'pending',regions:[]}},
 async signIn(em,pw){const c=await sb();return chk(await c.auth.signInWithPassword({email:em,password:pw}))},
 async signUp(em,pw,name){const c=await sb();return chk(await c.auth.signUp({email:em,password:pw,options:{data:{full_name:name}}}))},
 async reset(em){const c=await sb();return chk(await c.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname}))},
 async setPassword(pw){const c=await sb();chk(await c.auth.updateUser({password:pw}));try{chk(await c.rpc('fm_password_changed'))}catch(e){}return true},
 async signOut(){const c=await sb();await c.auth.signOut()}
};

/* ---------- views ---------- */
const frame=(inner)=>{const t=readT();app.innerHTML=`<img class="logo" src="${LOGO}" alt="RakizoraFM">${t&&t.name?`<div class="tn">${t.logo?`<img src="${esc(t.logo)}" alt="">`:''}<span>${esc(t.name)}</span></div>`:''}${inner}<div class="foot">RakizoraFM • إدارة المرافق والأصول الذكية</div>`};
function tenantError(t){frame(`<h2>الدخول للشركة</h2>${msg(esc(t))}<button class="go" id="t-ch">إدخال رمز الشركة</button>`);$('#t-ch').onclick=changeCompany}
function changeCompany(e){if(e&&e.preventDefault)e.preventDefault();const c=prompt('رمز الشركة (كما في الرابط الذي أرسله مزود الخدمة) — اتركه فارغاً للدخول الافتراضي:',(readT()||{}).code||'');if(c===null)return;
 const v=S(c).toLowerCase();if(!v){try{localStorage.removeItem(TKEY);localStorage.removeItem('fm-cloud-auth')}catch(_){}saveCfg(DEFAULT_CFG);location.href=location.pathname;return}location.href=location.pathname+'?c='+encodeURIComponent(v)}
/* resolve the company: ?c=code, else the one saved on this device; a change signs the old session out */
async function tenantStep(){const qc=S(new URLSearchParams(location.search).get('c')).toLowerCase(),cur=readT(),code=qc||(cur&&cur.code)||'';if(!code)return true;
 let t=null;try{t=await (API.tenant||ctlTenant)(code)}catch(e){if(!qc&&cur){applyBrand(cur);return true}tenantError('تعذّر التحقق من الشركة — تحقق من الاتصال ثم أعد المحاولة');return false}
 if(!t||t.status==='unknown'){if(qc){tenantError('رمز الشركة غير صحيح: '+code);return false}try{localStorage.removeItem(TKEY)}catch(e){}return true}
 if(t.status==='suspended'){try{localStorage.setItem(TKEY,JSON.stringify({code:t.code,name:t.name,logo:t.logo,color:t.color,status:t.status}))}catch(e){}tenantError(`حساب ${t.name} موقوف حالياً — تواصل مع مزود الخدمة.`);return false}
 const changed=!cur||cur.code!==t.code||readCfg().url!==S(t.url).replace(/\/+$/,'');
 if(changed){try{localStorage.removeItem('fm-cloud-auth')}catch(e){}client=null}
 saveCfg({url:t.url,key:t.key});try{localStorage.setItem(TKEY,JSON.stringify({code:t.code,name:t.name,logo:t.logo,color:t.color,status:t.status,active_until:t.active_until,demo:!!t.demo,demo_pass:t.demo?t.demo_pass||'':undefined}))}catch(e){}
 applyBrand(t);return true}
window.fmStartChangeCompany=changeCompany;
const msg=(t,k)=>t?`<div class="msg ${k||'err'}">${t}</div>`:'';
function busy(b,on,txt){b.disabled=on;if(txt)b.textContent=txt}

function setupView(err){
 frame(`<h2>إعداد الاتصال</h2><div class="sub">هذا الجهاز غير مربوط بالسحابة بعد</div>
  <label>رابط المشروع</label><input id="c-u" dir="ltr" placeholder="https://xxxx.supabase.co">
  <label>المفتاح العام (anon)</label><input id="c-k" dir="ltr">
  ${msg(err)}<button class="go" id="c-go">حفظ</button>
  <div class="msg info">أو افتح الصفحة من الرابط الذي أرسله مدير النظام (يحتوي كود الربط).</div>`);
 $('#c-go').onclick=()=>{const o={url:$('#c-u').value,key:$('#c-k').value};if(!valid(o)){setupView('تحقق من الرابط والمفتاح');return}saveCfg(o);client=null;boot()};
}

/* S8 (V182): a demo company lists its demo accounts (demo_seed.sql) — one click signs in with the public demo password */
const demoT=()=>{const t=readT();return t&&t.demo?t:null};
const DEMO=[['demo.admin','🛡️ مدير النظام'],['demo.pm','📊 مدير المشروع'],['demo.area','🗺️ مدير المنطقة'],['demo.eng1','👷 مهندس المنطقة'],['demo.sup1','🧰 مشرف (تطبيق الميدان)'],['demo.contractor','🏗️ مقاول (تطبيق الميدان)'],['demo.store','📦 أمين المستودع'],['demo.owner','✅ ممثل الجهة المالكة'],['demo.acc','💰 المحاسبة']];
const demoBox=()=>`<div class="msg info" style="text-align:right"><b>🧪 نسخة عرض ببيانات وهمية</b> — اختر الدور لتجربة المنصة كما يراها:<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px">${DEMO.map(([e,l])=>`<button type="button" class="go" style="margin:0;padding:8px;font-size:13px" data-demo="${e}@rakizora.demo">${l}</button>`).join('')}</div><div style="font-size:12px;margin-top:6px">تُعاد البيانات لحالتها كل ليلة.</div></div>`;
function loginView(mode,info,err){
 mode=mode||'in';
 const title={in:'تسجيل الدخول',up:'إنشاء حساب',reset:'استعادة كلمة المرور'}[mode];
 frame(`<h2>${title}</h2><div class="sub">${mode==='up'?'بعد إنشاء الحساب يفعّله مدير النظام ويحدد دورك':'دخول موحّد للمدير والمهندسين والمشرفين والمقاولين'}</div>
  ${info?msg(info,'info'):''}
  ${mode==='in'&&demoT()?demoBox():''}
  ${mode==='up'?'<label>الاسم الكامل</label><input id="l-n" autocomplete="name">':''}
  <label>البريد الإلكتروني</label><input id="l-e" type="email" dir="ltr" autocomplete="username">
  ${mode==='reset'?'':`<label>كلمة المرور</label><input id="l-p" type="password" dir="ltr" autocomplete="${mode==='up'?'new-password':'current-password'}">`}
  ${msg(err)}
  <button class="go" id="l-go">${{in:'دخول',up:'إنشاء الحساب',reset:'إرسال رابط الاستعادة'}[mode]}</button>
  <div class="links">${mode==='in'?'<a href="#" data-m="up">مستخدم جديد؟ إنشاء حساب</a><a href="#" class="mut" data-m="reset">نسيت كلمة المرور؟</a>':'<a href="#" data-m="in">لدي حساب — تسجيل الدخول</a>'}${mode==='in'?'<a href="#" class="mut" id="l-co">🏢 '+(readT()?'شركة أخرى':'رمز الشركة')+'</a>':''}</div>`);
 app.querySelectorAll('[data-m]').forEach(a=>a.onclick=e=>{e.preventDefault();loginView(a.dataset.m)});
 $('#l-co')&&($('#l-co').onclick=changeCompany);
 const go=async()=>{const b=$('#l-go'),em=S($('#l-e').value),pw=$('#l-p')?.value||'',nm=S($('#l-n')?.value);
  if(!em||(mode!=='reset'&&!pw))return loginView(mode,'', 'اكتب البريد'+(mode==='reset'?'':' وكلمة المرور'));
  if(mode==='up'&&!nm)return loginView(mode,'','اكتب اسمك');
  busy(b,true,'…');
  try{
   if(mode==='reset'){await API.reset(em);return loginView('in','إذا كان البريد مسجلاً ستصلك رسالة فيها رابط لتعيين كلمة مرور جديدة.')}
   if(mode==='up'){const r=await API.signUp(em,pw,nm);if(!r?.session)return loginView('in','تم إنشاء الحساب. إذا وصلتك رسالة تأكيد على البريد افتحها أولاً، ثم سجّل الدخول.')}
   else await API.signIn(em,pw);
   await route();
  }catch(e){loginView(mode,'',ARmsg(e.message))}};
 $('#l-go').onclick=go;app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
 app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{$('#l-e').value=b.dataset.demo;$('#l-p').value=demoT().demo_pass||'';go()});
 $('#l-e')?.focus();
}

/* new password: after a reset link, or required on the first sign-in with a temporary password */
function newPasswordView(err,first){
 frame(`<h2>${first?'تغيير كلمة المرور المؤقتة':'كلمة مرور جديدة'}</h2><div class="sub">${first?'هذا أول دخول لك — اختر كلمة مرور خاصة بك':'اكتب كلمة المرور الجديدة لحسابك'}</div>
  <label>كلمة المرور الجديدة</label><input id="np" type="password" dir="ltr" autocomplete="new-password">
  <label>تأكيد كلمة المرور</label><input id="np2" type="password" dir="ltr" autocomplete="new-password">
  ${msg(err)}<button class="go" id="np-go">حفظ والمتابعة</button>${first?'<div class="links"><a href="#" class="mut" id="np-out">تسجيل الخروج</a></div>':''}`);
 $('#np-out')&&($('#np-out').onclick=e=>{e.preventDefault();signOut()});
 const go=async()=>{const b=$('#np-go'),pw=$('#np').value;if(pw.length<8)return newPasswordView('8 أحرف على الأقل',first);if(pw!==$('#np2').value)return newPasswordView('كلمتا المرور غير متطابقتين',first);busy(b,true,'…');
  try{await API.setPassword(pw);await route()}catch(e){newPasswordView(ARmsg(e.message),first)}};
 $('#np-go').onclick=go;app.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});$('#np').focus();
}

function pendingView(p){
 frame(`<h2>بانتظار التفعيل</h2><div class="sub">${esc(p.email)}</div>
  <div class="msg info">تم تسجيل حسابك. أبلغ مدير النظام ليحدد دورك ومنطقتك واسمك في البلاغات، ثم اضغط «تحقق».</div>
  <button class="go" id="re">تحقق</button><button class="go sec" id="out">تسجيل الخروج</button>`);
 $('#re').onclick=()=>route();$('#out').onclick=signOut;
}

let timer=null;
function welcomeView(p,dest){
 const name=S(p.full_name)||S(p.email);const regions=(p.regions||[]).map(r=>RN[r]||r).join('، ');
 const other=p.role==='admin'?(dest==='index.html'?'field.html':'index.html'):'';
 frame(`<div class="who"><div class="av">${esc(name.charAt(0))}</div><div><b>${esc(name)}</b><span>${esc(POS[p.job_title]||ROLE[p.role]||p.role)}${regions?' • '+esc(regions):''}</span></div></div>
  <div class="sub" style="margin:10px 0 0">${other?'اختر ما تريد فتحه':`جارٍ فتح ${DEST[dest]}…`}</div>
  <button class="go" id="w-go">فتح ${DEST[dest]}</button>
  ${other?`<button class="go sec" id="w-alt">فتح ${DEST[other]}</button>`:''}
  <div class="links"><a href="#" class="mut" id="w-out">ليس أنت؟ تسجيل الخروج</a></div>`);
 const open=u=>{clearTimeout(timer);location.href=u};
 $('#w-go').onclick=()=>open(dest);if(other)$('#w-alt').onclick=()=>open(other);
 $('#w-out').onclick=e=>{e.preventDefault();clearTimeout(timer);signOut()};
 /* the admin chooses; a role with one workspace opens it automatically */
 clearTimeout(timer);if(!other)timer=setTimeout(()=>open(dest),1500);
}

async function signOut(){try{await API.signOut()}catch(e){}loginView('in')}

async function route(){
 const p=await API.me();if(!p)return loginView('in');
 if(p.role==='pending'||p.active===false||!ROUTE[p.role])return pendingView(p);
 if(p.must_change_pw)return newPasswordView('',true);
 welcomeView(p,ROUTE[p.role]);
}

async function boot(){
 if(!(await tenantStep()))return;
 if(!valid(readCfg()))return setupView();
 try{
  if(/type=recovery/.test(location.hash)){await sb();return} /* the auth listener opens the new-password view */
  const s=await API.session();if(!s)return loginView('in');
  await route();
 }catch(e){loginView('in','',ARmsg(e.message))}
}
window.fmStartBoot=boot;
boot();
})();
</script>
